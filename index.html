<script>
/* ============================================================
   Projekt-Kompass – Prototyp
   Die App führt die Projektakte, das lokale Modell (Ollama)
   füllt sie aus, stellt Fragen und schlägt Ablaufänderungen vor.
   ============================================================ */

const STORE_KEY = 'projektkompass.v1';
const KOMPLEX = {
  auto:     { name: 'Automatisch', info: 'Kompass schlägt vor' },
  quick:    { name: 'Quick',       info: '≈ 10 Min., 6–8 Fragen' },
  standard: { name: 'Standard',    info: '≈ 30 Min., 10–15 Fragen' },
  deep:     { name: 'Deep',        info: '≈ 60 Min., 16–24 Fragen' }
};
const STATUS_TEXT = { leer: 'offen', bestaetigt: 'bestätigt', annahme: 'Annahme', pruefen: 'prüfen' };

const METHODEN = `METHODENBIBLIOTHEK (wähle passend zum Projekt aus, übersetze in Alltagsfragen):
- Problemdefinition: Welches Problem wird gelöst, für wen, warum jetzt?
- Ziel & Erfolgskriterien: Woran erkennt man Erfolg? Wann ist man zufrieden, nicht nur fertig?
- Zielgruppe / Persona: Wer genau? Situation, Bedürfnisse, Einwände, wo erreicht man sie?
- Stakeholder: Wer entscheidet, wer liefert zu, wer kann blockieren?
- Ist-Analyse / Bestand: Was gibt es schon, was funktioniert, was nicht? (nur bei Überarbeitungen)
- Wettbewerb / Umfeld: Wie machen es andere, wie hebt man sich ab?
- SWOT / Risiken: Stärken, Schwächen, Chancen, Risiken, Annahmen mit größtem Risiko
- Scope: Was gehört dazu, was ausdrücklich nicht?
- Botschaft & Tonalität: Kernaussage in einem Satz, gewünschte Wirkung, Handlungsaufforderung
- Gestaltung: Aufbau/Layout, Farbrichtung, Typografie, Bildsprache, Vorgaben (Corporate Design)
- Inhalte & Struktur: Pflichtinhalte, Seiten-/Informationsstruktur, wer liefert Inhalte
- Technik: Plattform, Funktionen, Pflege, Schnittstellen (nur bei digitalen Projekten)
- Kanäle & Verteilung: Wo und wie kommt das Ergebnis zur Zielgruppe?
- Rahmen: Budget, Deadline, Ressourcen, Abhängigkeiten`;

const VORLAGEN = `VORLAGEN NACH PROJEKTART (Startpunkt, an das konkrete Projekt anpassen; Irrelevantes weglassen):
- Gestaltung (Flyer, Plakat, Social-Media-Grafik, Infoblatt, Einladung, Logo) → kategorie "gestaltung":
  problem (Anlass: warum gibt es das?), zielgruppe, ziel, kernbotschaft (ein Satz), pflichtinhalte (ALLE Fakten, die draufmüssen: was ist es, wann, wo, Ablauf/Zeiten, Kosten, Anmeldung, Kontakt), handlung (was sollen Leser danach tun?), ausgabe (Medium und Format: Druck oder Web, Größe, Dateityp), tonalitaet, gestaltung (Farben, Schrift, Bilder, Stimmung), vorgaben (Logo, Corporate Design), rahmen (Deadline, Budget, wer gibt frei).
  Bei Gestaltungsprojekten ist pflichtinhalte das wichtigste Feld nach dem Ziel: frage die konkreten Fakten ab.
- Website neu oder Relaunch → kategorie "digital":
  problem, ziel, zielgruppe (mehrere Gruppen), bestand (was gibt es, was funktioniert nicht), seitenstruktur, inhalte (wer liefert Texte/Bilder), funktionen (Formulare, Buchung, Shop), pflege (wer pflegt später), stakeholder, gestaltung, technik, rahmen.
- Veranstaltung oder Aktion → kategorie "organisation":
  problem, ziel, zielgruppe, ablauf, ort_zeit, beteiligte, kommunikation, risiken, rahmen.
- Alles andere (eigenes Vorhaben, Produkt, Prozess) → kategorie "sonstiges": wähle aus der Methodenbibliothek.
Wettbewerb, Stakeholder oder SWOT nur aufnehmen, wenn sie für DIESES Projekt wirklich etwas ändern.`;

const SYSTEM = `Du bist "Projekt-Kompass", ein erfahrener Coach für Projekt- und Designstrategie.
Du führst eine Person mit kurzen, konkreten Fragen durch die Analyse eines Projekts, bevor sie startet.
Antworte immer auf Deutsch und ausschließlich im geforderten JSON-Format.

Grundsätze:
- Genau eine Frage pro Schritt, konkret auf DIESES Projekt bezogen, ohne Methoden-Fachbegriffe.
- Vorschlagen statt leer fragen: gib 2–4 plausible, projektspezifische Antwortvorschläge (vollständige kurze Sätze).
- Trenne streng: Was die Person sagt, ist "bestaetigt". Was du ableitest oder vermutest, ist "annahme".
- Vage Antworten (z. B. "alle", "egal", sehr allgemein) hinterfragst du gezielt, statt weiterzugehen.
- Wenn eine andere Frage gerade wichtiger ist, passt du den Ablauf an.
- Feld-IDs sind kurz, kleingeschrieben, snake_case, ohne Umlaute.
- SPRACHE: Schreibe jedes Wort auf Deutsch. Wechsle niemals in eine andere Sprache oder Schrift (kein Chinesisch, kein Englisch).
- INHALT STATT META: Einträge enthalten konkrete Inhalte des Projekts, nie Sätze über das Gespräch (falsch: "Es gibt keine spezifische Problembeschreibung"; richtig: "Viele Gemeindemitglieder wissen nicht, wie das 24-Stunden-Gebet abläuft").
- FAKTEN NIE ERFINDEN: Daten, Uhrzeiten, Orte, Namen, Preise, Kontaktdaten nur übernehmen, wenn die Person sie nennt. Sonst Platzhalter in eckigen Klammern, z. B. [Datum], [Adresse].

${METHODEN}

${VORLAGEN}`;

/* ---------- JSON-Schemas für Ollama Structured Outputs ---------- */
const S_STR = { type: 'string' };
const S_UPDATE = { type: 'object', properties: { feld: S_STR, wert: S_STR, status: { type: 'string', enum: ['bestaetigt', 'annahme'] } }, required: ['feld', 'wert', 'status'] };
const S_FRAGE = { type: 'object', properties: { feld: S_STR, frage: S_STR, vorschlaege: { type: 'array', items: S_STR } }, required: ['feld', 'frage', 'vorschlaege'] };
const S_FELD = { type: 'object', properties: { id: S_STR, label: S_STR, beschreibung: S_STR, kern: { type: 'boolean' } }, required: ['id', 'label', 'beschreibung', 'kern'] };

const PLAN_SCHEMA = {
  type: 'object',
  properties: {
    titel: S_STR, projekttyp: S_STR,
    kategorie: { type: 'string', enum: ['gestaltung', 'digital', 'organisation', 'sonstiges'] },
    komplexitaet: { type: 'string', enum: ['quick', 'standard', 'deep'] },
    begruendung: S_STR,
    phasen: { type: 'array', items: { type: 'object', properties: { id: S_STR, titel: S_STR, felder: { type: 'array', items: S_FELD } }, required: ['id', 'titel', 'felder'] } },
    vorbefuellt: { type: 'array', items: S_UPDATE },
    erste_frage: S_FRAGE
  },
  required: ['titel', 'projekttyp', 'kategorie', 'komplexitaet', 'begruendung', 'phasen', 'vorbefuellt', 'erste_frage']
};

const TURN_SCHEMA = {
  type: 'object',
  properties: {
    updates: { type: 'array', items: S_UPDATE },
    antwort_vage: { type: 'boolean' },
    ablauf_aenderungen: { type: 'array', items: { type: 'object', properties: {
      aktion: { type: 'string', enum: ['vorziehen', 'feld_hinzufuegen', 'feld_ueberspringen', 'pruefen', 'phase_hinzufuegen', 'komplexitaet_aendern'] },
      feld: S_STR, phase: S_STR, label: S_STR, beschreibung: S_STR,
      komplexitaet: { type: 'string', enum: ['quick', 'standard', 'deep'] },
      grund: S_STR
    }, required: ['aktion', 'grund'] } },
    naechste_frage: S_FRAGE
  },
  required: ['updates', 'antwort_vage', 'ablauf_aenderungen', 'naechste_frage']
};

const EXPAND_SCHEMA = {
  type: 'object',
  properties: { neue_felder: { type: 'array', items: { type: 'object', properties: { phase: S_STR, phase_titel: S_STR, id: S_STR, label: S_STR, beschreibung: S_STR }, required: ['phase', 'phase_titel', 'id', 'label', 'beschreibung'] } } },
  required: ['neue_felder']
};

const RESULT_SCHEMA = {
  type: 'object',
  properties: {
    titel: S_STR, kurzbeschreibung: S_STR,
    ziel_in_einem_satz: S_STR, zielgruppe_kurz: S_STR, kernbotschaft: S_STR, erfolg_messbar: S_STR,
    strategien: { type: 'array', items: { type: 'object', properties: {
      name: S_STR, idee: S_STR, umsetzung: { type: 'array', items: S_STR }, staerke: S_STR, risiko: S_STR
    }, required: ['name', 'idee', 'umsetzung', 'staerke', 'risiko'] } },
    empfehlung: { type: 'object', properties: { strategie: S_STR, begruendung: S_STR }, required: ['strategie', 'begruendung'] },
    naechste_schritte: { type: 'array', items: { type: 'object', properties: { schritt: S_STR, detail: S_STR }, required: ['schritt', 'detail'] } },
    risiken: { type: 'array', items: S_STR },
    offene_fragen: { type: 'array', items: S_STR },
    leitfarbe: S_STR, schlagworte: { type: 'array', items: S_STR }
  },
  required: ['titel', 'kurzbeschreibung', 'ziel_in_einem_satz', 'zielgruppe_kurz', 'kernbotschaft', 'erfolg_messbar', 'strategien', 'empfehlung', 'naechste_schritte', 'risiken', 'offene_fragen', 'leitfarbe', 'schlagworte']
};

const S_FARBE = { type: 'object', properties: { name: S_STR, hex: S_STR, rolle: S_STR }, required: ['name', 'hex', 'rolle'] };
const DESIGN_RESULT_SCHEMA = {
  type: 'object',
  properties: {
    ...RESULT_SCHEMA.properties,
    textentwurf: { type: 'object', properties: {
      headline: S_STR, subline: S_STR,
      abschnitte: { type: 'array', items: { type: 'object', properties: { ueberschrift: S_STR, text: S_STR }, required: ['ueberschrift', 'text'] } },
      handlungsaufforderung: S_STR
    }, required: ['headline', 'subline', 'abschnitte', 'handlungsaufforderung'] },
    strategien: { type: 'array', items: { type: 'object', properties: {
      name: S_STR, idee: S_STR, aufbau: { type: 'array', items: S_STR }, farben: { type: 'array', items: S_FARBE },
      typografie: S_STR, schrift_headline: S_STR, schrift_text: S_STR,
      layout_typ: { type: 'string', enum: ['zentriert', 'linksbuendig', 'geteilt', 'bild_oben'] },
      motiv: S_STR, bildsprache: S_STR, staerke: S_STR, risiko: S_STR
    }, required: ['name', 'idee', 'aufbau', 'farben', 'typografie', 'schrift_headline', 'schrift_text', 'layout_typ', 'motiv', 'bildsprache', 'staerke', 'risiko'] } },
    format: { type: 'string', enum: ['hochformat', 'quer', 'quadrat'] }
  },
  required: [...RESULT_SCHEMA.required, 'textentwurf', 'format']
};

/* ---------- State ---------- */
function freshState(keep = {}) {
  return {
    screen: 'start',
    host: keep.host || 'http://localhost:11434',
    model: keep.model || '', think: keep.think !== false, provider: keep.provider || 'ollama', kategorie: '',
    beschreibung: '', komplexitaet: 'auto',
    titel: '', typ: '', begruendung: '',
    phasen: [], aktuell: null, verlauf: [], log: [], vorschlaege: [],
    ergebnis: null, ergebnisZeit: 0, check: {}, module: {}, activeModule: '', prevScreen: '', design: null
  };
}
let S = load() || freshState();
S.module = S.module || {};
let ui = { busy: false, busyText: '', error: null, retry: null, editing: null, models: [], conn: 'unknown', live: null, calls: [], lastCall: null, inspector: false };

function load() { try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch { return null; } }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {} }

/* ---------- Helpers ---------- */
const $ = sel => document.querySelector(sel);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function slug(s) {
  return String(s || 'feld').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'feld';
}
const allFields = () => S.phasen.flatMap(p => p.felder);
const activeFields = () => allFields().filter(f => !f.skipped);
const findField = id => allFields().find(f => f.id === id);
const phaseOf = id => S.phasen.find(p => p.felder.some(f => f.id === id));
const isOpen = f => !f.skipped && (!f.wert || f.status === 'pruefen' || f.status === 'leer');
const openFields = () => activeFields().filter(isOpen);
function uniqueId(base) { let id = slug(base), n = 2; const ids = new Set(allFields().map(f => f.id)); while (ids.has(id)) id = slug(base) + '_' + n++; return id; }
function progress() { const a = activeFields(); if (!a.length) return 0; return Math.round(100 * a.filter(f => !isOpen(f)).length / a.length); }
function addLog(text, grund) { S.log.unshift({ text, grund: grund || '', zeit: Date.now() }); S.log = S.log.slice(0, 40); }
function makeField(raw, phaseId) {
  return { id: uniqueId(raw.id || raw.label), label: raw.label || raw.id, beschreibung: raw.beschreibung || '', kern: !!raw.kern, wert: '', status: 'leer', gesperrt: false, skipped: false, phase: phaseId };
}
function genericQuestion(f) {
  return { feld: f.id, frage: f.beschreibung ? `${f.label}: ${f.beschreibung}` : `Was weißt du schon zu „${f.label}“?`, vorschlaege: [], nachfrage: false, verschoben: false };
}

/* ---------- Ollama ---------- */
/* ---------- KI-Server: Ollama oder OpenAI-kompatibel (LM Studio, llama.cpp, Jan, vLLM, Cloud) ---------- */
const ANBIETER = {
  ollama: { name: 'Ollama', host: 'http://localhost:11434', info: 'lokal, Standard-Port 11434' },
  lmstudio: { name: 'LM Studio', host: 'http://localhost:1234', info: 'lokal, Standard-Port 1234', openai: true },
  openai: { name: 'Anderer Server', host: 'http://localhost:8080', info: 'OpenAI-kompatibel: llama.cpp, Jan, vLLM oder Cloud-API', openai: true }
};
const KEY_STORE = 'projektkompass.apikey';
const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ''; } catch { return ui.memKey || ''; } };
const setKey = k => { ui.memKey = k; try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch {} };
const isOpenAI = () => !!(ANBIETER[S.provider] || ANBIETER.ollama).openai;
const srvName = () => (ANBIETER[S.provider] || ANBIETER.ollama).name === 'Anderer Server' ? 'Der KI-Server' : (ANBIETER[S.provider] || ANBIETER.ollama).name;
const apiBase = () => String(S.host || '').trim().replace(/\/+$/, '').replace(/\/v1$/, '');
const authH = () => { const k = getKey(); return k ? { Authorization: 'Bearer ' + k } : {}; };
const isLocalHost = u => /^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:|\/|$)/i.test(u);
const pageIsLocal = () => /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === 'file:';
const isCloud = () => !isLocalHost(apiBase()) && !/^https?:\/\/(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|[^/]*\.local)/i.test(apiBase());
/* Eine HTTPS-Seite darf keine unverschlüsselten Adressen anderer Rechner aufrufen (localhost ausgenommen) */
const mixedBlocked = () => location.protocol === 'https:' && /^http:/i.test(apiBase()) && !isLocalHost(apiBase());

async function checkServer() {
  ui.connMsg = '';
  if (mixedBlocked()) { ui.conn = 'mixed'; ui.models = []; renderConn(); if (S.screen === 'start') render(); return; }
  try {
    const r = await fetch(apiBase() + (isOpenAI() ? '/v1/models' : '/api/tags'), { headers: authH() });
    if (r.status === 401 || (r.status === 403 && isOpenAI())) { ui.conn = 'auth'; ui.models = []; renderConn(); if (S.screen === 'start') render(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    ui.models = isOpenAI() ? (d.data || []).map(m => m.id).filter(Boolean).sort() : (d.models || []).map(m => m.name);
    ui.conn = 'on';
    if (!S.model || !ui.models.includes(S.model)) S.model = ui.models[0] || '';
  } catch (e) { ui.conn = 'off'; ui.models = []; ui.connMsg = e.message; }
  renderConn(); if (S.screen === 'start') render();
}
const checkOllama = checkServer;

/* Antwortformat erzwingen: OpenAI-kompatible Server kennen verschiedene Stufen */
const RF_STUFEN = ['json_schema', 'json_object', 'keins'];

/* Was die einzelnen KI-Aufrufe tun, und wie lang ihre Antwort ungefähr wird (für die geschätzte Fortschrittsanzeige) */
const KIND = {
  plan:   { name: 'Ablauf für dein Projekt planen', expect: 2200 },
  turn:   { name: 'Antwort einsortieren, nächste Frage wählen', expect: 900 },
  expand: { name: 'Zusätzliche Fragen ergänzen', expect: 700 },
  result: { name: 'Projekt-Steckbrief schreiben', expect: 3200 }
};
const now = () => performance.now();
/* Obergrenze für die Antwortlänge (Tokens), damit Ollama in jedem Fall stoppt */
const TOK = { plan: 2500, turn: 1200, expand: 1000, result: 3600, design: 3200 };
const tokLimit = (kind, think) => (TOK[kind] || 3000) + (think === false ? 0 : 3000);
/* JSON auch dann finden, wenn das Modell Text oder Codeblöcke drumherum schreibt */
function parseJSONLoose(t) {
  try { return JSON.parse(t); } catch {}
  const f = t.replace(/```(?:json)?/gi, '');
  try { return JSON.parse(f.trim()); } catch {}
  const a = f.indexOf('{'), b = f.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(f.slice(a, b + 1)); } catch {} }
  return null;
}
/* Chinesisch, Japanisch, Koreanisch, Kyrillisch: Zeichen eines Sprachwechsels */
const FOREIGN = /[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af\u0400-\u04ff\uff00-\uffef]/;
function cleanForeign(o) {
  if (typeof o === 'string') { const i = o.search(FOREIGN); return i < 0 ? o : (o.slice(0, i).replace(/[\s,;:]+$/, '') + ' …'); }
  if (Array.isArray(o)) return o.map(cleanForeign);
  if (o && typeof o === 'object') return Object.fromEntries(Object.entries(o).map(([k, v]) => [k, cleanForeign(v)]));
  return o;
}
const sec = ms => (ms / 1000).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' s';

/* Schutz gegen Denkschleifen: zu langes Nachdenken oder ständig wiederholte Zeilen */
const THINK_MAX_TOKENS = 2500;
/* Nur Fließtext prüfen: Zeilen, die nach JSON aussehen ("feld": wert, Klammern), wiederholen sich in
   gültigen Antworten ganz normal und dürfen keine Schleife auslösen. */
const JSONISH = /^\s*(["{}\[\],]|\d|true|false|null)/;
function looksLikeLoop(t) {
  const tail = t.slice(-3000);
  const lines = tail.split('\n').filter(l => !JSONISH.test(l)).map(l => l.replace(/^[\s*\-•>]+/, '').trim()).filter(l => l.length > 30);
  const count = {};
  for (const l of lines) if ((count[l] = (count[l] || 0) + 1) >= 5) return true;
  return false;
}

async function llm(userPrompt, schema, kind = 'turn', opts = {}) {
  const attempt = opts.attempt || 1;
  if (!S.model) throw new Error(isOpenAI() ? 'Kein Modell ausgewählt. Lade in deinem KI-Server ein Modell und klicke auf der Startseite auf „Verbinden“.' : 'Kein Modell ausgewählt. Lade zuerst ein Modell in Ollama (z. B. „ollama pull …“).');
  if (mixedBlocked()) throw new Error('Diese Seite läuft über HTTPS und darf deshalb keine unverschlüsselte Adresse eines anderen Rechners aufrufen. Nutze http://localhost oder eine HTTPS-Adresse.');
  const think = ui.thinkUnsupported ? undefined : (opts.think !== undefined ? opts.think : (S.think === false || ui.sessionNoThink ? false : undefined));
  const L = ui.live = { kind, attempt, model: S.model, think, phase: 'senden', t0: now(), tResp: null, tThink: null, tWrite: null, tEnd: null, thinking: '', content: '', tokens: 0, thinkTokens: 0, stats: null };
  updateLive();
  const oa = isOpenAI(), rf = ui.rfStufe || 'json_schema';
  const temp = kind === 'result' ? 0.3 : kind === 'frei' || kind === 'gelenkt' || kind === 'layout' ? 0.8 : 0.4;
  const msgs = [{ role: 'system', content: SYSTEM }, { role: 'user', content: rf === 'json_schema' || !oa ? userPrompt : userPrompt + '\n\nAntworte ausschließlich mit einem JSON-Objekt nach diesem Schema:\n' + JSON.stringify(schema) }];
  const body = oa
    ? { model: S.model, stream: true, temperature: temp, max_tokens: tokLimit(kind, think), messages: msgs,
        ...(rf === 'json_schema' ? { response_format: { type: 'json_schema', json_schema: { name: 'antwort', schema, strict: false } } } : rf === 'json_object' ? { response_format: { type: 'json_object' } } : {}) }
    : { model: S.model, stream: true, format: schema, options: { temperature: temp, num_ctx: 8192, num_predict: tokLimit(kind, think) }, messages: msgs };
  if (think === false && !oa) body.think = false;
  const ctrl = new AbortController();
  let abortWhy = null;
  ui.cancel = () => { abortWhy = 'user'; ctrl.abort(); };
  const next = (extra) => llm(userPrompt, schema, kind, { ...opts, attempt: attempt + 1, ...extra });
  const logCall = (ok, note) => {
    ui.calls.unshift({ kind, model: L.model, prompt: userPrompt, thinking: L.thinking, content: L.content, ms: (L.tEnd || now()) - L.t0, stats: L.stats, ok, note, zeit: new Date() });
    ui.calls = ui.calls.slice(0, 20); ui.lastCall = ui.calls[0];
  };

  let r;
  try {
    r = await fetch(apiBase() + (oa ? '/v1/chat/completions' : '/api/chat'), { method: 'POST', headers: { 'Content-Type': 'application/json', ...authH() }, body: JSON.stringify(body), signal: ctrl.signal });
  } catch (e) {
    if (abortWhy === 'user') throw new Error('Abgebrochen. Du kannst es erneut versuchen, zum Beispiel ohne Denkphase.');
    throw new Error(`${srvName()} ist unter ${apiBase()} nicht erreichbar oder blockiert diese Seite. Auf der Startseite unter „KI-Server“ steht, was zu tun ist.`);
  }
  if (!r.ok) {
    const t = (await r.text()).slice(0, 300);
    if (r.status === 401 || (oa && r.status === 403)) { ui.conn = 'auth'; renderConn(); throw new Error('Der Zugangsschlüssel fehlt oder ist falsch. Trag ihn auf der Startseite unter „KI-Server“ ein.'); }
    if (body.think === false && /think/i.test(t)) { ui.thinkUnsupported = true; return llm(userPrompt, schema, kind, { ...opts, think: undefined }); }
    /* Server kennt das strenge Antwortformat nicht: eine Stufe einfacher versuchen */
    if (oa && [400, 404, 415, 422, 500].includes(r.status) && /response_format|json_schema|json_object|schema|grammar/i.test(t) && rf !== 'keins') {
      ui.rfStufe = RF_STUFEN[RF_STUFEN.indexOf(rf) + 1];
      return llm(userPrompt, schema, kind, opts);
    }
    throw new Error(`${srvName()} meldet einen Fehler (HTTP ${r.status}): ${t}`);
  }
  L.tResp = now(); L.phase = 'warten'; updateLive();

  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        let line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        if (oa) {
          /* OpenAI-kompatibel: Server-Sent Events */
          if (!line.startsWith('data:')) continue;
          line = line.slice(5).trim();
          if (line === '[DONE]') { L.doneReason = L.doneReason || 'stop'; continue; }
        }
        let c; try { c = JSON.parse(line); } catch { continue; }
        if (c.error) throw new Error(`${srvName()}: ${typeof c.error === 'string' ? c.error : c.error.message || JSON.stringify(c.error)}`);
        let m = c.message || {};
        if (oa) {
          const ch = (c.choices || [])[0] || {}, dl = ch.delta || {};
          m = { content: dl.content || '', thinking: dl.reasoning_content || dl.reasoning || '' };
          if (ch.finish_reason) L.doneReason = ch.finish_reason;
          if (c.usage) L.stats = { promptTokens: c.usage.prompt_tokens, outTokens: c.usage.completion_tokens, outDur: L.tWrite ? (now() - (L.tThink || L.tWrite)) * 1e6 : 0 };
        }
        if (m.thinking) { if (!L.tThink) L.tThink = now(); L.phase = 'denken'; L.thinking += m.thinking; L.tokens++; L.thinkTokens++; }
        if (m.content) { if (!L.tWrite) L.tWrite = now(); L.phase = 'schreiben'; L.content += m.content; L.tokens++; }
        if (c.done) L.doneReason = c.done_reason;
      if (c.done) L.stats = { load: c.load_duration, promptTokens: c.prompt_eval_count, promptDur: c.prompt_eval_duration, outTokens: c.eval_count, outDur: c.eval_duration, total: c.total_duration };
      }
      if (think === false && L.thinkTokens > 150) ui.thinkIgnored = true;
      if (!abortWhy && L.phase === 'denken') {
        if (looksLikeLoop(L.thinking.slice(-1200)) || (L.thinkTokens % 50 === 0 && looksLikeLoop(L.thinking))) abortWhy = 'loop';
        else if (L.thinkTokens > THINK_MAX_TOKENS || L.thinking.length > 12000 || now() - L.tThink > 90000) abortWhy = 'long';
      }
      /* Modelle, die ihre Überlegungen in die Antwort selbst schreiben */
      if (!abortWhy && L.phase === 'schreiben') {
        const j = L.content.indexOf('{'), pre = j < 0 ? L.content : L.content.slice(0, j);
        /* Text vor dem eigentlichen Ergebnis: endloses Überlegen in der Antwort */
        if (pre.length > 4000 || (pre.length > 600 && looksLikeLoop(pre))) abortWhy = 'repeat';
        /* Ergebnis selbst: nur eine großzügige Längengrenze, keine Zeilenprüfung */
        else if (L.content.length > (KIND[kind] || KIND.turn).expect * 8 + 4000) abortWhy = 'repeat';
      }
      if (abortWhy) ctrl.abort();
      scheduleLive();
    }
  } catch (e) {
    if (!abortWhy) throw e;
  }
  if (abortWhy === 'user') { L.tEnd = now(); logCall(false, 'von dir abgebrochen'); throw new Error('Abgebrochen. Du kannst es erneut versuchen, zum Beispiel ohne Denkphase.'); }
  /* Lag schon ein vollständiges Ergebnis vor, wird es trotz Abbruch verwendet */
  if (abortWhy === 'repeat' && parseJSONLoose(L.content.replace(/^[\s\S]*?<\/think>/, '').trim())) abortWhy = null;
  if (abortWhy) {
    L.tEnd = now();
    logCall(false, abortWhy === 'loop' ? 'Denkschleife erkannt, neuer Versuch ohne Denkphase' : abortWhy === 'repeat' ? 'Antwort lief aus dem Ruder, neuer Versuch' : 'zu lange nachgedacht, neuer Versuch ohne Denkphase');
    if (abortWhy !== 'repeat' || think !== false) {
      ui.sessionNoThink = true;
      ui.notice = 'Das Modell hat sich beim Nachdenken festgefahren. Die Denkphase ist für den Rest dieser Sitzung ausgeschaltet.';
    }
    if (attempt < 3) return next({ think: false });
    throw new Error(ui.thinkIgnored
      ? 'Dieses Modell denkt auch weiter, wenn die Denkphase abgeschaltet ist, und kommt zu keinem Ende. Wähle ein anderes Modell (z. B. eine Variante ohne „-mlx“ oder qwen3:14b) und versuche es erneut.'
      : 'Das Modell kommt zu keiner Antwort. Versuche ein anderes Modell.');
  }
  L.tEnd = now(); L.phase = 'pruefen'; updateLive();

  const txt = L.content.replace(/^[\s\S]*?<\/think>/, '').trim();
  let parsed = parseJSONLoose(txt);
  if (oa && !parsed && rf === 'json_schema' && !L.content.trim()) { ui.rfStufe = 'json_object'; logCall(false, 'leere Antwort, neuer Versuch mit einfacherem Format'); if (attempt < 3) return next({}); }
  if (!parsed && L.doneReason === 'length' && think !== false) {
    logCall(false, 'Längenlimit beim Nachdenken erreicht, neuer Versuch ohne Denkphase');
    ui.sessionNoThink = true;
    ui.notice = 'Das Modell hat beim Nachdenken sein Limit erreicht. Die Denkphase ist für den Rest dieser Sitzung ausgeschaltet.';
    if (attempt < 3) return next({ think: false });
  }
  let foreign = parsed && FOREIGN.test(txt);
  if (foreign && attempt >= 3) { parsed = cleanForeign(parsed); foreign = false; ui.notice = 'Das Modell ist teilweise in eine andere Sprache gewechselt. Diese Stellen wurden abgeschnitten, bitte prüfen.'; }
  logCall(!!parsed && !foreign, foreign ? 'Sprachwechsel erkannt, neuer Versuch' : parsed ? '' : 'ungültiges Format, neuer Versuch');
  if (foreign) return llm(userPrompt.replace(/\n\nACHTUNG: [^\n]*$/, '') + '\n\nACHTUNG: Deine letzte Antwort enthielt chinesische oder andere fremdsprachige Zeichen. Schreibe ALLES ausschließlich auf Deutsch.', schema, kind, { ...opts, attempt: attempt + 1 });
  if (parsed) return parsed;
  if (attempt < 3) return next(think !== false ? { think: false } : {});
  throw new Error(ui.thinkIgnored ? 'Dieses Modell lässt sich die Denkphase nicht abschalten und liefert keine gültigen Daten. Wähle ein anderes Modell.' : 'Das Modell hat keine gültigen Daten geliefert. Versuche es erneut oder wähle ein anderes Modell. Details findest du im Protokoll.');
}

async function run(text, fn) {
  ui.busy = true; ui.busyText = text; ui.error = null; ui.live = null; render();
  const liveEl = document.getElementById('live');
  if (liveEl) liveEl.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  const timer = setInterval(updateLive, 200);
  try { await fn(); ui.retry = null; }
  catch (e) { ui.error = e.message; ui.retry = () => run(text, fn); console.error(e); }
  clearInterval(timer);
  ui.busy = false; ui.cancel = null; save(); render();
}

/* ---------- Live-Ansicht ---------- */
let liveQueued = false;
function scheduleLive() { if (liveQueued) return; liveQueued = true; requestAnimationFrame(() => { liveQueued = false; updateLive(); }); }
function updateLive() { const el = document.getElementById('live'); if (el) el.innerHTML = liveInner(); }

const SNIP_LABEL = { titel: 'Titel', projekttyp: 'Projekttyp', frage: 'Frage', wert: 'Eintrag', label: 'Feld', grund: 'Begründung', name: 'Strategie', idee: 'Idee', schritt: 'Schritt', begruendung: 'Begründung', strategie: 'Empfehlung' };
function snippets(content) {
  const out = [], re = /"(titel|projekttyp|frage|wert|label|grund|name|idee|schritt|begruendung|strategie)"\s*:\s*"((?:[^"\\]|\\.)*)/g;
  let m; while ((m = re.exec(content))) out.push([SNIP_LABEL[m[1]], m[2].replace(/\\n/g, ' ').replace(/\\"/g, '"').replace(/\\\\/g, '\\')]);
  return out.filter(([, v]) => v.trim()).slice(-6);
}

function liveInner() {
  const L = ui.live, t = now();
  const head = (title) => `<div class="live-head">${needleSvg()}<b>${esc(title)}</b><span class="live-time">${L ? sec((L.tEnd || t) - L.t0) : ''}</span></div>`;
  if (!L) return head(ui.busyText || 'Einen Moment …');
  const k = KIND[L.kind] || KIND.turn;
  const order = ['senden', 'warten', 'denken', 'schreiben', 'pruefen'];
  const pos = order.indexOf(L.phase);
  const state = id => pos > order.indexOf(id) ? 'done' : L.phase === id ? 'active' : '';
  const firstOut = L.tThink || L.tWrite;
  const steps = [
    ['senden', `Anfrage an ${L.model} senden`, L.tResp ? sec(L.tResp - L.t0) : ''],
    ['warten', 'Modell laden und Projektakte lesen', L.tResp ? sec((firstOut || L.tEnd || t) - L.tResp) : ''],
  ];
  if (L.tThink || (S.think !== false && L.phase === 'warten')) steps.push(['denken', 'Nachdenken', L.tThink ? sec((L.tWrite || L.tEnd || t) - L.tThink) : '']);
  steps.push(['schreiben', 'Antwort schreiben', L.tWrite ? sec((L.tEnd || t) - L.tWrite) : '']);
  steps.push(['pruefen', 'Antwort prüfen und übernehmen', '']);

  const rate = firstOut ? L.tokens / Math.max(0.1, ((L.tEnd || t) - firstOut) / 1000) : 0;
  const pct = Math.min(95, Math.round(100 * L.content.length / k.expect));
  const sn = snippets(L.content);
  const waitHint = L.phase === 'warten' && (t - L.tResp) > 4000
    ? `<div class="live-meta">Beim ersten Aufruf lädt der KI-Server das Modell in den Arbeitsspeicher. Das kann einige Sekunden dauern, danach geht es schneller.</div>` : '';

  const thinkWarn = L.phase === 'denken' && L.thinkTokens > 1200
    ? `<div class="live-meta">Das Modell denkt sehr lange nach (${L.thinkTokens} von max. ${THINK_MAX_TOKENS} Tokens). Wird es zu viel, fragt die App automatisch ohne Denkphase neu an.</div>` : '';
  return `${head(k.name)}
    ${L.attempt > 1 ? `<div class="live-meta">Versuch ${L.attempt}: ${esc((ui.calls[0] && ui.calls[0].note) || 'die vorige Antwort war kein gültiges Format.')}</div>` : ''}
    <ol class="steps-live">${steps.map(([id, txt, tm]) => `<li class="${state(id)}"><span class="st"></span><span>${esc(txt)}</span><span class="t">${tm}</span></li>`).join('')}</ol>
    ${L.phase === 'schreiben' ? `<div class="estbar"><i style="width:${pct}%"></i></div><div class="live-meta">ca. ${pct} % geschätzt · ${L.tokens} Tokens · ${rate.toFixed(0)} Tokens/s</div>`
      : (L.phase === 'warten' || L.phase === 'denken') ? `<div class="estbar indet"><i></i></div><div class="live-meta">${L.phase === 'denken' ? `${L.tokens} Tokens gedacht · ${rate.toFixed(0)} Tokens/s` : 'Warte auf die ersten Wörter …'}</div>` : ''}
    ${waitHint}${thinkWarn}
    ${sn.length ? `<div class="snips">${sn.map(([l, v]) => `<div class="snip"><b>${esc(l)}:</b>${esc(v)}</div>`).join('')}</div>` : ''}
    ${L.thinking ? `<details ${L.phase === 'denken' ? 'open' : ''}><summary>Gedanken des Modells</summary><div class="mono">${esc(L.thinking.slice(-1500))}</div></details>` : ''}
    ${L.content ? `<details><summary>Rohdaten der Antwort</summary><div class="mono">${esc(L.content.slice(-2000))}</div></details>` : ''}
    <div class="live-foot"><button class="btn tiny" data-act="cancel">Abbrechen</button>${L.think === false ? '<span class="small muted">ohne Denkphase</span>' : ''}</div>`;
}

function statLine() {
  const c = ui.lastCall; if (!c) return '';
  const s = c.stats || {};
  const parts = [`Letzte KI-Antwort: ${sec(c.ms)}`];
  if (s.load > 5e8) parts.push(`davon Modell laden ${sec(s.load / 1e6)}`);
  if (s.outTokens) parts.push(`${s.outTokens} Tokens, ${(s.outTokens / (s.outDur / 1e9)).toFixed(0)} Tokens/s`);
  return `<div class="statline"><span>${parts.join(' · ')}</span><button class="linkbtn" data-act="inspector">${ui.inspector ? 'Protokoll schließen' : 'Protokoll ansehen'}</button></div>`;
}

function viewInspector() {
  if (!ui.inspector) return '';
  return `<section class="inspector" aria-label="Protokoll">
    <div class="side-head"><h3>Protokoll der KI-Aufrufe</h3><button class="linkbtn" data-act="inspector">Schließen</button></div>
    <p class="small muted" style="margin:0 0 8px">Was die App an das Modell geschickt hat und was zurückkam. Nur für diese Sitzung, nichts wird gespeichert.</p>
    ${ui.calls.length ? ui.calls.map(c => {
      let pretty = c.content; try { pretty = JSON.stringify(JSON.parse(c.content), null, 2); } catch {}
      return `<details class="call"><summary>${esc((KIND[c.kind] || {}).name || c.kind)} <span>· ${c.zeit.toLocaleTimeString('de-DE')} · ${sec(c.ms)}${c.stats && c.stats.outTokens ? ' · ' + c.stats.outTokens + ' Tokens' : ''}${c.note ? ' · ' + esc(c.note) : c.ok ? '' : ' · ungültig'}</span></summary>
        <h4>Anfrage an ${esc(c.model)}</h4><div class="mono">${esc(c.prompt)}</div>
        ${c.thinking ? `<h4>Gedanken</h4><div class="mono">${esc(c.thinking)}</div>` : ''}
        <h4>Antwort</h4><div class="mono">${esc(pretty)}</div></details>`;
    }).join('') : '<p class="small muted">Noch keine Aufrufe.</p>'}
  </section>`;
}

function akte() {
  return JSON.stringify({
    projekt: { titel: S.titel, typ: S.typ, komplexitaet: S.komplexitaet, beschreibung: S.beschreibung },
    phasen: S.phasen.map(p => ({ phase: p.id, titel: p.titel, felder: p.felder.filter(f => !f.skipped).map(f => ({ id: f.id, label: f.label, beschreibung: f.beschreibung, wert: f.wert, status: f.status, gesperrt: f.gesperrt, kern: f.kern })) })),
    vertiefungen: typeof vertiefungenKontext === 'function' ? vertiefungenKontext() : {}
  });
}

/* ---------- Schritt 1: Plan ---------- */
function startProject() {
  const text = $('#desc').value.trim();
  if (text.length < 10) { ui.error = 'Beschreibe dein Projekt in ein, zwei Sätzen, damit der Kompass loslegen kann.'; render(); return; }
  S.beschreibung = text;
  run('Kompass liest dein Projekt …', async () => {
    const k = S.komplexitaet;
    const prompt = `PROJEKTBESCHREIBUNG DER PERSON:
"""${text}"""

GEWÄHLTE KOMPLEXITÄT: ${k === 'auto' ? 'automatisch – schlage selbst passend vor' : k}

AUFGABE: Plane die Analyse für dieses Projekt.
- Bestimme Projekttyp (z. B. Flyer, Website-Relaunch, App, Event, Kampagne …), die kategorie laut Vorlagen und einen kurzen Arbeitstitel.
- Nimm die passende Vorlage als Basis und passe sie an. Was die Person ausdrücklich erwähnt (z. B. "informieren, wann welche Zeiten sind, wo es stattfindet"), MUSS als eigenes Feld oder in pflichtinhalte vorkommen.
- Komplexität: quick = 6–8 Felder in 2–3 Phasen; standard = 10–15 Felder in 3–5 Phasen; deep = 16–24 Felder in 4–6 Phasen.${k === 'auto' ? ' Wähle die passende und begründe kurz.' : ' Halte dich an die gewählte Komplexität.'}
- Wähle aus der Methodenbibliothek nur, was für DIESES Projekt relevant ist. Phasen in sinnvoller Reihenfolge (vom Warum zum Wie).
- Pflicht: Felder mit den IDs "problem", "ziel" und "zielgruppe" müssen enthalten sein (kern: true). Weitere Kernfelder sparsam.
- Jedes Feld: kurzes Label, Beschreibung = was genau geklärt werden soll (projektspezifisch).
- vorbefuellt: Informationen, die bereits in der Beschreibung stehen, direkt und konkret eintragen (status "bestaetigt"). Nichts erfinden, keine Meta-Sätze.
- erste_frage: die wichtigste noch offene Frage, mit 2–4 projektspezifischen Antwortvorschlägen.`;
    const res = await llm(prompt, PLAN_SCHEMA, 'plan');
    S.titel = res.titel || 'Neues Projekt'; S.typ = res.projekttyp || ''; S.kategorie = res.kategorie || 'sonstiges'; S.begruendung = res.begruendung || '';
    if (S.komplexitaet === 'auto') S.komplexitaet = KOMPLEX[res.komplexitaet] ? res.komplexitaet : 'standard';
    S.phasen = [];
    (res.phasen || []).forEach(p => {
      const ph = { id: slug(p.id || p.titel), titel: p.titel || p.id, felder: [] };
      if (S.phasen.some(x => x.id === ph.id)) ph.id += '_' + S.phasen.length;
      S.phasen.push(ph);
      (p.felder || []).forEach(f => ph.felder.push(makeField(f, ph.id)));
    });
    if (!S.phasen.length) S.phasen.push({ id: 'grundlagen', titel: 'Grundlagen', felder: [] });
    const core = { problem: ['Anlass', 'Warum gibt es das Projekt, und was soll sich dadurch ändern?'], ziel: ['Ziel', 'Was soll am Ende erreicht sein, und woran erkennt man Erfolg?'], zielgruppe: ['Zielgruppe', 'Für wen genau ist das Projekt?'] };
    Object.entries(core).forEach(([id, [label, b]]) => {
      const f = findField(id);
      if (f) f.kern = true;
      else S.phasen[0].felder.unshift({ ...makeField({ id, label, beschreibung: b, kern: true }, S.phasen[0].id), id });
    });
    (res.vorbefuellt || []).forEach(u => { const f = findField(u.feld); if (f && u.wert) { f.wert = u.wert; f.status = u.status; } });
    S.verlauf = []; S.log = []; S.vorschlaege = []; S.ergebnis = null;
    addLog(`Ablauf geplant: ${S.typ}, ${KOMPLEX[S.komplexitaet].name}`, S.begruendung);
    const q = res.erste_frage, f = q && findField(q.feld);
    S.aktuell = f && isOpen(f) ? { feld: f.id, frage: q.frage, vorschlaege: q.vorschlaege || [], nachfrage: false, verschoben: false } : nextFallback();
    S.screen = 'interview';
  });
}

function nextFallback() { const f = openFields()[0]; return f ? genericQuestion(f) : null; }

/* ---------- Schritt 2: Interview-Runde ---------- */
function submitAnswer(answerText) {
  const antwort = (answerText ?? $('#answer').value).trim();
  if (!antwort || !S.aktuell) return;
  const cur = S.aktuell, f = findField(cur.feld);
  ui.notice = null;
  S.verlauf.push({ feld: cur.feld, frage: cur.frage, antwort });
  run('Kompass sortiert deine Antwort ein …', async () => {
    const verlauf = S.verlauf.slice(-6).map(v => `- F: ${v.frage}\n  A: ${v.antwort}`).join('\n');
    const prompt = `AKTUELLE PROJEKTAKTE (JSON):
${akte()}

BISHERIGER VERLAUF (zuletzt):
${verlauf}

AKTUELLE FRAGE zu Feld "${cur.feld}" (${f ? f.label : ''}): ${cur.frage}
ANTWORT DER PERSON: ${antwort}

AUFGABE:
1. updates: Übernimm die Antwort konkret in das Feld "${cur.feld}" (status "bestaetigt"). Behalte alle Fakten (Zeiten, Orte, Namen, Zahlen) vollständig und wörtlich, kürze nur Füllwörter. Keine Meta-Sätze. Beantwortet die Antwort nebenbei andere Felder, trage sie dort auch ein (bestaetigt, wenn ausdrücklich gesagt, sonst "annahme"). Bittet die Person um eine Annahme, triff eine begründete, projektspezifische Annahme mit status "annahme"; bei Fakten (Datum, Uhrzeit, Ort, Kontakt) stattdessen Platzhalter in eckigen Klammern. Felder mit "gesperrt": true niemals ändern.
2. antwort_vage: true, wenn die Antwort zu allgemein ist, um damit zu arbeiten (z. B. "Infos", "alle", "schön"), oder wenn bei einer Frage nach Fakten keine Fakten genannt werden. Dann für dieses Feld nichts eintragen und als naechste_frage eine gezielte Nachfrage zum selben Feld stellen.
3. ablauf_aenderungen (nur wenn wirklich sinnvoll, sonst leeres Array; immer mit kurzem grund):
   - "vorziehen" (feld): ein offenes Feld ist jetzt wichtiger als die geplante Reihenfolge.
   - "feld_hinzufuegen" (phase = bestehende oder neue Phasen-ID, feld, label, beschreibung): ein wichtiger Aspekt fehlt.
   - "feld_ueberspringen" (feld): ein Feld ist für dieses Projekt irrelevant geworden (keine Kernfelder).
   - "pruefen" (feld): die Antwort widerspricht einem früheren Eintrag.
   - "phase_hinzufuegen" (phase = neue ID, label = Titel): ein ganzer Themenblock fehlt; füge seine Felder per feld_hinzufuegen mit dieser phase hinzu.
   - "komplexitaet_aendern" (komplexitaet): das Projekt ist deutlich größer oder kleiner als gedacht.
4. naechste_frage: die wichtigste noch offene Frage (Feld mit leerem wert oder status "pruefen"; bei "vorziehen" genau dieses Feld; bei vager Antwort dasselbe Feld). Mit 2–4 Antwortvorschlägen, die zu den bisherigen Antworten passen. Sind alle Felder gefüllt: feld = "".`;
    const res = await llm(prompt, TURN_SCHEMA, 'turn');
    applyTurn(res, cur, antwort);
  });
}

function applyTurn(res, cur, antwort) {
  const curField = findField(cur.feld);
  // 1. Updates
  (res.updates || []).forEach(u => {
    const f = findField(u.feld);
    if (!f || f.skipped || !u.wert) return;
    if (f.gesperrt && f.id !== cur.feld) return;
    if (res.antwort_vage && f.id === cur.feld) return;
    f.wert = u.wert; f.status = u.status === 'annahme' ? 'annahme' : 'bestaetigt';
    if (f.id !== cur.feld) addLog(`„${f.label}“ nebenbei ausgefüllt`, f.status === 'annahme' ? 'als Annahme – bitte prüfen' : 'aus deiner Antwort übernommen');
  });
  if (curField && !res.antwort_vage && isOpen(curField)) { curField.wert = antwort; curField.status = 'bestaetigt'; }

  // 2. Ablaufänderungen
  let override = null;
  const changes = res.ablauf_aenderungen || [];
  const newPhases = {};
  changes.filter(a => a.aktion === 'phase_hinzufuegen' && a.phase).forEach(a => {
    const id = slug(a.phase);
    if (S.phasen.some(p => p.id === id)) return;
    newPhases[id] = { typ: 'phase', id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6), phase: { id, titel: a.label || a.phase, felder: [] }, grund: a.grund };
  });
  changes.forEach(a => {
    const f = a.feld && findField(a.feld);
    switch (a.aktion) {
      case 'vorziehen':
        if (f && isOpen(f)) { override = f.id; addLog(`„${f.label}“ vorgezogen`, a.grund); }
        break;
      case 'feld_ueberspringen':
        if (f && !f.kern && !f.gesperrt && !f.skipped) { f.skipped = true; addLog(`„${f.label}“ übersprungen`, a.grund); }
        break;
      case 'pruefen':
        if (f && f.wert && f.id !== cur.feld) { f.status = 'pruefen'; addLog(`„${f.label}“ zur Prüfung markiert`, a.grund); }
        break;
      case 'feld_hinzufuegen': {
        if (!a.label && !a.feld) break;
        const pid = slug(a.phase || '');
        if (newPhases[pid]) { newPhases[pid].phase.felder.push({ id: a.feld || a.label, label: a.label || a.feld, beschreibung: a.beschreibung || '' }); break; }
        const ph = S.phasen.find(p => p.id === pid) || phaseOf(cur.feld) || S.phasen[S.phasen.length - 1];
        if (findField(slug(a.feld || a.label))) break;
        const nf = makeField({ id: a.feld || a.label, label: a.label || a.feld, beschreibung: a.beschreibung }, ph.id);
        ph.felder.push(nf); addLog(`Neue Frage „${nf.label}“ in „${ph.titel}“`, a.grund);
        break;
      }
      case 'komplexitaet_aendern':
        if (a.komplexitaet && a.komplexitaet !== S.komplexitaet && !S.vorschlaege.some(v => v.typ === 'komplexitaet'))
          S.vorschlaege.push({ typ: 'komplexitaet', id: 'k' + Date.now(), ziel: a.komplexitaet, grund: a.grund });
        break;
    }
  });
  Object.values(newPhases).forEach(p => S.vorschlaege.push(p));

  // 3. Nächste Frage
  const nf = res.naechste_frage || {};
  let target = override || nf.feld;
  let tf = target && findField(target);
  const sameFollowUp = res.antwort_vage && tf && tf.id === cur.feld;
  if (tf && !tf.skipped && (isOpen(tf) || sameFollowUp)) {
    S.aktuell = tf.id === nf.feld
      ? { feld: tf.id, frage: nf.frage, vorschlaege: nf.vorschlaege || [], nachfrage: !!sameFollowUp, verschoben: !!override }
      : { ...genericQuestion(tf), verschoben: true };
  } else S.aktuell = nextFallback();
}

/* ---------- Vorschläge annehmen/ablehnen ---------- */
function acceptProposal(id) {
  const v = S.vorschlaege.find(x => x.id === id); if (!v) return;
  S.vorschlaege = S.vorschlaege.filter(x => x.id !== id);
  if (v.typ === 'phase') {
    const ph = { id: v.phase.id, titel: v.phase.titel, felder: [] };
    S.phasen.push(ph);
    v.phase.felder.forEach(f => ph.felder.push(makeField(f, ph.id)));
    if (!ph.felder.length) ph.felder.push(makeField({ id: ph.id + '_kern', label: ph.titel, beschreibung: v.grund }, ph.id));
    addLog(`Neuer Block „${ph.titel}“ übernommen`, v.grund);
    if (!S.aktuell) S.aktuell = nextFallback();
    save(); render(); return;
  }
  if (v.typ === 'komplexitaet') {
    const alt = S.komplexitaet; S.komplexitaet = v.ziel;
    if (['quick', 'standard', 'deep'].indexOf(v.ziel) < ['quick', 'standard', 'deep'].indexOf(alt)) {
      addLog(`Auf ${KOMPLEX[v.ziel].name} reduziert`, v.grund);
      activeFields().filter(f => isOpen(f) && !f.kern && !f.gesperrt).slice(Math.ceil(openFields().length / 2)).forEach(f => f.skipped = true);
      if (S.aktuell && findField(S.aktuell.feld).skipped) S.aktuell = nextFallback();
      save(); render(); return;
    }
    run('Kompass erweitert den Ablauf …', async () => {
      const prompt = `AKTUELLE PROJEKTAKTE (JSON):\n${akte()}\n\nDas Projekt wird von "${alt}" auf "${v.ziel}" hochgestuft (Grund: ${v.grund}).\nAUFGABE: Ergänze NUR neue Felder, die bei dieser Tiefe zusätzlich geklärt werden sollten (bestehende nicht wiederholen). Bestehende Phasen-IDs verwenden oder neue anlegen. Insgesamt bei "standard" 10–15, bei "deep" 16–24 Felder.`;
      const res = await llm(prompt, EXPAND_SCHEMA, 'expand');
      let n = 0;
      (res.neue_felder || []).forEach(nf => {
        if (findField(slug(nf.id))) return;
        let ph = S.phasen.find(p => p.id === slug(nf.phase));
        if (!ph) { ph = { id: slug(nf.phase), titel: nf.phase_titel || nf.phase, felder: [] }; S.phasen.push(ph); }
        ph.felder.push(makeField(nf, ph.id)); n++;
      });
      addLog(`Auf ${KOMPLEX[v.ziel].name} erweitert, ${n} neue Fragen`, v.grund);
      if (!S.aktuell) S.aktuell = nextFallback();
    });
  }
}
function rejectProposal(id) { const v = S.vorschlaege.find(x => x.id === id); S.vorschlaege = S.vorschlaege.filter(x => x.id !== id); if (v) addLog('Vorschlag abgelehnt', v.typ === 'phase' ? v.phase.titel : KOMPLEX[v.ziel].name); save(); render(); }

/* ---------- Seitenleiste: Bearbeiten ---------- */
function editField(id) { ui.editing = id; render(); const t = document.getElementById('edit-' + id); if (t) t.focus(); }
function saveEdit(id) {
  const f = findField(id), t = document.getElementById('edit-' + id); if (!f || !t) return;
  const v = t.value.trim();
  if (v) { f.wert = v; f.status = 'bestaetigt'; f.gesperrt = true; addLog(`„${f.label}“ von dir geändert`, 'ist jetzt fixiert'); }
  else { f.wert = ''; f.status = 'leer'; f.gesperrt = false; }
  ui.editing = null;
  if (!S.aktuell) S.aktuell = nextFallback();
  if (S.aktuell && S.aktuell.feld === id && !isOpen(f)) S.aktuell = nextFallback();
  save(); render();
}
function confirmField(id) { const f = findField(id); if (!f) return; f.status = 'bestaetigt'; f.gesperrt = true; addLog(`„${f.label}“ bestätigt`); if (!S.aktuell) S.aktuell = nextFallback(); save(); render(); }
function askNow(id) { const f = findField(id); if (!f) return; S.aktuell = genericQuestion(f); if (f.wert) S.aktuell.frage = `${f.label}: Passt das so, oder möchtest du etwas ändern? („${f.wert}“)`; save(); render(); }
function skipCurrent() {
  const f = S.aktuell && findField(S.aktuell.feld); if (!f || f.kern) return;
  f.skipped = true; addLog(`„${f.label}“ übersprungen`, 'von dir'); S.aktuell = nextFallback(); save(); render();
}
function restoreField(id) { const f = findField(id); if (!f) return; f.skipped = false; addLog(`„${f.label}“ wieder aufgenommen`); if (!S.aktuell) S.aktuell = nextFallback(); save(); render(); }

/* ---------- Schritt 3: Ergebnis ---------- */
function buildResult() {
  run('Kompass schreibt deinen Projekt-Steckbrief …', async () => {
    const offen = openFields().map(f => f.label);
    const design = S.kategorie === 'gestaltung';
    const prompt = design ? `PROJEKTAKTE (JSON):
${akte()}
${offen.length ? '\nNoch offen (als Lücken behandeln, nicht erfinden): ' + offen.join(', ') : ''}

AUFGABE: Erstelle einen Gestaltungs-Steckbrief, mit dem die Person sofort losgestalten kann. Nutze die "vertiefungen" der Akte (Personas, Inhaltsplan, Stakeholder …), falls vorhanden: Inhalte aus dem Inhaltsplan gehören in den Textentwurf, die Personas bestimmen Ton und Ansprache.
- titel, kurzbeschreibung (2–3 Sätze), ziel_in_einem_satz, zielgruppe_kurz, kernbotschaft, erfolg_messbar (konkret beobachtbar).
- textentwurf: fertiger Text für das Medium. headline (kurz, stark), subline, abschnitte (alle Pflichtinhalte als kurze Blöcke, z. B. "Was ist das?", "Wann?", "Wo?", "Mitmachen"), handlungsaufforderung. Fakten nur aus der Akte, fehlende als [Platzhalter].
- strategien: 2–3 klar unterschiedliche GESTALTERISCHE Richtungen (z. B. ruhig & klar, warm & einladend, plakativ & modern), passend zu Tonalität und Zielgruppe. Je Richtung: idee; aufbau = Elemente von oben nach unten (4–7 Punkte); farben = 3–4 Farben mit Name, Hex-Code und Rolle (Hintergrund, Text, Akzent …); typografie = konkrete Schriftempfehlung (frei verfügbare Schriften, z. B. Google Fonts); bildsprache; staerke; risiko.
- Je Richtung zusätzlich: schrift_headline und schrift_text (exakte Google-Fonts-Namen, z. B. "Fraunces", "Source Sans 3", "Nunito"), layout_typ (zentriert | linksbuendig | geteilt | bild_oben; jede Richtung ein anderer), motiv (Bild oder Grafik in wenigen Worten). Die Farben einer Richtung müssen gut lesbar zusammenpassen (Text auf Hintergrund mit starkem Kontrast).
- format: hochformat, quer oder quadrat, passend zum Ausgabemedium.
- leitfarbe: die Akzentfarbe der empfohlenen Richtung als Hex-Code. schlagworte: 3 Wörter, die das Projekt charakterisieren.
- empfehlung: welche Richtung und warum (bezogen auf Ziel, Zielgruppe, Ausgabemedium). Der Name muss exakt einer Richtung entsprechen.
- naechste_schritte: 4–7 konkrete Schritte, passend zur Deadline im Feld Rahmen.
- risiken; offene_fragen (inkl. aller [Platzhalter] und Annahmen).
Alles auf Deutsch.` : `PROJEKTAKTE (JSON):
${akte()}
${offen.length ? '\nNoch offen (als Lücken behandeln, nicht erfinden): ' + offen.join(', ') : ''}

AUFGABE: Erstelle den Projekt-Steckbrief. Nutze die "vertiefungen" der Akte (Problemanalyse, Personas, Stakeholder, SWOT, Inhaltsplan), falls vorhanden, und lass sie sichtbar in Strategien, Schritte und Risiken einfließen.
- titel, kurzbeschreibung (2–3 Sätze), ziel_in_einem_satz, zielgruppe_kurz, kernbotschaft, erfolg_messbar (woran man Erfolg erkennt).
- strategien: 2–3 klar unterschiedliche, projektspezifische Strategien zum Entlanghangeln. Bei Designprojekten in "umsetzung" konkret zu Aufbau/Layout, Farbrichtung, Typografie/Bildsprache und Botschaft. Bei anderen Projekten konkrete Umsetzungsschritte. Je 3–6 Punkte, dazu Stärke und Risiko.
- empfehlung: welche Strategie und warum (bezogen auf Ziel und Zielgruppe).
- naechste_schritte: 4–7 konkrete Schritte in sinnvoller Reihenfolge.
- risiken: die wichtigsten Risiken. offene_fragen: was noch geklärt werden muss (inkl. Prüfung der Annahmen).
- leitfarbe: eine Farbe als Hex-Code, die zur Stimmung dieses Projekts passt (z. B. ruhiges Blau für eine Praxis, sattes Grün für ein Gartenprojekt). schlagworte: 3 Wörter, die das Projekt charakterisieren.`;
    S.ergebnis = await llm(prompt, design ? DESIGN_RESULT_SCHEMA : RESULT_SCHEMA, 'result');
    S.check = {}; ui.tab = null; S.ergebnisZeit = Date.now();
    S.screen = 'result';
  });
}

function ph(t) { return esc(t).replace(/\[([^\]]{1,60})\]/g, '<mark class="ph">[$1]</mark>'); }
const hexOk = h => /^#?[0-9a-f]{3}([0-9a-f]{3})?$/i.test(String(h || '').trim());
const hexNorm = h => { h = String(h).trim(); return h.startsWith('#') ? h : '#' + h; };

function viewStrategy(s, rec) {
  const head = `${rec ? '<div class="rec-note">Empfehlung</div>' : ''}<h3>${esc(s.name)}</h3><p>${esc(s.idee)}</p>`;
  const pc = `<div class="pc"><div><b>Stärke</b><br>${esc(s.staerke)}</div><div><b>Risiko</b><br>${esc(s.risiko)}</div></div>`;
  if (!s.aufbau) return `<div class="strategy ${rec ? 'recommended' : ''}">${head}<ul>${(s.umsetzung || []).map(u => `<li>${esc(u)}</li>`).join('')}</ul>${pc}</div>`;
  return `<div class="strategy ${rec ? 'recommended' : ''}">${head}
    <div class="swatches">${(s.farben || []).map(f => `<div class="sw"><i style="background:${hexOk(f.hex) ? hexNorm(f.hex) : 'transparent'}"></i><span>${esc(f.name)}<small>${esc(hexOk(f.hex) ? hexNorm(f.hex).toUpperCase() : f.hex)} · ${esc(f.rolle)}</small></span></div>`).join('')}</div>
    <b class="small">Aufbau von oben nach unten</b>
    <ol class="layout-list">${s.aufbau.map(a => `<li>${esc(a)}</li>`).join('')}</ol>
    <div class="dl"><b>Schrift</b><span>${esc(s.typografie)}</span><b>Bildsprache</b><span>${esc(s.bildsprache)}</span></div>
    ${pc}</div>`;
}

function resultMarkdown() {
  const r = S.ergebnis; if (!r) return '';
  const L = [];
  L.push(`# ${r.titel}`, '', r.kurzbeschreibung, '');
  L.push(`**Ziel:** ${r.ziel_in_einem_satz}  `, `**Zielgruppe:** ${r.zielgruppe_kurz}  `, `**Kernbotschaft:** ${r.kernbotschaft}  `, `**Erfolg erkennbar an:** ${r.erfolg_messbar}`, '');
  if (r.textentwurf) {
    const t = r.textentwurf;
    L.push('## Textentwurf', '', `**${t.headline}**`, '', t.subline, '');
    t.abschnitte.forEach(a => L.push(`**${a.ueberschrift}**  `, a.text, ''));
    L.push(`➜ ${t.handlungsaufforderung}`, '');
  }
  L.push(r.textentwurf ? '## Gestaltungsrichtungen' : '## Strategien', '');
  r.strategien.forEach(s => {
    L.push(`### ${s.name}${s.name === r.empfehlung.strategie ? ' (Empfehlung)' : ''}`, '', s.idee, '');
    if (s.aufbau) {
      L.push('**Farben:** ' + (s.farben || []).map(f => `${f.name} ${f.hex} (${f.rolle})`).join(', '), '');
      L.push('**Aufbau von oben nach unten:**'); s.aufbau.forEach((a, i) => L.push(`${i + 1}. ${a}`));
      L.push('', `**Schrift:** ${s.typografie}  `, `**Bildsprache:** ${s.bildsprache}`, '');
    } else (s.umsetzung || []).forEach(u => L.push(`- ${u}`));
    L.push('', `*Stärke:* ${s.staerke}  `, `*Risiko:* ${s.risiko}`, '');
  });
  L.push('## Empfehlung', '', `**${r.empfehlung.strategie}**: ${r.empfehlung.begruendung}`, '');
  L.push('## Nächste Schritte', ''); r.naechste_schritte.forEach((s, i) => L.push(`${i + 1}. **${s.schritt}**: ${s.detail}`)); L.push('');
  L.push('## Risiken', ''); r.risiken.forEach(x => L.push(`- ${x}`)); L.push('');
  const ann = activeFields().filter(f => f.status === 'annahme');
  if (ann.length) { L.push('## Annahmen der KI (bitte prüfen)', ''); ann.forEach(f => L.push(`- **${f.label}:** ${f.wert}`)); L.push(''); }
  L.push('## Offene Fragen', ''); r.offene_fragen.forEach(x => L.push(`- ${x}`)); L.push('');
  if (hasEntwurf()) {
    const I = entwurfInfo();
    L.push('## Entwurf aus dem Design-Studio', '', `- **Format:** ${I.format.name} (${I.format.info})`, `- **Layout:** ${I.layout}`, `- **Schriften:** ${I.fonts.filter(Boolean).join(' + ')}`, `- **Farben:** ${Object.entries(I.pal).map(([k, v]) => `${k} ${v}`).join(', ')}`, '');
    if (I.seiten) I.seiten.forEach(pg => { L.push(`### Seite: ${pg.titel}`); pg.bloecke.forEach(b => L.push(`- **${BLOCKS[b.typ].name}** (${BLOCKS[b.typ].v[b.variante]}): ${[b.titel, b.text].filter(Boolean).join(' – ')}${b.items.length ? ` · ${b.items.map(x => x.titel).filter(Boolean).join(', ')}` : ''}`)); L.push(''); });
  }
  MODULE_ORDER.filter(modDone).forEach((id, k) => {
    if (k === 0) L.push('## Vertiefungen', '');
    const d = S.module[id].data;
    L.push(`### ${MODULE[id].name}`, '', d.zusammenfassung, '');
    if (id === 'zielgruppe') d.personas.forEach(p => L.push(`- **${p.name}**${p.prioritaet === 'primaer' ? ' (Hauptzielgruppe)' : ''}: ${p.kurzprofil} Überzeugt durch: ${p.ueberzeugt_durch}`));
    if (id === 'inhalte') d.inhalte.forEach(i => L.push(`- [${i.status === 'vorhanden' ? 'x' : ' '}] **${i.element}** (${i.prioritaet}): ${i.inhalt}`));
    if (id === 'stakeholder') d.stakeholder.forEach(x => L.push(`- **${x.name}** (${x.rolle}, Einfluss ${x.einfluss}, Interesse ${x.interesse}): ${x.umgang}`));
    if (id === 'swot') L.push(`- **Stärken:** ${d.staerken.join('; ')}`, `- **Schwächen:** ${d.schwaechen.join('; ')}`, `- **Chancen:** ${d.chancen.join('; ')}`, `- **Risiken:** ${d.risiken.join('; ')}`);
    if (id === 'problem') L.push(`- **Kernproblem:** ${d.problem_statement}`, `- **${d.wie_koennen_wir}**`);
    L.push('');
  });
  L.push('## Projektakte', ''); S.phasen.forEach(p => { L.push(`### ${p.titel}`); p.felder.filter(f => !f.skipped).forEach(f => L.push(`- **${f.label}** (${STATUS_TEXT[f.status]}): ${f.wert || '–'}`)); L.push(''); });
  return L.join('\n');
}

/* ---------- Ergebnis: Farben, Schriften, Vorschau ---------- */
function lum(hex) {
  let h = hexNorm(hex).slice(1); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4)
    .reduce((acc, c, i) => acc + c * [.2126, .7152, .0722][i], 0);
}
function contrast(a, b) { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + .05) / (y + .05); }
function paletteOf(st) {
  const fs = ((st && st.farben) || []).filter(f => hexOk(f.hex)).map(f => ({ ...f, hex: hexNorm(f.hex) }));
  const by = re => fs.find(f => re.test(f.rolle || ''));
  const bg = (by(/hinter|fläche|grund/i) || fs.slice().sort((a, b) => lum(b.hex) - lum(a.hex))[0] || { hex: '#FFFFFF' }).hex;
  const accent = (by(/akzent|highlight|button|signal/i) || fs.find(f => f.hex !== bg && contrast(f.hex, bg) > 1.8) || { hex: '#2F4BD8' }).hex;
  let fg = (by(/text|schrift/i) || {}).hex;
  if (!fg || contrast(fg, bg) < 4.5) fg = lum(bg) > .35 ? '#1B1B1F' : '#FFFFFF';
  const onAccent = contrast('#FFFFFF', accent) >= 3 ? '#FFFFFF' : '#1B1B1F';
  return { bg, fg, accent, onAccent, all: fs };
}
const fontsLoaded = new Set();
function loadFont(name) {
  const n = String(name || '').replace(/[^A-Za-z0-9 ]/g, '').trim().slice(0, 40);
  if (!n) return '';
  if (!fontsLoaded.has(n)) {
    fontsLoaded.add(n);
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + n.replace(/ /g, '+') + ':wght@400;600;700&display=swap';
    document.head.appendChild(l);
  }
  return n;
}
function recIndex(r) {
  const i = r.strategien.findIndex(st => st.name.trim().toLowerCase() === String(r.empfehlung.strategie).trim().toLowerCase());
  return i < 0 ? 0 : i;
}
function heroColor(r) {
  if (r.textentwurf && r.strategien.length) return paletteOf(r.strategien[recIndex(r)]).accent;
  return hexOk(r.leitfarbe) ? hexNorm(r.leitfarbe) : '';
}

function viewPreview(r, st) {
  const p = paletteOf(st), t = r.textentwurf;
  const hf = loadFont(st.schrift_headline), tf = loadFont(st.schrift_text);

/* ============================================================
   Vertiefungen: Methoden zum tieferen Einstieg ins Projekt

const S_SCHAERF = { type: 'array', items: { type: 'object', properties: { frage: S_STR, warum: S_STR, vorschlaege: { type: 'array', items: S_STR } }, required: ['frage', 'warum', 'vorschlaege'] } };
const S_LIST = { type: 'array', items: S_STR };
function modSchema(props, req) {
  return { type: 'object', properties: { ...props, zusammenfassung: S_STR, annahmen: S_LIST, schaerfungsfragen: S_SCHAERF }, required: [...req, 'zusammenfassung', 'annahmen', 'schaerfungsfragen'] };
}

const MODULE = {
  problem: {
    name: 'Problemanalyse', kurz: 'Was ist das eigentliche Problem? Symptome, Ursachen und eine klare Problemdefinition.',
    expect: 2200,

      problem_statement: S_STR, wie_koennen_wir: S_STR, symptome: S_LIST,
      ursachen: { type: 'array', items: { type: 'object', properties: { ursache: S_STR, warum_kette: S_LIST, belegt: { type: 'boolean' } }, required: ['ursache', 'warum_kette', 'belegt'] } },
      betroffene: S_LIST, kosten_des_nichtstuns: S_STR, nicht_das_problem: S_LIST
    }, ['problem_statement', 'wie_koennen_wir', 'symptome', 'ursachen', 'betroffene', 'kosten_des_nichtstuns', 'nicht_das_problem']),
    task: `Führe eine Problemanalyse durch.
- symptome: woran man das Problem bemerkt (beobachtbar).
- ursachen: 2–4 mögliche Ursachen, jeweils mit einer kurzen Warum-Kette (3 Schritte "weil …"), belegt = true nur, wenn die Akte es stützt.
- problem_statement: das Kernproblem in einem präzisen Satz (wer hat welches Problem, mit welcher Folge).
- wie_koennen_wir: als Frage "Wie können wir …, damit …?".
- betroffene: wer leidet darunter. kosten_des_nichtstuns: was passiert, wenn nichts getan wird.
- nicht_das_problem: was ausdrücklich nicht gelöst werden soll (Abgrenzung).`
  },
  zielgruppe: {
    name: 'Zielgruppen-Analyse', kurz: 'Personas mit Situation, Bedürfnissen, Einwänden und wie man sie erreicht.',
    expect: 3200,
    schema: modSchema({
      personas: { type: 'array', items: { type: 'object', properties: {
        name: S_STR, kurzprofil: S_STR, situation: S_STR, zitat: S_STR,
        ziele: S_LIST, schmerzpunkte: S_LIST, einwaende: S_LIST, kanaele: S_LIST, ueberzeugt_durch: S_STR,
        prioritaet: { type: 'string', enum: ['primaer', 'sekundaer'] }
      }, required: ['name', 'kurzprofil', 'situation', 'zitat', 'ziele', 'schmerzpunkte', 'einwaende', 'kanaele', 'ueberzeugt_durch', 'prioritaet'] } },
      ansprache_tipps: S_LIST
    }, ['personas', 'ansprache_tipps']),
    task: `Führe eine Zielgruppen-Analyse durch und erstelle 2–3 Personas (genau eine mit prioritaet "primaer").
- name: fiktiver Vorname mit Alter oder Rolle (z. B. "Maria, 54, Ehrenamtliche").
- kurzprofil (ein Satz), situation (Alltag und Bezug zum Projekt), zitat (ein typischer Satz in ihrer Sprache).
- ziele, schmerzpunkte, einwaende (was sie zögern lässt), kanaele (wo man sie erreicht): je 2–4 kurze Punkte.
- ueberzeugt_durch: was sie zum Handeln bringt.
- ansprache_tipps: 3–5 konkrete Tipps für Text, Bild und Kanal, abgeleitet aus den Personas.`
  },
  inhalte: {
    name: 'Inhaltsplan', kurz: 'Welche Inhalte braucht es, wie wichtig sind sie, wer liefert sie und was fehlt noch?',
    expect: 2600,
    schema: modSchema({
      hierarchie_hinweis: S_STR,
      inhalte: { type: 'array', items: { type: 'object', properties: {
        element: S_STR, inhalt: S_STR,
        prioritaet: { type: 'string', enum: ['muss', 'soll', 'kann'] },
        quelle: S_STR, status: { type: 'string', enum: ['vorhanden', 'entwurf', 'fehlt'] }
      }, required: ['element', 'inhalt', 'prioritaet', 'quelle', 'status'] } },
      ton_hinweise: S_LIST
    }, ['hierarchie_hinweis', 'inhalte', 'ton_hinweise']),
    task: `Erstelle einen Inhaltsplan: alle Inhalte, die das Ergebnis braucht (bei Flyern z. B. Headline, Erklärung, Datum, Uhrzeiten, Ort, Ablauf, Anmeldung, Kontakt, Logo, Bild; bei Websites Seiten und Seitenbereiche).
- inhalt: der konkrete Inhalt, wenn bekannt (Fakten aus der Akte wörtlich), sonst ein kurzer Entwurf oder ein [Platzhalter].
- prioritaet: muss / soll / kann. quelle: wer liefert oder entscheidet es. status: vorhanden (Fakt steht fest), entwurf (Vorschlag der KI), fehlt.
- hierarchie_hinweis: in welcher Reihenfolge und Gewichtung die Inhalte wirken sollen (ein bis zwei Sätze).
- ton_hinweise: 2–4 Hinweise zu Sprache und Ton.`
  },
  stakeholder: {
    name: 'Stakeholder-Analyse', kurz: 'Wer entscheidet, wer liefert zu, wer kann blockieren, und wie gehst du mit wem um?',
    expect: 2200,
    schema: modSchema({
      stakeholder: { type: 'array', items: { type: 'object', properties: {
        name: S_STR, rolle: S_STR,
        einfluss: { type: 'string', enum: ['hoch', 'niedrig'] }, interesse: { type: 'string', enum: ['hoch', 'niedrig'] },
        haltung: { type: 'string', enum: ['unterstuetzend', 'neutral', 'kritisch'] },
        beduerfnis: S_STR, umgang: S_STR
      }, required: ['name', 'rolle', 'einfluss', 'interesse', 'haltung', 'beduerfnis', 'umgang'] } }
    }, ['stakeholder']),
    task: `Führe eine Stakeholder-Analyse durch: 4–8 Personen oder Gruppen, die das Projekt beeinflussen oder davon betroffen sind (auch die Person selbst, Auftraggeber, Freigebende, Zulieferer, Zielgruppe, ggf. Kritiker).
- einfluss und interesse jeweils hoch/niedrig, haltung zum Projekt.
- beduerfnis: was diese Gruppe vom Projekt will. umgang: konkret, wie man sie einbindet (z. B. "vor Druck Entwurf zur Freigabe schicken").`
  },
  swot: {
    name: 'SWOT-Analyse', kurz: 'Stärken, Schwächen, Chancen und Risiken, plus Strategien, die sich daraus ergeben.',
    expect: 2200,
    schema: modSchema({
      staerken: S_LIST, schwaechen: S_LIST, chancen: S_LIST, risiken: S_LIST,
      strategien: { type: 'array', items: { type: 'object', properties: { typ: { type: 'string', enum: ['SO', 'WO', 'ST', 'WT'] }, massnahme: S_STR }, required: ['typ', 'massnahme'] } }
    }, ['staerken', 'schwaechen', 'chancen', 'risiken', 'strategien']),
    task: `Führe eine SWOT-Analyse für dieses Projekt durch. Stärken und Schwächen sind intern (Person, Team, Ressourcen, Projekt), Chancen und Risiken extern (Umfeld, Zielgruppe, Zeitpunkt). Je 3–5 konkrete, projektspezifische Punkte, keine Allgemeinplätze.
- strategien: 3–5 Maßnahmen, je mit typ: SO (Stärken nutzen, um Chancen zu ergreifen), WO (Schwächen abbauen, um Chancen zu nutzen), ST (Stärken nutzen, um Risiken abzuwehren), WT (Schwächen und Risiken gemeinsam minimieren).`
  }
};
const MODULE_ORDER = ['problem', 'zielgruppe', 'inhalte', 'stakeholder', 'swot'];
const MODULE_EMPFOHLEN = {
  gestaltung: ['zielgruppe', 'inhalte'],
  digital: ['zielgruppe', 'inhalte', 'stakeholder'],
  organisation: ['stakeholder', 'swot', 'zielgruppe'],
  sonstiges: ['problem', 'zielgruppe', 'swot']
};
Object.entries(MODULE).forEach(([id, m]) => { KIND['mod_' + id] = { name: m.name + ' erstellen', expect: m.expect }; });
const modDone = id => !!(S.module && S.module[id] && S.module[id].data);
const empfohlen = () => MODULE_EMPFOHLEN[S.kategorie] || MODULE_EMPFOHLEN.sonstiges;

/* Kompakte Zusammenfassung der Vertiefungen für die Projektakte */
function vertiefungenKontext() {
  const out = {};
  MODULE_ORDER.filter(modDone).forEach(id => {
    const d = S.module[id].data;
    if (id === 'zielgruppe') out.personas = d.personas.map(p => `${p.name} (${p.prioritaet}): ${p.kurzprofil}; überzeugt durch: ${p.ueberzeugt_durch}; Einwände: ${p.einwaende.join(', ')}`);
    else if (id === 'inhalte') out.inhaltsplan = d.inhalte.map(i => `${i.element} [${i.prioritaet}, ${i.status}]: ${i.inhalt}`);
    else if (id === 'stakeholder') out.stakeholder = d.stakeholder.map(s => `${s.name} (${s.rolle}, Einfluss ${s.einfluss}): ${s.umgang}`);
    else out[id] = d.zusammenfassung;
  });
  return out;
}

function openModule(id) {
  if (S.screen !== 'modul') S.prevScreen = S.screen;
  S.activeModule = id; S.screen = 'modul'; ui.error = null;
  save(); render(); window.scrollTo({ top: 0 });
  if (!modDone(id)) runModule(id, false);
}
function closeModule() { S.screen = S.prevScreen && S.prevScreen !== 'modul' ? S.prevScreen : (S.ergebnis ? 'result' : 'interview'); save(); render(); window.scrollTo({ top: 0 }); }

function collectSharpen(id) {
  const st = S.module[id]; if (!st) return;
  st.antworten = st.antworten || {};
  document.querySelectorAll('[data-sq]').forEach(t => { st.antworten[t.dataset.sq] = t.value.trim(); });
  const fb = document.getElementById('modfb'); if (fb) st.feedback = fb.value.trim();
}

function runModule(id, refine) {
  const m = MODULE[id];
  if (refine) collectSharpen(id);
  const prev = S.module[id];
  run(m.name + ' wird erstellt …', async () => {
    let prompt = `PROJEKTAKTE (JSON):\n${akte()}\n\nAUFGABE:\n${m.task}\n
Regeln: Alles auf Deutsch. Nutze die Akte als Grundlage und mache sie konkret für DIESES Projekt. Fakten nicht erfinden; was du ableitest oder vermutest, gehört zusätzlich in "annahmen".
- zusammenfassung: 1–2 Sätze mit der wichtigsten Erkenntnis für die Projektakte.
- schaerfungsfragen: 2–4 Fragen an die Person, deren Antworten diese Analyse am stärksten verbessern würden. Je Frage: warum (kurz), 2–3 Antwortvorschläge.`;
    if (refine && prev && prev.data) {
      const qa = (prev.data.schaerfungsfragen || []).map((q, i) => prev.antworten && prev.antworten[i] ? `- ${q.frage}\n  Antwort: ${prev.antworten[i]}` : '').filter(Boolean).join('\n');
      prompt += `\n\nBISHERIGE ANALYSE (JSON):\n${JSON.stringify(prev.data)}\n\nANTWORTEN DER PERSON AUF DEINE SCHÄRFUNGSFRAGEN:\n${qa || '(keine)'}\n\nWÜNSCHE DER PERSON ZUR ÜBERARBEITUNG:\n${prev.feedback || '(keine)'}\n
Überarbeite die Analyse. Antworten und Wünsche der Person haben Vorrang und gelten als bestätigt (nicht mehr in annahmen). Behalte, was weiterhin passt. Stelle neue schaerfungsfragen nur zu echten Lücken, sonst leeres Array.`;
    }
    const res = await llm(prompt, m.schema, 'mod_' + id);
    S.module[id] = { data: res, antworten: {}, feedback: '', updated: Date.now(), runden: ((prev && prev.runden) || 0) + 1, verlauf: [...((prev && prev.verlauf) || []), ...(refine && prev ? [{ antworten: prev.antworten, feedback: prev.feedback }] : [])] };
    addLog(`${m.name} ${refine ? 'geschärft' : 'erstellt'}`, res.zusammenfassung);
  });
}

/* ---------- Darstellung der Methoden ---------- */
const initials = n => ((String(n || '').match(/\p{L}/u) || ['?'])[0]).toUpperCase();
const lst = (a, cls = '') => (a && a.length) ? `<ul class="mlist ${cls}">${a.map(x => `<li>${ph(x)}</li>`).join('')}</ul>` : '<p class="muted small">–</p>';

function viewMProblem(d) {
  return `<div class="pr-statement"><b>Das Kernproblem</b><p>${ph(d.problem_statement)}</p></div>
  <div class="hmw"><b>Wie können wir …</b><p>${ph(d.wie_koennen_wir)}</p></div>
  <div class="pr-grid">
    <div class="pr-col"><h4>Symptome</h4><p class="muted small">Woran man es merkt</p>${lst(d.symptome, 'sym')}</div>
    <div class="pr-arrow" aria-hidden="true"></div>
    <div class="pr-col"><h4>Ursachen</h4><p class="muted small">Warum es dazu kommt</p>
      ${d.ursachen.map(u => `<div class="cause"><div class="cause-top"><b>${ph(u.ursache)}</b><span class="status ${u.belegt ? 'bestaetigt' : 'annahme'}">${u.belegt ? 'belegt' : 'vermutet'}</span></div>
        <ol class="why-chain">${u.warum_kette.map(w => `<li>${ph(w)}</li>`).join('')}</ol></div>`).join('')}
    </div>
  </div>
  <div class="m-two">
    <div class="m-box"><h4>Betroffen sind</h4><div class="chiprow">${d.betroffene.map(b => `<span>${esc(b)}</span>`).join('')}</div></div>
    <div class="m-box warn"><h4>Wenn nichts passiert</h4><p>${ph(d.kosten_des_nichtstuns)}</p></div>
  </div>
  ${d.nicht_das_problem.length ? `<div class="m-box"><h4>Ausdrücklich nicht Teil des Problems</h4>${lst(d.nicht_das_problem, 'no')}</div>` : ''}`;
}

function viewMZielgruppe(d) {
  const ps = [...d.personas].sort((a, b) => (a.prioritaet === 'primaer' ? -1 : 0) - (b.prioritaet === 'primaer' ? -1 : 0));
  const hues = ['var(--accent)', 'var(--ok)', 'var(--assume)', 'var(--review)'];
  return `<div class="personas">${ps.map((p, i) => `<article class="persona ${p.prioritaet === 'primaer' ? 'prim' : ''}" style="--av:${hues[i % 4]}">
    <div class="p-head"><span class="avatar">${esc(initials(p.name))}</span><div><h3>${esc(p.name)}</h3><span class="muted small">${esc(p.kurzprofil)}</span></div></div>
    ${p.prioritaet === 'primaer' ? '<span class="ribbon">Hauptzielgruppe</span>' : ''}
    ${p.zitat ? `<blockquote>„${esc(p.zitat.replace(/^[„"“]|[“"”]$/g, ''))}“</blockquote>` : ''}
    <p class="small">${esc(p.situation)}</p>
    <div class="p-grid">
      <div><h5>Will</h5>${lst(p.ziele)}</div>
      <div><h5>Nervt</h5>${lst(p.schmerzpunkte)}</div>
      <div><h5>Zögert, weil</h5>${lst(p.einwaende)}</div>
      <div><h5>Erreichbar über</h5><div class="chiprow">${p.kanaele.map(k => `<span>${esc(k)}</span>`).join('')}</div></div>
    </div>
    <div class="p-conv"><b>Überzeugt durch</b>${esc(p.ueberzeugt_durch)}</div>
  </article>`).join('')}</div>
  <div class="m-box tip"><h4>So sprichst du sie an</h4>${lst(d.ansprache_tipps)}</div>`;
}

function viewMInhalte(d) {
  const order = { muss: 0, soll: 1, kann: 2 };
  const items = [...d.inhalte].sort((a, b) => order[a.prioritaet] - order[b.prioritaet]);
  const n = items.length || 1, cnt = k => items.filter(i => i.status === k).length;
  return `<div class="ip-head">
      <div class="hbar">${['vorhanden', 'entwurf', 'fehlt'].map(k => cnt(k) ? `<i class="ip-${k}" style="flex:${cnt(k)}"></i>` : '').join('')}</div>
      <p class="small muted">${cnt('vorhanden')} von ${n} Inhalten stehen fest · ${cnt('entwurf')} als Entwurf · ${cnt('fehlt')} fehlen noch</p>
    </div>
    <div class="m-box"><h4>Gewichtung</h4><p>${ph(d.hierarchie_hinweis)}</p></div>
    <div class="ip-list">${items.map(i => `<div class="ip-row">
      <span class="prio prio-${i.prioritaet}">${esc(i.prioritaet)}</span>
      <div class="ip-main"><b>${esc(i.element)}</b><span>${ph(i.inhalt)}</span></div>
      <div class="ip-meta"><span class="ipst ip-${i.status}">${{ vorhanden: 'steht fest', entwurf: 'Entwurf', fehlt: 'fehlt' }[i.status] || esc(i.status)}</span><small>${esc(i.quelle)}</small></div>
    </div>`).join('')}</div>
    <div class="m-box tip"><h4>Ton und Sprache</h4>${lst(d.ton_hinweise)}</div>`;
}

function viewMStakeholder(d) {
  const Q = { hh: ['Eng einbinden', 'regelmäßig abstimmen, früh beteiligen'], hn: ['Zufriedenstellen', 'gezielt informieren, Freigaben sichern'], nh: ['Informiert halten', 'auf dem Laufenden halten, Feedback nutzen'], nn: ['Beobachten', 'wenig Aufwand, im Blick behalten'] };
  const key = s => (s.einfluss === 'hoch' ? 'h' : 'n') + (s.interesse === 'hoch' ? 'h' : 'n');
  const cell = k => `<div class="sq sq-${k}"><b>${Q[k][0]}</b><small>${Q[k][1]}</small><div class="sq-chips">${d.stakeholder.filter(s => key(s) === k).map(s => `<span class="hal-${s.haltung}" title="${esc(s.rolle)}">${esc(s.name)}</span>`).join('') || '<em>–</em>'}</div></div>`;
  return `<div class="smatrix">
      <div class="ax ax-y">Einfluss</div>
      <div class="sgrid">${cell('hn')}${cell('hh')}${cell('nn')}${cell('nh')}</div>
      <div class="ax ax-x">Interesse</div>
    </div>
    <div class="legend"><span><i class="lg hal-unterstuetzend"></i>unterstützend</span><span><i class="lg hal-neutral"></i>neutral</span><span><i class="lg hal-kritisch"></i>kritisch</span></div>
    <div class="sh-list">${d.stakeholder.map(s => `<div class="sh-row"><div><b>${esc(s.name)}</b><small>${esc(s.rolle)} · ${Q[key(s)][0]}</small></div><div><h5>Braucht</h5>${esc(s.beduerfnis)}</div><div><h5>So gehst du vor</h5>${esc(s.umgang)}</div></div>`).join('')}</div>`;
}

function viewMSwot(d) {
  const T = { SO: 'Stärken nutzen, Chancen ergreifen', WO: 'Schwächen abbauen, Chancen nutzen', ST: 'Stärken gegen Risiken einsetzen', WT: 'Schwächen und Risiken minimieren' };
  const q = (cls, title, sub, a) => `<div class="swq ${cls}"><h4>${title}</h4><small>${sub}</small>${lst(a)}</div>`;
  return `<div class="swot">
      ${q('s', 'Stärken', 'intern, hilft', d.staerken)}${q('w', 'Schwächen', 'intern, bremst', d.schwaechen)}
      ${q('o', 'Chancen', 'extern, hilft', d.chancen)}${q('t', 'Risiken', 'extern, bremst', d.risiken)}
    </div>
    <h4 class="m-sub">Was daraus folgt</h4>
    <div class="sw-strat">${d.strategien.map(s => `<div><span class="swtag swtag-${esc(s.typ)}" title="${T[s.typ] || ''}">${esc(s.typ)}</span><div><b>${ph(s.massnahme)}</b><small>${T[s.typ] || ''}</small></div></div>`).join('')}</div>`;
}
const MODULE_VIEW = { problem: viewMProblem, zielgruppe: viewMZielgruppe, inhalte: viewMInhalte, stakeholder: viewMStakeholder, swot: viewMSwot };

function viewModule() {
  const id = S.activeModule, m = MODULE[id];
  if (!m) { S.screen = 'interview'; return viewInterview(); }
  const st = S.module[id], d = st && st.data;
  const back = S.prevScreen === 'result' ? 'Zurück zum Steckbrief' : 'Zurück zum Interview';
  let body = '';
  if (ui.busy) body = `<div class="live" id="live">${liveInner()}</div>`;
  else if (!d) body = `<div class="rs"><p>${esc(m.kurz)}</p><button class="btn primary" data-modrun="${id}">Analyse erstellen</button></div>`;
  else {
    let inner;
    try { inner = MODULE_VIEW[id](d); } catch (e) { console.error(e); inner = '<p class="error">Die Antwort des Modells war unvollständig. Bitte „Neu erstellen“.</p>'; }
    const qs = d.schaerfungsfragen || [];
    body = `<div class="m-summary"><b>Wichtigste Erkenntnis</b><p>${ph(d.zusammenfassung)}</p></div>
      <section class="rs mview mv-${id}">${inner}</section>
      ${d.annahmen && d.annahmen.length ? `<section class="rs"><div class="rs-head"><h2>Annahmen der KI</h2><p class="small muted">Das hat die KI abgeleitet. Stimmt etwas nicht, korrigiere es unten.</p></div>${lst(d.annahmen, 'assume')}</section>` : ''}
      <section class="rs sharpen">
        <div class="rs-head"><h2>${qs.length ? 'Analyse schärfen' : 'Noch etwas ändern?'}</h2><p class="small muted">${qs.length ? 'Beantworte, was du weißt. Leere Fragen werden übersprungen.' : 'Keine offenen Fragen mehr. Du kannst trotzdem Wünsche angeben.'}</p></div>
        ${qs.map((q, i) => `<div class="sq-item">
          <label for="sq-${i}"><b>${esc(q.frage)}</b><small>${esc(q.warum)}</small></label>
          ${q.vorschlaege && q.vorschlaege.length ? `<div class="chiprow pick">${q.vorschlaege.map((v, j) => `<button class="chip" data-sqchip="${i}|${j}">${esc(v)}</button>`).join('')}</div>` : ''}
          <textarea id="sq-${i}" data-sq="${i}" rows="2" class="answer" placeholder="Deine Antwort …">${esc((st.antworten || {})[i] || '')}</textarea>
        </div>`).join('')}
        <div class="sq-item"><label for="modfb"><b>Was soll anders oder genauer sein?</b><small>Optional, zum Beispiel „Persona 2 passt nicht, eher Jugendliche“.</small></label>
          <textarea id="modfb" rows="2" class="answer" placeholder="Deine Wünsche …">${esc(st.feedback || '')}</textarea></div>
        <div class="actions"><button class="btn primary" data-modrefine="${id}">Analyse schärfen</button><button class="btn ghost" data-modrun="${id}">Komplett neu erstellen</button>
          <span class="spacer"></span><span class="small muted">Runde ${st.runden || 1}</span></div>
      </section>`;
  }
  const others = MODULE_ORDER.filter(x => x !== id);
  return `<section class="module">
    <div class="result-actions"><button class="btn" data-act="closemod">${back}</button>
      <span class="spacer"></span>${others.map(x => `<button class="btn tiny ${modDone(x) ? '' : 'ghost'}" data-mod="${x}">${esc(MODULE[x].name)}${modDone(x) ? ' ✓' : ''}</button>`).join('')}</div>
    <header class="m-hero"><span class="m-icon">${MODULE_ICON[id]}</span><div><h1>${esc(m.name)}</h1><p>${esc(m.kurz)}</p></div></header>
    ${errorBox()}
    ${body}
    ${!ui.busy && d && S.ergebnis ? `<div class="m-next"><span>Die Erkenntnisse sind in deiner Projektakte. Aktualisiere den Steckbrief, damit sie dort einfließen.</span><button class="btn primary tiny" data-act="result">Steckbrief aktualisieren</button></div>` : ''}
  </section>`;
}
