  if (d.pgo) { D.webPage = d.pgo; D.webSel = null; return done(); }
  if (d.pmove) { const [i, dir] = d.pmove.split('|').map(Number), j = i + dir; if (j < 0 || j >= sp.seiten.length) return true; [sp.seiten[i], sp.seiten[j]] = [sp.seiten[j], sp.seiten[i]]; return done(); }
  if (d.pgdel !== undefined) { const p = sp.seiten[+d.pgdel]; if (!p || !confirm(`Seite „${p.titel}“ löschen?`)) return true; sp.seiten.splice(+d.pgdel, 1); D.webSel = null; return done(); }
  if (d.navv) { sp.navbar.variante = d.navv; return done(); }
  if (d.footv) { sp.footer.variante = d.footv; return done(); }
  if (d.libadd) { const nb = newBlock(d.libadd), at = blk ? +sel + 1 : page.bloecke.length; page.bloecke.splice(at, 0, nb); D.webSel = { page: page.id, blk: String(at) }; return done(); }
  if (!blk) {
    if (d.act === 'blkclose') { D.webSel = null; return done(); }
    if (d.act === 'pagegen') { generatePage(pi, (document.getElementById('pg-desc') || {}).value || ''); return true; }
    if (d.act === 'pageadd') {
      const name = ((document.getElementById('pg-new-name') || {}).value || '').trim(), desc = ((document.getElementById('pg-new-desc') || {}).value || '').trim();
      if (!name) { ui.error = 'Gib der neuen Seite einen Namen.'; render(); return true; }
      const np = { id: uid(), titel: name.slice(0, 30), bloecke: [{ ...newBlock('hero'), variante: 'zentriert', titel: name }, newBlock('text'), newBlock('cta')] };
      sp.seiten.push(np); D.webPage = np.id; D.webSel = null; save();
      if (desc) generatePage(sp.seiten.length - 1, desc, `Seite „${name}“ wird aufgebaut …`); else render();
      return true;
    }
    return false;
  }
  const bi = +sel;
  if (d.bv) { blk.variante = d.bv; return done(); }
  if (d.bbg) { blk.hintergrund = d.bbg; return done(); }
  if (d.bmove) { const j = bi + +d.bmove; if (j < 0 || j >= page.bloecke.length) return true; [page.bloecke[bi], page.bloecke[j]] = [page.bloecke[j], page.bloecke[bi]]; D.webSel.blk = String(j); return done(); }
  if (d.bdup) { page.bloecke.splice(bi + 1, 0, { ...JSON.parse(JSON.stringify(blk)), id: uid() }); D.webSel.blk = String(bi + 1); return done(); }
  if (d.bdel) { page.bloecke.splice(bi, 1); D.webSel = null; return done(); }
  if (d.iadd) { const B = BLOCKS[blk.typ]; blk.items.push({ titel: `${B.items || 'Eintrag'} ${blk.items.length + 1}`, text: 'Kurze Beschreibung.', meta: '', asset_id: '' }); return done(); }
  if (d.idel !== undefined) { blk.items.splice(+d.idel, 1); return done(); }
  if (d.act === 'blkclose') { D.webSel = null; return done(); }
  if (d.act === 'blockgen') { const w = ((document.getElementById('blk-wish') || {}).value || '').trim(); if (!w) { ui.error = 'Beschreibe, wie der Block sich ändern soll.'; render(); return true; } editBlockAI(pi, bi, w); return true; }
  if (d.act === 'pagegen') { generatePage(pi, (document.getElementById('pg-desc') || {}).value || ''); return true; }
  if (d.act === 'pageadd') { D.webSel = null; return siteClick(e, d); }
  return false;
}

/* ---------- Events ---------- */
function bind() {
  const app = $('#app');
  app.onclick = e => {
    if (e.target.classList && e.target.classList.contains('overlay')) { ui.projPanel = false; return render(); }
    const pgl = e.target.closest('[data-page]');
    if (pgl && !e.target.closest('[contenteditable="true"]')) {
      e.preventDefault(); ui.webMenu = false;
      if (S.screen === 'design') { const D = designState(); D.webPage = pgl.dataset.page; D.webSel = null; save(); render(); const sc = document.querySelector('#ds-stage .wscroll'); if (sc) sc.scrollTop = 0; }
      else { ui.resultPage = pgl.dataset.page; render(); }
      return;
    }
    if (e.target.closest('[data-burger]')) { ui.webMenu = !ui.webMenu; if (S.screen === 'design') { const st = document.getElementById('ds-stage'); if (st) st.innerHTML = previewHTML(); } else render(); return; }
    if (S.screen === 'design') {
      const bk = e.target.closest('#ds-stage [data-blk]');
      if (bk) { const D = designState(), k = { page: curPage(D).id, blk: bk.dataset.blk }; if (!D.webSel || D.webSel.blk !== k.blk || D.webSel.page !== k.page) { D.webSel = k; save(); const sc = document.querySelector('#ds-stage .wscroll'), top = sc ? sc.scrollTop : 0; render(); const sc2 = document.querySelector('#ds-stage .wscroll'); if (sc2) sc2.scrollTop = top; } return; }
    }
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (S.screen === 'design' && siteClick(e, d)) return;
    if (d.ex) { $('#desc').value = d.ex; return; }
    if (d.k) { S.komplexitaet = d.k; save(); render(); return; }
    if (b.id === 'go') return startProject();
    if (b.id === 'recheck') { S.host = $('#host').value.trim() || ANBIETER[S.provider].host; setKey($('#apikey').value.trim()); save(); ui.conn = 'unknown'; ui.rfStufe = null; renderConn(); render(); return checkServer(); }
    if (d.prov) { const alt = ANBIETER[S.provider] || ANBIETER.ollama; if (!S.host || S.host === alt.host) S.host = ANBIETER[d.prov].host; S.provider = d.prov; S.model = ''; ui.models = []; ui.rfStufe = null; save(); ui.conn = 'unknown'; render(); return checkServer(); }
    if (d.act === 'keyshow') { ui.keyShow = !ui.keyShow; const k = $('#apikey'); if (k) { k.type = ui.keyShow ? 'text' : 'password'; b.textContent = ui.keyShow ? 'Verbergen' : 'Zeigen'; } return; }
    if (d.act === 'keyforget') { setKey(''); render(); return checkServer(); }
    if (d.chip !== undefined) { const t = $('#answer'); t.value = S.aktuell.vorschlaege[+d.chip]; t.focus(); return; }
    if (d.ask) { if (S.screen === 'interview' && !ui.busy) askNow(d.ask); return; }
    if (d.edit) return editField(d.edit);
    if (d.save) return saveEdit(d.save);
    if (d.cancel) { ui.editing = null; return render(); }
    if (d.confirm) return confirmField(d.confirm);
    if (d.restore) return restoreField(d.restore);
    if (d.accept) return acceptProposal(d.accept);
    if (d.tab !== undefined) { ui.tab = +d.tab; return render(); }
    if (d.mut) { designState().mut = d.mut; save(); return render(); }
    if (d.mod) { if (!ui.busy) openModule(d.mod); return; }
    if (d.popen) return openProject(d.popen);
    if (d.pdel) return deleteProject(d.pdel);
    if (d.pexport) return exportProject((ui.projekte || []).find(x => x.id === d.pexport));
    if (d.cdel) { const D = designState(); const l = (D.eigeneLayouts || []).find(x => x.id === d.cdel); if (!l || !confirm(`Variante „${l.name}“ löschen?`)) return; D.eigeneLayouts = D.eigeneLayouts.filter(x => x !== l); if (D.layout === 'c_' + l.id) D.layout = 'auto'; save(); return render(); }
    if (d.fmt) { const D = designState(); D.format = d.fmt; if (D.spec && D.spec.typ !== 'web') D.spec.format = d.fmt; D.fit = FIT0(); save(); return render(); }
    if (d.lay) { const D = designState(); D.layout = d.lay; save(); return render(); }
    if (d.view) { designState().ansicht = d.view; save(); return render(); }
    if (d.ver !== undefined) { const D = designState(), v = JSON.parse(JSON.stringify(D.versionen[+d.ver])); D.aktiv = +d.ver; D.spec = v.spec; if (v.texte) D.texte = v.texte; save(); return render(); }
    if (d.blockdel !== undefined) { designState().texte.bloecke.splice(+d.blockdel, 1); save(); return render(); }
    if (d.assetdel !== undefined) {
      const D = designState(), a = D.assets[+d.assetdel]; if (!a) return;
      IDB.del(a.id); delete ui.assetURL[a.id]; D.assets.splice(+d.assetdel, 1);
      if (D.spec) { (D.spec.elemente || []).forEach(e => { if (e.asset_id === a.id) e.asset_id = ''; }); (D.spec.sektionen || []).forEach(x => { if (x.asset_id === a.id) x.asset_id = ''; }); if (D.spec.hintergrund && D.spec.hintergrund.asset_id === a.id) D.spec.hintergrund.art = 'farbe'; }
      save(); return render();
    }
    if (d.modrun) { if (S.module[d.modrun]) S.module[d.modrun].antworten = {}; return runModule(d.modrun, false); }
    if (d.modrefine) return runModule(d.modrefine, true);
    if (d.sqchip) { const [qi, vi] = d.sqchip.split('|').map(Number); const q = S.module[S.activeModule].data.schaerfungsfragen[qi]; const t = document.getElementById('sq-' + qi); t.value = q.vorschlaege[vi]; t.focus(); return; }
    if (d.check) { S.check = S.check || {}; S.check[d.check] = !S.check[d.check]; save(); return render(); }
    if (d.reject) return rejectProposal(d.reject);
    switch (d.act) {
      case 'send': return submitAnswer();
      case 'unknown': return submitAnswer('Weiß ich nicht. Bitte triff eine begründete Annahme, die zu meinem Projekt passt.');
      case 'skip': return skipCurrent();
      case 'result': return buildResult();
      case 'showresult': S.screen = 'result'; save(); return render();
      case 'back': S.screen = 'interview'; save(); return render();
      case 'md': return downloadMd();
      case 'print': return printSteckbrief();
      case 'retry': return ui.retry && ui.retry();
      case 'cancel': return ui.cancel && ui.cancel();
      case 'closemod': return closeModule();
      case 'invent': return inventGuided(null);
      case 'variation': return customOf(designState()) ? inventGuided(customOf(designState())) : null;
      case 'openprojpanel': return openProjects();
      case 'saveproj': return saveProject(false).then(() => loadProjectList()).then(render);
      case 'exportcur': return exportProject();
      case 'closeproj': ui.projPanel = false; return render();
      case 'opendesign': return ui.busy ? null : openDesign();
      case 'closedesign': return closeDesign();
      case 'dsgo': return generateDesign(false);
      case 'dsrefine': return generateDesign(true);
      case 'printdesign': return printDesign();
      case 'blockadd': designState().texte.bloecke.push({ titel: '', text: '' }); save(); return render();
      case 'retexte': S.design.texte = initTexte(); save(); return render();
      case 'inspector': ui.inspector = !ui.inspector; render(); if (ui.inspector) document.querySelector('.inspector').scrollIntoView({ behavior: 'smooth' }); return;
    }
  };
  app.oninput = e => { const t = e.target; if (t.dataset && t.dataset.d) { designSet(t.dataset.d, t.value); if (t.dataset.pv) { const st = document.getElementById('ds-stage'); if (st) { st.innerHTML = previewHTML(); refit(); } } else if (S.screen === 'design' && /^texte\./.test(t.dataset.d)) refit(); } };
  app.onchange = e => { const t = e.target;
    if (t.dataset && t.dataset.btyp) { const D = designState(), pg = curPage(D), blk = pg.bloecke[+D.webSel.blk]; if (blk) { const typ = t.value; blk.typ = typ; blk.variante = Object.keys(BLOCKS[typ].v)[0]; if (BLOCKS[typ].items && !blk.items.length) blk.items = newBlock(typ).items; if (BLOCKS[typ].cta && !blk.cta) blk.cta = 'Mehr erfahren'; save(); render(); } return; }
    if (t.id === 'importFile') { const f = t.files[0]; t.value = ''; if (f) importProject(f); return; } if (t.id === 'ds-file') { addFiles([...t.files]); t.value = ''; return; } if (t.dataset && t.dataset.d && t.dataset.rr) { designSet(t.dataset.d, t.value); render(); } };
  const dz = $('#ds-drop');
  if (dz) { dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); }; dz.ondragleave = () => dz.classList.remove('over'); dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); addFiles([...e.dataTransfer.files]); }; }
  const ak = $('#apikey'); if (ak) { if (ui.keyShow) ak.type = 'text'; ak.onkeydown = e => { if (e.key === 'Enter') $('#recheck').click(); }; }
  const hi = $('#host'); if (hi) hi.onkeydown = e => { if (e.key === 'Enter') $('#recheck').click(); };
  const th = $('#think'); if (th) th.onchange = () => { S.think = th.checked; save(); };
  const m = $('#model'); if (m) m.onchange = () => { S.model = m.value; save(); renderConn(); };
  const a = $('#answer'); if (a) { a.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitAnswer(); } }; }
  const desc = $('#desc'); if (desc) { desc.oninput = () => { S.beschreibung = desc.value; }; desc.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); startProject(); } }; }
}
$('#app').addEventListener('focusout', e => {
  const t = e.target, sp = S.design && S.design.spec; if (!t.dataset || !sp) return;
  if (t.dataset.el !== undefined && sp.elemente && sp.elemente[+t.dataset.el]) { sp.elemente[+t.dataset.el].inhalt = t.innerText.replace(/\n{2,}/g, '\n').trim(); save(); }
  if (t.dataset.path) { designSet(t.dataset.path, t.innerText.replace(/\n{2,}/g, '\n').trim()); setTimeout(() => { if (!document.getElementById('ds-stage')?.contains(document.activeElement)) fitFlyer(); }, 60); }
  if (t.dataset.sec !== undefined && sp.sektionen && sp.sektionen[+t.dataset.sec]) { sp.sektionen[+t.dataset.sec][t.dataset.f] = t.innerText.trim(); save(); }
});
$('#saveBtn').onclick = () => saveProject(false);
$('#projBtn').onclick = () => openProjects();
$('#newBtn').onclick = async () => {
  if (!confirm('Neues Projekt beginnen? Das aktuelle wird vorher unter „Projekte“ gespeichert.')) return;
  const ok = !hasProject() || await saveProject(true);
  if (!ok && !confirm('Das aktuelle Projekt konnte nicht gespeichert werden. Trotzdem verwerfen?')) return;
  if (!ok) ((S.design && S.design.assets) || []).forEach(a => IDB.del(a.id));
  if (ok && hasProject()) toast('Bisheriges Projekt liegt unter „Projekte“');
  S = freshState(S); ui.error = null; save(); render();
};

if (!ANBIETER[S.provider]) S.provider = 'ollama';
/* Vorbelegung per Link, z. B. …/#anbieter=lmstudio&server=http://localhost:1234 (nie mit Schlüssel) */
try {
  const h = new URLSearchParams(location.hash.slice(1));
  if (ANBIETER[h.get('anbieter')]) { S.provider = h.get('anbieter'); if (!h.get('server')) S.host = ANBIETER[S.provider].host; }
  if (h.get('server')) S.host = h.get('server');
  if (h.has('anbieter') || h.has('server')) { save(); history.replaceState(null, '', location.pathname + location.search); }
} catch {}
render();
checkServer();
loadAssets().then(() => { if (['design', 'result'].includes(S.screen)) render(); });
loadProjectList().then(() => { if (S.screen === 'start') render(); });
</script>
</body>
