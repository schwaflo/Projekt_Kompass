/* ---------- Entwurf in Übersicht und Druck ---------- */
const hasEntwurf = () => !!(S.design && S.design.spec && (S.design.spec.typ === 'web' || S.design.spec.sem));
function entwurfInfo() {
  const D = S.design, sp = D.spec, f = FORMATE[D.format] || FORMATE.a5_hoch;
  if (sp.typ === 'web') { const w = migrateWeb(sp); return { format: f, layout: `Website-Wireframe, ${w.seiten.length} Seiten`, pal: normPalette(w.palette), fonts: [w.schrift_headline, w.schrift_text], seiten: w.seiten, sektionen: w.seiten.reduce((n, x) => n + x.bloecke.length, 0) }; }
  const plan = planFlyer(D, D.fit || FIT0()), c = customOf(D);
  if (c && c.frei) {
    const st = Object.values(freeFitFor(D)), n = [];
    if (st.some(x => x.es < .95)) n.push('Schrift je Textbox angepasst');
    if (st.some(x => x.kurz)) n.push(`${st.filter(x => x.kurz).length} Kurzfassung(en)`);
    return { format: f, layout: `${c.name} (freie Komposition)`, plan, pal: plan.pal, fonts: [plan.stil.schrift_headline, plan.stil.schrift_text], notes: n };
  }
  const layout = c ? `${c.name} (eigene Variante)` : LAYOUTS[D.layout] ? LAYOUTS[D.layout].name : `${(LAYOUTS[plan.layout] || {}).name || plan.layout} (automatisch nach Regeln)`;
  const fit = D.fit || FIT0(), notes = [];
  if (fit.scale < 1) notes.push(`Schrift auf ${Math.round(fit.scale * 100)} %`);
  if (fit.kurz.length) notes.push(`${fit.kurz.length} Kurzfassung${fit.kurz.length > 1 ? 'en' : ''}`);
  if (fit.drop.length) notes.push(`${fit.drop.length} Element${fit.drop.length > 1 ? 'e' : ''} weggelassen`);
  return { format: f, layout, plan, pal: plan.pal, fonts: [plan.stil.schrift_headline, plan.stil.schrift_text], notes };
}
function entwurfHTML(forPrint) {
  const D = S.design, sp = D.spec;
  if (sp.typ === 'web') return renderSite(sp, ui.resultPage, 'desktop', { forPrint });
  return isFree(D) ? renderFree(D, false, freeFitFor(D)).html : renderFlyer(planFlyer(D, D.fit || FIT0()), false);
}
/* Druckgröße: passt das Format auf A4 (180 × 222 mm neben Überschrift nutzbar), dann 1:1, sonst maßstabsgetreu verkleinert */
function entwurfPrintSize() {
  const f = FORMATE[S.design.format] || FORMATE.a5_hoch;
  const mm = v => f.unit === 'px' ? v * 25.4 / 96 : v;
  const w = mm(f.w), h = mm(f.h), k = Math.min(1, 180 / w, 222 / h);
  return { w: +(w * k).toFixed(1), h: +(h * k).toFixed(1), k, digital: f.unit === 'px' };
}
function viewEntwurf() {
  if (!hasEntwurf()) return '';
  const D = S.design, I = entwurfInfo(), web = D.spec.typ === 'web';
  return `<section class="rs entwurf">
    <div class="rs-head"><h2>Dein Entwurf</h2><p class="muted small">aus dem Design-Studio${web ? ', Menüpunkte sind klickbar' : ''}</p></div>
    <div class="ew-grid ${web ? 'web' : ''}">
      <div class="ew-stage">${web ? entwurfHTML(false) : `<div class="ds-paper fmt-${D.format}">${entwurfHTML(false)}</div>`}</div>
      <div class="ew-info">
        <div class="dl">
          <b>Format</b><span>${esc(I.format.name)} · ${esc(I.format.info)}</span>
          <b>Layout</b><span>${esc(I.layout)}</span>
          <b>Schriften</b><span>${esc(I.fonts.filter(Boolean).join(' + ') || '–')}</span>
          ${I.notes && I.notes.length ? `<b>Angepasst</b><span>${esc(I.notes.join(', '))}</span>` : ''}
        </div>
        <div class="swatches">${[['hintergrund', 'Hintergrund'], ['flaeche', 'Fläche'], ['text', 'Text'], ['akzent', 'Akzent']].map(([k, l]) => `<div class="sw"><i style="background:${I.pal[k]}"></i><span>${l}<small>${I.pal[k].toUpperCase()}</small></span></div>`).join('')}</div>
        <div class="actions"><button class="btn primary tiny" data-act="opendesign">Im Design-Studio bearbeiten</button>${web ? '' : '<button class="btn tiny" data-act="printdesign">In Originalgröße drucken</button>'}</div>
      </div>
    </div>
  </section>`;
}
function entwurfPrintSection() {
  if (!hasEntwurf()) return '';
  const D = S.design, I = entwurfInfo(), web = D.spec.typ === 'web';
  if (web) return I.seiten.map((pg, i) => `<section class="ps pbreak"><h2>Entwurf: Website, Seite „${esc(pg.titel)}“</h2>
    ${i === 0 ? `<p class="pe-meta">${I.seiten.length} Seiten: ${I.seiten.map(x => esc(x.titel)).join(', ')} · Schriften ${esc(I.fonts.filter(Boolean).join(' + '))} · Farben ${Object.values(I.pal).map(c => c.toUpperCase()).join(', ')}</p>` : ''}
    <div class="pe-web">${renderSite(D.spec, pg.id, 'desktop', { forPrint: true })}</div></section>`).join('');
  const z = entwurfPrintSize();
  const mass = z.digital ? `digitales Format ${I.format.info}, dargestellt mit ${z.w} × ${z.h} mm` : z.k >= .999 ? `Originalgröße ${I.format.info}` : `verkleinert auf ${Math.round(z.k * 100)} % (Original ${I.format.info})`;
  return `<section class="ps pbreak pe"><h2>Entwurf: ${esc(I.format.name)}</h2>
    <p class="pe-meta">${esc(mass)} · Layout ${esc(I.layout)} · Schriften ${esc(I.fonts.filter(Boolean).join(' + '))}${I.notes.length ? ' · angepasst: ' + esc(I.notes.join(', ')) : ''}</p>
    <div class="pe-sheet" style="width:${z.w}mm;height:${z.h}mm">${entwurfHTML(true)}</div></section>`;
}

/* ============================================================
   Druck: eigene Druckfassungen statt der Bildschirmseite
   ============================================================ */
function doPrint(html, pageCSS, cls) {
  let root = document.getElementById('printroot');
  if (!root) { root = document.createElement('div'); root.id = 'printroot'; document.body.appendChild(root); }
  root.className = cls || '';
  root.innerHTML = html;
  let ps = document.getElementById('pagestyle');
  if (!ps) { ps = document.createElement('style'); ps.id = 'pagestyle'; document.head.appendChild(ps); }
  ps.textContent = `@page{${pageCSS}}`;
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); root.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  /* Schriften und Bilder kurz laden lassen */
  setTimeout(() => { (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => window.print()); }, 150);
}

  const sec = (title, inner) => `<section class="ps"><h2>${esc(title)}</h2>${inner}</section>`;
  const ul = a => `<ul>${(a || []).map(x => `<li>${ph(x)}</li>`).join('')}</ul>`;
  let h = `<header class="ph"><div class="ph-meta">${esc(S.typ || 'Projekt')} · Projekt-Steckbrief · ${new Date().toLocaleDateString('de-DE')}</div>

/* ---------- Bildspeicher (IndexedDB, damit große Bilder den Browser-Speicher nicht sprengen) ---------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('projektkompass', 2);
      r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('assets')) db.createObjectStore('assets'); if (!db.objectStoreNames.contains('projekte')) db.createObjectStore('projekte'); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(k, v, st = 'assets') { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(st, 'readwrite'); t.objectStore(st).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k, st = 'assets') { const db = await this.open(); return new Promise(res => { const q = db.transaction(st).objectStore(st).get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async all(st) { const db = await this.open(); return new Promise(res => { const q = db.transaction(st).objectStore(st).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); },
  async del(k, st = 'assets') { try { const db = await this.open(); db.transaction(st, 'readwrite').objectStore(st).delete(k); } catch {} }
};
ui.assetURL = {};
async function loadAssets() {
  const list = (S.design && S.design.assets) || [];
  for (const a of list) if (!ui.assetURL[a.id]) { try { const u = await IDB.get(a.id); if (u) ui.assetURL[a.id] = u; } catch {} }
}
function readImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const url = fr.result;
      if (file.type === 'image/svg+xml') return res({ url, w: 0, h: 0 });
      const img = new Image();
      img.onload = () => {
        const max = 1800, k = Math.min(1, max / Math.max(img.width, img.height));
        if (k === 1 && file.size < 1.5e6) return res({ url, w: img.width, h: img.height });
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const png = /png|gif|webp/.test(file.type);
        res({ url: c.toDataURL(png ? 'image/png' : 'image/jpeg', 0.86), w: c.width, h: c.height });
      };
      img.onerror = () => rej(new Error('Bild konnte nicht gelesen werden'));
      img.src = url;
    };
    fr.readAsDataURL(file);
  });
}
async function addFiles(files) {
  const D = designState();
  for (const f of files) {
    if (!/^image\//.test(f.type)) continue;
    try {
      const { url, w, h } = await readImage(f);
      const id = 'img' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      const rolle = /logo|signet|emblem/i.test(f.name) || f.type === 'image/svg+xml' ? 'logo' : 'bild';
      D.assets.push({ id, name: f.name, rolle, beschreibung: '', platzierung: 'auto', w, h });
      ui.assetURL[id] = url;
      try { await IDB.put(id, url); } catch { ui.notice = 'Bilder werden nur bis zum Neuladen der Seite behalten, weil der Browser-Speicher nicht verfügbar ist.'; }
    } catch (e) { ui.error = `„${f.name}“ konnte nicht geladen werden.`; }
  }
  save(); render();
}

/* ---------- Farben ---------- */
function alpha(hex, a) { let h = hexNorm(hex).slice(1); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`; }
function mixHex(a, b, t) {
  const p = x => { let h = hexNorm(x).slice(1); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
  const A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const onColor = c => contrast('#FFFFFF', c) >= 3 ? '#FFFFFF' : '#1B1B1F';
function normPalette(p = {}) {
  const g = (h, d) => hexOk(h) ? hexNorm(h) : d;
  const bg = g(p.hintergrund, '#FFFFFF'), ac = g(p.akzent, '#2F4BD8');
  let tx = g(p.text, '#1B1B1F'); if (contrast(tx, bg) < 4.5) tx = lum(bg) > .35 ? '#1B1B1F' : '#FFFFFF';
  let fl = g(p.flaeche, mixHex(bg, ac, .12)); if (contrast(tx, fl) < 4) fl = mixHex(bg, ac, .1);
  return { hintergrund: bg, flaeche: fl, text: tx, akzent: ac };
}

/* ---------- Bilder sicher platzieren: Wünsche der Person haben Vorrang ---------- */
function enforceAssets(spec) {
  const D = designState(), ids = new Set(D.assets.map(a => a.id));
  if (FORMATE[D.format].web) {
    spec.sektionen = spec.sektionen || [];
    spec.sektionen.forEach(s => { if (!ids.has(s.asset_id)) s.asset_id = ''; });
    const logo = D.assets.find(a => a.rolle === 'logo'); if (!ids.has(spec.logo_asset_id)) spec.logo_asset_id = logo ? logo.id : '';
    const bg = D.assets.find(a => a.rolle === 'hintergrund' || a.platzierung === 'hintergrund');
    spec.hero_bild = bg ? bg.id : '';
    D.assets.filter(a => a.rolle === 'bild' && a.platzierung !== 'hintergrund' && !spec.sektionen.some(s => s.asset_id === a.id)).forEach(a => {
      const free = spec.sektionen.find(s => !s.asset_id && ['text_bild', 'hero', 'galerie'].includes(s.typ)); if (free) free.asset_id = a.id;
    });
    return spec;
  }
  spec.elemente = (spec.elemente || []).filter(e => e && e.typ);
  spec.elemente.forEach(e => { if (e.asset_id && !ids.has(e.asset_id)) e.asset_id = ''; });
  spec.hintergrund = spec.hintergrund || { art: 'farbe', farbe2: '', richtung: 'oben_unten', asset_id: '', overlay: .5 };
  if (spec.hintergrund.art === 'bild' && !ids.has(spec.hintergrund.asset_id)) spec.hintergrund.art = 'verlauf';
  for (const a of D.assets) {
    if (a.rolle === 'hintergrund' || a.platzierung === 'hintergrund') {
      spec.hintergrund = { ...spec.hintergrund, art: 'bild', asset_id: a.id, overlay: spec.hintergrund.overlay > .2 ? spec.hintergrund.overlay : .55 };
      spec.elemente = spec.elemente.filter(e => e.asset_id !== a.id);
      continue;
    }
    let el = spec.elemente.find(e => e.asset_id === a.id);
    if (!el) {
      el = { typ: a.rolle === 'logo' ? 'logo' : 'bild', inhalt: a.beschreibung, asset_id: a.id, bereich: a.rolle === 'logo' ? 'fuss' : 'hero', ausrichtung: a.rolle === 'logo' ? 'rechts' : 'mitte', groesse: a.rolle === 'logo' ? 's' : 'l', betont: false };
      if (a.rolle === 'bild') spec.elemente.unshift(el); else spec.elemente.push(el);
    }
    el.typ = a.rolle === 'logo' ? 'logo' : 'bild';
    if (PLATZ[a.platzierung]) [el.bereich, el.ausrichtung] = PLATZ[a.platzierung];
  }
  if (D.layout !== 'auto') spec.layout = D.layout;
  if (!LAYOUTS[spec.layout]) spec.layout = 'bild_oben';
  return spec;
}

/* ---------- Flyer: Regelwerk statt freier KI-Gestaltung ----------
   Die KI stuft nur ein (Art, Wichtigkeit, Kurzfassung, Hauptbild, Stil).
   Layout, Position und Hervorhebung entstehen hier nach Wenn-dann-Regeln. */
const FAKT_ARTEN = ['datum_zeit', 'ort', 'kontakt'];
const cleanLabel = t => String(t || '').replace(/^\s*(headline|überschrift|unterzeile|subline|handlungsaufforderung|call to action|cta|aufruf)\s*:\s*/i, '').trim();
const FIT0 = () => ({ scale: 1, kurz: [], drop: [] });

function planFlyer(D, fit) {
  fit = fit || FIT0();
  const sem = D.spec.sem, f = FORMATE[D.format] || FORMATE.a5_hoch, t = D.texte;
  const small = ['a6_hoch', 'din_lang', 'story', 'quadrat'].includes(D.format);
  const digital = ['post', 'quadrat', 'story'].includes(D.format);
  const R = [];
  const stil = sem.stil || {};
  const pal = normPalette(stil.palette);

  /* Bilder: Hintergrund nie zusätzlich als Bild, Hauptbild nur einmal */
  const bgA = D.assets.find(a => (a.rolle === 'hintergrund' || a.platzierung === 'hintergrund') && ui.assetURL[a.id]);
  const logos = D.assets.filter(a => a.rolle === 'logo');
  const bilder = D.assets.filter(a => a.rolle === 'bild' && a !== bgA && a.platzierung !== 'hintergrund');
  const haupt = bilder.find(a => a.platzierung === 'gross_oben') || bilder.find(a => a.id === sem.hauptbild_id) || bilder[0] || null;
  const weitere = bilder.filter(a => a !== haupt && !fit.drop.includes('img:' + a.id));

  /* Textblöcke mit Einstufung der KI */
  const meta = i => (sem.bloecke || []).find(b => +b.index === i) || { art: 'sonstiges', wichtigkeit: 'mittel', kurzfassung: '' };
  let blocks = t.bloecke.map((b, i) => ({ titel: cleanLabel(b.titel), text: b.text, i, ...meta(i) }))
    .filter(b => (b.titel || b.text) && !fit.drop.includes('b:' + b.i));
  const highs = blocks.filter(b => b.wichtigkeit === 'hoch');
  if (highs.length > 2) { highs.slice(2).forEach(b => { b.wichtigkeit = 'mittel'; }); R.push('Mehr als zwei Punkte waren als wichtig eingestuft. Nur die ersten zwei werden hervorgehoben, sonst fällt nichts mehr auf.'); }
  const txt = b => (fit.kurz.includes(b.i) && b.kurzfassung ? b.kurzfassung : b.text) || '';
  /* Das Layout entscheidet der vollständige Inhalt, nicht der gekürzte */
  const alle = t.bloecke.map((b, i) => ({ ...b, ...meta(i) })).filter(b => b.titel || b.text);
  const textLen = alle.reduce((n, b) => n + (b.text || '').length, 0);
  const fakten = alle.filter(b => FAKT_ARTEN.includes(b.art) && b.wichtigkeit !== 'hoch');

  /* Regel: Layout aus dem Inhalt ableiten */
  const custom = customOf(D) && !customOf(D).frei ? customOf(D) : null;
  let layout = custom ? 'custom' : LAYOUTS[D.layout] ? D.layout : (LAYOUTS[sem.layout_wunsch] ? sem.layout_wunsch : '');
  if (custom) R.push(`Eigene Variante „${custom.name}“: ${custom.idee}`);
  else if (layout) R.push(`Layout „${LAYOUTS[layout].name}“ ist ${LAYOUTS[D.layout] ? 'von dir gewählt' : 'dein Wunsch'}.`);
  else if (haupt && textLen < 260 && alle.length <= 3) { layout = 'vollbild'; R.push('Wenn ein Hauptbild da ist und wenig Text: Das Bild füllt die Fläche und trägt die Stimmung.'); }
  else if (haupt) { layout = 'bild_oben'; R.push('Wenn ein Hauptbild da ist und mehr Text: Das Bild steht oben als Blickfang, die Infos darunter bleiben gut lesbar.'); }
  else if (fakten.length >= 3) { layout = 'raster'; R.push('Wenn es mehrere Fakten gibt (Zeit, Ort, Kontakt): Sie stehen als Kacheln, damit man sie auf einen Blick findet.'); }
  else if (/ruhig|feierlich|still|festlich|besinnlich|elegant/i.test(sem.stimmung || '')) { layout = 'zentriert'; R.push('Wenn die Stimmung ruhig oder feierlich ist: symmetrisch und zentriert.'); }
  else { layout = 'geteilt'; R.push('Ohne Hauptbild: Die Botschaft steht in einem Farbblock, damit sie sofort auffällt.'); }
  if (layout === 'vollbild' && !haupt) layout = 'geteilt';

  const mods = [];
  if (bgA) { mods.push('karte'); R.push('Wenn ein Hintergrundbild da ist: Der Text steht auf einer ruhigen Fläche, damit er lesbar bleibt.'); }

  const Z = { kopf: [], hero: [], mitte: [], fuss: [], seite: [] };
  const P = i => `texte.bloecke.${i}.text`, LP = i => `texte.bloecke.${i}.titel`;

  /* Regel: Logos klein am Rand */
  logos.forEach((a, k) => {
    let pos = PLATZ[a.platzierung] || (PLATZ[sem.logo_ort] ? PLATZ[sem.logo_ort] : null);
    if (!pos) pos = logos.length > 1 ? (k === 0 ? ['kopf', 'links'] : ['fuss', 'rechts']) : (layout === 'zentriert' ? ['kopf', 'mitte'] : ['kopf', 'links']);
    Z[pos[0]].push({ typ: 'logo', asset: a.id, align: pos[1] });
  });
  if (logos.length) R.push('Logos stehen klein am Rand: Sie zeigen den Absender, ohne von der Botschaft abzulenken.');

  let mitteBild = null;
  const hauptZeigen = haupt && !fit.drop.includes('hauptbild');
  if (hauptZeigen && custom) {
    const img = { typ: 'bild', asset: haupt.id, text: haupt.beschreibung, size: small ? 's' : 'm' }, b = custom.p.bild;
    if (b === 'keins') R.push('Diese Variante kommt ohne Foto aus.');
    else if (['unten_vollbreit', 'links_spalte', 'rechts_spalte'].includes(b) || (f.w > f.h && b !== 'hintergrund_verlauf')) Z.seite.push(img);
    else if (b === 'rahmen_mitte') mitteBild = { ...img, rahmen: true };
    else Z.hero.push(img);
  } else if (hauptZeigen) {
    const img = { typ: 'bild', asset: haupt.id, text: haupt.beschreibung, size: small ? 's' : 'm' };
    if (f.w > f.h && layout !== 'vollbild') { Z.seite.push(img); R.push('Querformat: Das Bild bekommt eine eigene Spalte über die volle Höhe, der Text steht daneben.'); }
    else Z.hero.push(img);
  }

  /* Regel: Headline-Größe nach Länge */
  const hl = cleanLabel(t.headline);
  const hs = hl.length <= 16 ? 'xl' : hl.length <= 28 ? 'l' : hl.length <= 44 ? 'm' : 's';
  if (hs !== 'xl') R.push(`Wenn die Headline lang ist (${hl.length} Zeichen): kleinere Schriftstufe, damit sie nicht den ganzen Platz einnimmt.`);
  Z.hero.push({ typ: 'headline', text: hl, size: hs, path: 'texte.headline', akzent: !!(custom && custom.eingriffe && custom.eingriffe.akzent_wort) });
  const sl = cleanLabel(t.subline);
  if (sl && !fit.drop.includes('subline')) Z.hero.push({ typ: 'subline', text: sl, size: sl.length > 90 ? 's' : 'm', path: 'texte.subline' });

  /* Regel: Wichtiges direkt unter die Headline und farbig */
  blocks.filter(b => b.wichtigkeit === 'hoch').forEach(b => Z.hero.push({ typ: 'badge', label: b.titel, text: txt(b), path: P(b.i), lpath: LP(b.i) }));
  if (blocks.some(b => b.wichtigkeit === 'hoch')) R.push('Wenn etwas wichtig ist: Es steht direkt unter der Headline und ist farbig hinterlegt.');

  /* Regel: Zusammengehörige Fakten bündeln */
  const rest = blocks.filter(b => b.wichtigkeit !== 'hoch');
  const fk = rest.filter(b => FAKT_ARTEN.includes(b.art));
  const bundle = fk.length >= 2 && layout !== 'raster' && !(custom && custom.p.fakten_stil === 'liste');
  if (bundle) { Z.mitte.push({ typ: 'fakten', items: fk.map(b => ({ label: b.titel, text: txt(b), path: P(b.i), lpath: LP(b.i) })) }); R.push('Wenn mehrere Fakten zusammengehören: Sie stehen gebündelt nebeneinander.'); }
  const low = [];
  rest.forEach(b => {
    if (bundle && FAKT_ARTEN.includes(b.art)) return;
    const el = { label: b.titel, text: txt(b), path: P(b.i), lpath: LP(b.i) };
    if (b.wichtigkeit === 'niedrig' || b.art === 'hinweis') low.push({ ...el, typ: 'klein' });
    else if (b.art === 'ablauf') Z.mitte.push({ ...el, typ: 'liste' });
    else if (FAKT_ARTEN.includes(b.art)) Z.mitte.push({ ...el, typ: 'info' });
    else Z.mitte.push({ ...el, typ: 'text' });
  });
  if (low.length) { Z.mitte.push(...low); R.push('Weniger Wichtiges steht kleiner am Ende.'); }
  if (mitteBild) Z.mitte.splice(Math.min(1, Z.mitte.length), 0, mitteBild);
  if (weitere.length && !small) Z.mitte.push({ typ: 'bild', asset: weitere[0].id, text: weitere[0].beschreibung, size: 's' });
  else if (weitere.length) R.push('Kleines Format: Zusätzliche Bilder werden weggelassen.');

  /* Regel: Handlungsaufforderung unten als Knopf, bei Links mit QR-Code */
  const cta = cleanLabel(t.cta);
  if (cta) {
    Z.fuss.unshift({ typ: 'cta', text: cta, path: 'texte.cta' });
    R.push('Die Handlungsaufforderung steht unten als Knopf in der Akzentfarbe, dort, wo der Blick am Ende landet.');
    if (/\[?link\]?|https?:|www\.|anmeld|eintrag|registr|buch/i.test(cta)) {
      if (digital) R.push('Digitales Format: kein QR-Code, der Link gehört in den Beitragstext.');
      else { Z.fuss.push({ typ: 'qr', align: 'rechts' }); R.push('Wenn die Aufforderung auf einen Link verweist: QR-Code daneben, damit man ihn vom Papier aus öffnet.'); }
    }
  }
  /* Eigene Variante: Baukasten-Parameter als Klassen, ähnliche Grundlayouts mitnutzen */
  const extra = [];
  if (custom) {
    const q = custom.p;
    const woerter = hl.split(/\s+/).filter(Boolean).length;
    Object.entries(q).forEach(([k, v]) => extra.push(k === 'headline_stil' && v === 'gestapelt' && woerter > 4 ? 'lc-headline_stil-normal' : `lc-${k}-${v}`));
    if (q.headline_stil === 'gestapelt' && woerter > 4) R.push(`Die Headline hat ${woerter} Wörter: Gestapelt würde jedes Wort eine Zeile brauchen, deshalb steht sie normal.`);
    if (q.bild === 'oben_vollbreit' && Z.hero.some(e => e.typ === 'bild')) extra.push('fl-bild_oben');
    if (q.bild === 'hintergrund_verlauf' && Z.hero.some(e => e.typ === 'bild')) extra.push('fl-vollbild');
    if (q.farbblock === 'kopf') extra.push('fl-geteilt');
    if (q.farbblock === 'links_band') extra.push('fl-spalte');
    if (q.ausrichtung === 'mitte') extra.push('fl-zentriert');
    const e = custom.eingriffe;
    if (e) {
      if (e.bild_schnitt && e.bild_schnitt !== 'gerade') extra.push('lx-schnitt-' + e.bild_schnitt);
      if (e.headline_xxl) extra.push('lx-xxl');
      const hi = Z.hero.findIndex(x => x.typ === 'headline');
      if (e.headline_ueberlappt_bild && hi > 0 && Z.hero[hi - 1].typ === 'bild') extra.push('lx-overlap');
      if (e.headline_ueberlappt_bild || e.headline_xxl || e.akzent_wort || (e.bild_schnitt && e.bild_schnitt !== 'gerade')) R.push(`Eingriffe der Variante: ${[e.headline_xxl && 'übergroße Headline', e.headline_ueberlappt_bild && 'Headline ragt ins Foto', e.akzent_wort && 'erstes Wort in Akzentfarbe', e.bild_schnitt !== 'gerade' && `Bildkante ${e.bild_schnitt}`, e.headline_drehung && `Headline um ${e.headline_drehung}° gedreht`].filter(Boolean).join(', ')}.`);
    }
  }
  const hrot = custom && custom.eingriffe ? +custom.eingriffe.headline_drehung || 0 : 0;
  return { layout, extra, custom, hrot, mods, pal, stil, Z, fit, regeln: R, bgA, quer: f.w > f.h, schmal: f.h / f.w > 1.8, f };
}

function flyerBg(plan) {
  const p = plan.pal, h = plan.stil.hintergrund || {}, c2 = hexOk(h.farbe2) ? hexNorm(h.farbe2) : p.flaeche;
  if (plan.bgA) return `background:url('${ui.assetURL[plan.bgA.id]}') center/cover no-repeat,${p.hintergrund}`;
  if (h.art === 'verlauf') return h.richtung === 'radial' ? `background:radial-gradient(circle at 30% 20%,${c2},${p.hintergrund} 70%)` : `background:linear-gradient(${h.richtung === 'diagonal' ? '135deg' : '180deg'},${p.hintergrund},${c2})`;
  if (h.art === 'muster') return `background:radial-gradient(${alpha(p.akzent, .18)} 1.2px,transparent 1.7px) 0 0/4cqw 4cqw,${p.hintergrund}`;
  return `background:${p.hintergrund}`;
}

function renderEl2(e, ed) {
  const ce = path => ed && path ? ` contenteditable="true" data-path="${path}" spellcheck="false"` : '';
  const url = e.asset && ui.assetURL[e.asset];
  const al = e.align ? ` al-${e.align}` : '';
  const sz = ` sz-${e.size || 'm'}`;
  const lab = e.label ? `<b${ce(e.lpath)}>${ph(e.label)}</b>` : '';
  switch (e.typ) {
    case 'logo': return url ? `<img class="el el-logo${al}" src="${url}" alt="Logo">` : `<div class="el el-logo phbox${al}">Logo</div>`;
    case 'bild': return url ? `<div class="el el-bild${sz}${e.rahmen ? ' rahmen' : ''}"><img src="${url}" alt="${esc(e.text || '')}"></div>` : `<div class="el el-bild phbox${sz}"><span>${esc(e.text || 'Bild')}</span></div>`;
    case 'headline': { const m = e.akzent && String(e.text).match(/^(\S+)(\s[\s\S]*)?$/); return `<div class="el el-headline${sz}"${ce(e.path)}>${m ? `<span class="hl-akzent">${ph(m[1])}</span>${ph(m[2] || '')}` : ph(e.text)}</div>`; }
    case 'subline': return `<div class="el el-subline${sz}"${ce(e.path)}>${ph(e.text)}</div>`;
    case 'badge': return `<div class="el el-badge">${lab}<span${ce(e.path)}>${ph(e.text)}</span></div>`;
    case 'fakten': return `<div class="el el-fakten n${Math.min(e.items.length, 3)}">${e.items.map(it => `<div><b${ce(it.lpath)}>${ph(it.label)}</b><span${ce(it.path)}>${ph(it.text)}</span></div>`).join('')}</div>`;
    case 'info': return `<div class="el el-info2">${lab}<span${ce(e.path)}>${ph(e.text)}</span></div>`;
    case 'liste': return `<div class="el el-liste2">${lab}<div class="li"${ce(e.path)}>${String(e.text || '').split(/\n|;\s*|(?<=\.)\s+(?=[A-ZÄÖÜ])/).filter(Boolean).map(l => `<div>${ph(l.replace(/^[-•]\s*/, ''))}</div>`).join('')}</div></div>`;
    case 'klein': return `<div class="el el-klein">${e.label ? `<b${ce(e.lpath)}>${ph(e.label)}:</b> ` : ''}<span${ce(e.path)}>${ph(e.text)}</span></div>`;
    case 'cta': return `<div class="el el-cta"><span${ce(e.path)}>${ph(e.text)}</span></div>`;
    case 'qr': return `<div class="el el-qr${al}"><div class="qrbox"></div><span>QR-Code</span></div>`;
    default: return `<div class="el el-text">${lab}<span${ce(e.path)}>${ph(e.text)}</span></div>`;
  }
}

function renderFlyer(plan, ed) {
  const p = plan.pal, hf = loadFont(plan.stil.schrift_headline), tf = loadFont(plan.stil.schrift_text);
  const vars = `--ratio:${plan.f.w}/${plan.f.h};--s:${plan.f.s || 1};--fit:${plan.fit.scale};--hrot:${plan.hrot || 0}deg;--fbg:${p.hintergrund};--ffl:${p.flaeche};--ftx:${p.text};--fac:${p.akzent};--fon:${onColor(p.akzent)};--fflt:${p.text};--fhf:${hf ? `'${hf}',` : ''}var(--display);--ftf:${tf ? `'${tf}',` : ''}var(--body)`;
  const zone = z => plan.Z[z].map(e => renderEl2(e, ed)).join('');
  return `<div class="flc"><div class="fl fl2 fl-${plan.layout}${(plan.extra || []).map(c => ' ' + c).join('')}${plan.Z.seite.length ? ' has-seite' : ''}${plan.quer ? ' fl-quer' : ''}${plan.schmal ? ' fl-schmal' : ''}${plan.mods.map(m => ' fl-' + m).join('')}" style="${vars};${flyerBg(plan)}">
    ${plan.custom ? '<div class="fl-block"></div><div class="fl-deko"></div>' + renderDeko(plan) : ''}
    <div class="fz fz-kopf">${zone('kopf')}</div>
    <div class="fz fz-hero">${zone('hero')}</div>
    <div class="fz fz-mitte">${zone('mitte')}</div>
    <div class="fz fz-fuss">${zone('fuss')}</div>
    <div class="fz fz-seite">${zone('seite')}</div>
  </div></div>`;
}

/* ---------- Automatisch passend machen ---------- */
function flyerOverflows(fl) {
  if (!fl) return false;
  /* Nur echter Inhalt zählt: Dekoration und Bilder im Anschnitt ragen absichtlich über den Rand.
     Gemessen wird vertikal: läuft eine Zone über oder reicht sie über die Unterkante? */
  const H = fl.clientHeight;
  return [...fl.querySelectorAll('.fz')].some(z => z.childElementCount > 0 && getComputedStyle(z).position !== 'absolute' && (z.scrollHeight > z.clientHeight + 1 || z.offsetTop + z.offsetHeight > H + 1));
}
function fitFlyer() {
  if (S.design && S.design.spec && S.design.spec.typ === 'flyer' && isFree(S.design)) return fitFree();
  const D = S.design, stage = document.getElementById('ds-stage');
  if (!D || !D.spec || D.spec.typ !== 'flyer' || !stage || S.screen !== 'design') return;
  if (stage.contains(document.activeElement)) return;
  const fit = FIT0();
  const draw = () => { stage.innerHTML = `<div class="ds-paper fmt-${D.format}">${renderFlyer(planFlyer(D, fit), true)}</div>`; return flyerOverflows(stage.querySelector('.fl')); };
  /* Reihenfolge: erst Unwichtiges, dann Mittleres, nie Headline, Wichtiges oder Aufforderung */
  const meta = i => (D.spec.sem.bloecke || []).find(b => +b.index === i) || { wichtigkeit: 'mittel', kurzfassung: '' };
  const rank = { niedrig: 0, mittel: 1, hoch: 2 };
  const idx = D.texte.bloecke.map((_, i) => i).sort((a, b) => rank[meta(a).wichtigkeit] - rank[meta(b).wichtigkeit] || b - a);
  const kurz = idx.filter(i => meta(i).kurzfassung && meta(i).kurzfassung.length < (D.texte.bloecke[i].text || '').length);
  /* Inhalt vor Dekoration: erst Nebensächliches, dann Unterzeile, dann das Foto, zuletzt mittelwichtige Texte */
  const drop1 = [
    ...D.assets.filter(a => a.rolle === 'bild').map(a => 'img:' + a.id).slice(1),
    ...idx.filter(i => meta(i).wichtigkeit === 'niedrig').map(i => 'b:' + i),
    'subline', 'hauptbild'
  ];
  const drop2 = idx.filter(i => meta(i).wichtigkeit === 'mittel').map(i => 'b:' + i);
  let over = draw(), n = 0;
  while (over && n++ < 50) {
    if (fit.scale > .8) fit.scale = +(fit.scale - .05).toFixed(2);
    else if (kurz.length) fit.kurz.push(kurz.shift());
    else if (fit.scale > .64) fit.scale = +(fit.scale - .04).toFixed(2);
    else if (drop1.length) fit.drop.push(drop1.shift());
    else if (fit.scale > .56) fit.scale = +(fit.scale - .04).toFixed(2);
    else if (drop2.length) fit.drop.push(drop2.shift());
    else break;
    over = draw();
  }
  const dims = dimShapes(stage, planFlyer(D, fit));
  if (dims.length) { fit.dim = dims; draw(); }
  D.fit = fit; save();
  const plan = planFlyer(D, fit);
  const notes = [];
  if (fit.scale < 1) notes.push(`Schrift und Abstände auf ${Math.round(fit.scale * 100)} % verkleinert`);
  if (fit.kurz.length) notes.push(`${fit.kurz.length} ${fit.kurz.length === 1 ? 'Text' : 'Texte'} durch die Kurzfassung ersetzt`);
  const dropped = fit.drop.map(d => d === 'subline' ? 'Unterzeile' : d === 'hauptbild' ? 'Foto' : d.startsWith('img:') ? 'zusätzliches Bild' : `„${cleanLabel((D.texte.bloecke[+d.slice(2)] || {}).titel) || 'Textblock'}“`);
  if (dropped.length) notes.push(`weggelassen, weil kein Platz: ${dropped.join(', ')}`);
  if (fit.dim && fit.dim.length) notes.push(`${fit.dim.length} ${fit.dim.length > 1 ? 'Formen' : 'Form'} hinter Text abgeschwächt, damit er lesbar bleibt`);
  const fn = document.getElementById('ds-fitnote');
  if (fn) { fn.hidden = !notes.length; fn.innerHTML = notes.length ? `<b>Automatisch angepasst, damit alles aufs Format passt:</b> ${esc(notes.join(' · '))}. Mehr Platz bekommst du mit einem größeren Format oder kürzeren Texten.` : ''; }
  const ovf = document.getElementById('ds-ovf'); if (ovf) ovf.hidden = !over;
  const rl = document.getElementById('ds-rules'); if (rl) rl.innerHTML = plan.regeln.map(r => `<li>${esc(r)}</li>`).join('');
}

function designPrompt(refine) {

HINTERGRUND: ${b.hintergrund || '(frei)'}

function generateDesign(refine) {

  const web = !!FORMATE[D.format].web;
  run(refine ? 'Entwurf wird überarbeitet …' : 'Entwurf wird gestaltet …', async () => {
    const res = await llm(designPrompt(refine), web ? DESIGN_WEB_SCHEMA : DESIGN_FLYER_SCHEMA, 'design');
    if (web) { res.typ = 'web'; res.format = D.format; D.spec = enforceAssets(res); }
    else {
      const tn = res.texte_neu || {};
      if (refine) ['headline', 'subline', 'cta'].forEach(k => { if (tn[k] && tn[k].trim()) D.texte[k] = cleanLabel(tn[k]); });
      D.spec = { typ: 'flyer', format: D.format, sem: res, begruendung: res.begruendung, hinweise: res.hinweise };
      D.fit = FIT0();
    }
    D.versionen.push(JSON.parse(JSON.stringify({ spec: D.spec, texte: D.texte }))); D.versionen = D.versionen.slice(-8); D.aktiv = D.versionen.length - 1;

  });
}

  for (let i = 0; i < parts.length - 1; i++) { if (o == null) return; o = o[parts[i]]; }
  if (o != null) o[parts[parts.length - 1]] = val;
  save();
}

/* ============================================================
   Eigene Layout-Varianten: die KI kombiniert einen Baukasten neu
   ============================================================ */
const CL_PARAMS = {
  bild: ['oben_vollbreit', 'unten_vollbreit', 'links_spalte', 'rechts_spalte', 'kreis_oben', 'rahmen_mitte', 'hintergrund_verlauf', 'keins'],

  headline_stil: { normal: 'Headline schlicht', gestapelt: 'Headline Wort für Wort gestapelt', versalien: 'Headline in Großbuchstaben', unterstrichen: 'Headline mit Akzentstrich', kasten: 'Headline im Rahmen' },

const INSPIRATION = ['Bauhaus', 'Zeitungsseite', 'Konzertplakat', 'Postkarte', 'japanische Ruhe', 'Schweizer Typografie', 'Einladungskarte', 'Kinoplakat', 'Magazin-Titel', 'Kirchenfenster', 'Zine', 'Minimalismus', 'Retro-Plakat der 70er', 'Museumsschild', 'Fahrplan', 'Theaterprogramm', 'Briefmarke', 'Wahlplakat'];
const CUSTOM_LAYOUT_SCHEMA = { type: 'object', properties: { name: S_STR, idee: S_STR, ...Object.fromEntries(Object.entries(CL_PARAMS).map(([k, v]) => [k, { type: 'string', enum: v }])) }, required: ['name', 'idee', ...Object.keys(CL_PARAMS)] };
KIND.layout = { name: 'Neue Layoutvariante erfinden', expect: 450 };
TOK.layout = 500;
const customOf = D => D.layout && D.layout.startsWith('c_') ? (D.eigeneLayouts || []).find(l => 'c_' + l.id === D.layout) || null : null;
const pick = a => a[Math.floor(Math.random() * a.length)];

function inventLayout() {
  const D = designState(), insp = pick(INSPIRATION);
  const sem = D.spec && D.spec.sem;
  const vorhanden = [...Object.values(LAYOUTS).map(v => `- ${v.name}: ${v.info}`), ...(D.eigeneLayouts || []).map(l => `- ${l.name}: ${Object.entries(l.p).map(([k, v]) => CL_TEXT[k][v]).join(', ')}`)].join('\n');
  const prompt = `Erfinde eine neue Layoutvariante für einen ${FORMATE[D.format].name} (${FORMATE[D.format].info}).
Projekt: ${S.titel || D.texte.headline}. Stimmung: ${(sem && sem.stimmung) || D.briefing.stimmung || 'offen'}. Zielgruppe: ${(findField('zielgruppe') || {}).wert || 'offen'}.
Inhalt: Headline „${cleanLabel(D.texte.headline)}“, ${D.texte.bloecke.length} Textblöcke${D.assets.some(a => a.rolle === 'bild') ? ', ein Foto' : ', kein Foto'}${D.assets.some(a => a.rolle === 'logo') ? ', ein Logo' : ''}.
Inspiration für diese Variante: ${insp}.

Diese Varianten gibt es schon. Mach etwas deutlich anderes:
${vorhanden}

Wähle für jeden Parameter einen Wert. Die Kombination soll mutig und überraschend sein, aber zu Projekt und Zielgruppe passen und lesbar bleiben.
name: 2–3 Wörter, kreativ, auf Deutsch. idee: ein Satz, was die Variante ausmacht und warum sie zum Projekt passt.`;
  run('Neue Layoutvariante wird erfunden …', async () => {
    const res = await llm(prompt, CUSTOM_LAYOUT_SCHEMA, 'layout');
    const p = {};
    Object.entries(CL_PARAMS).forEach(([k, v]) => { p[k] = v.includes(res[k]) ? res[k] : pick(v); });
    /* Keine Doppelungen: bei gleicher Kombination zwei Parameter zufällig ändern */
    const same = l => JSON.stringify(l.p) === JSON.stringify(p);
    for (let n = 0; n < 2 && (D.eigeneLayouts || []).some(same); n++) { const k = pick(Object.keys(CL_PARAMS)); p[k] = pick(CL_PARAMS[k].filter(x => x !== p[k])); }
    const id = Date.now().toString(36);
    D.eigeneLayouts = [...(D.eigeneLayouts || []), { id, name: (res.name || 'Eigene Variante').slice(0, 40), idee: res.idee || '', inspiration: insp, p }];
    D.layout = 'c_' + id; D.fit = FIT0();

  });
}

function customThumb(p) {
  const A = 'var(--accent)', M = 'var(--muted)', hpY = { oben: 9, mitte: 18, unten: 28 }[p.headline_pos] || 9;
  const x = { links: 5, mitte: 8, rechts: 11 }[p.ausrichtung] || 5;
  let s = '';
  if (p.farbblock === 'kopf') s += `<rect x="0" y="${hpY - 4}" width="30" height="10" fill="${A}" opacity=".7"/>`;
  if (p.farbblock === 'fuss') s += `<rect x="0" y="34" width="30" height="8" fill="${A}" opacity=".7"/>`;
  if (p.farbblock === 'links_band') s += `<rect x="0" y="0" width="3" height="42" fill="${A}"/>`;
  if (p.farbblock === 'diagonal') s += `<path d="M30 14 L30 42 L8 42 Z" fill="${A}" opacity=".25"/>`;
  if (p.farbblock === 'rahmen') s += `<rect x="2" y="2" width="26" height="38" rx="1" fill="none" stroke="${A}" stroke-width="1"/>`;
  if (p.farbblock === 'ecke') s += `<circle cx="30" cy="0" r="9" fill="${A}" opacity=".5"/>`;
  if (p.deko === 'kreis') s += `<circle cx="2" cy="40" r="11" fill="${A}" opacity=".15"/>`;
  if (p.deko === 'punkte') s += Array.from({ length: 9 }, (_, i) => `<circle cx="${4 + (i % 3) * 3}" cy="${33 + Math.floor(i / 3) * 3}" r=".7" fill="${A}" opacity=".6"/>`).join('');
  if (p.deko === 'linien') s += `<rect x="4" y="2" width="22" height=".6" fill="${A}"/><rect x="4" y="39.4" width="22" height=".6" fill="${A}"/>`;
  const img = { oben_vollbreit: '<rect x="0" y="0" width="30" height="12" fill="X"/>', unten_vollbreit: '<rect x="0" y="31" width="30" height="11" fill="X"/>', links_spalte: '<rect x="0" y="0" width="11" height="42" fill="X"/>', rechts_spalte: '<rect x="19" y="0" width="11" height="42" fill="X"/>', kreis_oben: '<circle cx="15" cy="7" r="5" fill="X"/>', rahmen_mitte: '<rect x="7" y="22" width="16" height="8" fill="X" stroke="Y" stroke-width=".8"/>', hintergrund_verlauf: '<rect x="0" y="0" width="30" height="42" fill="X"/>', keins: '' }[p.bild] || '';
  s += img.replace(/X/g, `color-mix(in srgb, ${A} 35%, transparent)`).replace(/Y/g, A);
  const off = p.bild === 'links_spalte' ? 8 : 0, w = p.bild === 'links_spalte' || p.bild === 'rechts_spalte' ? 11 : 16;
  const hy = p.bild === 'oben_vollbreit' && p.headline_pos === 'oben' ? 15 : hpY;
  s += `<rect x="${x + off}" y="${hy}" width="${w}" height="${p.headline_stil === 'gestapelt' ? 5 : 3}" rx="1" fill="${p.farbblock === 'kopf' ? '#fff' : A}"/>`;
  s += [0, 1, 2].map(k => `<rect x="${x + off}" y="${(p.headline_pos === 'unten' ? 12 : hy + 7) + k * 3.5}" width="${w * (k ? .8 : 1)}" height="1.4" rx=".7" fill="${M}" opacity=".55"/>`).join('');
  return `<svg viewBox="0 0 30 42" aria-hidden="true"><rect x=".5" y=".5" width="29" height="41" rx="2" fill="var(--surface)" stroke="var(--line)"/><g clip-path="inset(0 round 2px)">${s}</g></svg>`;
}

/* ============================================================
   Freie Komposition: Die KI platziert jedes Element und Formen
   frei auf einem Raster. Die App prüft Regeln und passt jedes
   Element einzeln an seine Box an.
   ============================================================ */
const FORMEN = ['rechteck', 'kreis', 'oval', 'ring', 'dreieck', 'band_diagonal', 'bogen', 'halbkreis', 'linie'];
const FE_STILE = ['normal', 'gross', 'box_akzent', 'box_flaeche', 'umrandet', 'invertiert'];
const S_NUM = { type: 'number' };
const FREE_SCHEMA = {
  type: 'object',
  properties: {
    name: S_STR, idee: S_STR,
    formen: { type: 'array', items: { type: 'object', properties: {
      form: { type: 'string', enum: FORMEN }, x: S_NUM, y: S_NUM, w: S_NUM, h: S_NUM,
      farbe: { type: 'string', enum: ['akzent', 'flaeche', 'text', 'hintergrund'] }, deckkraft: S_NUM, drehung: S_NUM
    }, required: ['form', 'x', 'y', 'w', 'h', 'farbe', 'deckkraft', 'drehung'] } },
    elemente: { type: 'array', items: { type: 'object', properties: {
      ref: S_STR, x: S_NUM, y: S_NUM, w: S_NUM, h: S_NUM,
      ausrichtung: { type: 'string', enum: ['links', 'mitte', 'rechts'] }, vertikal: { type: 'string', enum: ['oben', 'mitte', 'unten'] },
      stil: { type: 'string', enum: FE_STILE }, drehung: S_NUM,
      bildform: { type: 'string', enum: ['rechteck', 'kreis', 'abgerundet', 'bogen'] }
    }, required: ['ref', 'x', 'y', 'w', 'h', 'ausrichtung', 'vertikal', 'stil', 'drehung', 'bildform'] } }
  },
  required: ['name', 'idee', 'formen', 'elemente']
};
KIND.frei = { name: 'Neue Komposition erfinden', expect: 2600 };
TOK.frei = 3200;
const gridOf = f => { const C = f.w > f.h ? 16 : 12; return { C, R: Math.round(C * f.h / f.w) }; };
const isFree = D => { const c = customOf(D); return !!(c && c.frei); };

/* Alles, was auf den Flyer gehört, mit eindeutiger Referenz */
function freeInventory(D) {
  const t = D.texte, sem = (D.spec && D.spec.sem) || {}, inv = {};
  const meta = i => (sem.bloecke || []).find(b => +b.index === i) || { art: 'sonstiges', wichtigkeit: 'mittel', kurzfassung: '' };
  const hl = cleanLabel(t.headline); if (hl) inv.headline = { typ: 'headline', text: hl, path: 'texte.headline', pflicht: true };
  const sl = cleanLabel(t.subline); if (sl) inv.subline = { typ: 'subline', text: sl, path: 'texte.subline' };
  t.bloecke.forEach((b, i) => { if (!b.titel && !b.text) return; const m = meta(i); inv['block:' + i] = { typ: 'block', label: cleanLabel(b.titel), text: b.text, kurz: m.kurzfassung, wichtig: m.wichtigkeit, art: m.art, path: `texte.bloecke.${i}.text`, lpath: `texte.bloecke.${i}.titel`, pflicht: m.wichtigkeit !== 'niedrig' }; });
  const cta = cleanLabel(t.cta);
  if (cta) {
    inv.cta = { typ: 'cta', text: cta, path: 'texte.cta', pflicht: true };
    if (/\[?link\]?|https?:|www\.|anmeld|eintrag|registr|buch/i.test(cta) && !['post', 'quadrat', 'story'].includes(D.format)) inv.qr = { typ: 'qr' };
  }
  D.assets.forEach(a => {
    if (a.rolle === 'logo') inv['logo:' + a.id] = { typ: 'logo', asset: a.id, platz: a.platzierung };
    else if (a.rolle === 'bild' && a.platzierung !== 'hintergrund') inv['bild:' + a.id] = { typ: 'bild', asset: a.id, text: a.beschreibung };
  });
  return inv;
}
const isText = it => it && ['headline', 'subline', 'block', 'cta'].includes(it.typ);

function inventFree() {
  const D = designState(), f = FORMATE[D.format], { C, R } = gridOf(f), inv = freeInventory(D), insp = pick(INSPIRATION);
  const sem = D.spec && D.spec.sem;
  const pal = normPalette(sem && sem.stil && sem.stil.palette);
  const lines = Object.entries(inv).map(([ref, it]) => {
    if (it.typ === 'block') return `- ${ref} | ${it.label || 'Text'} | ${it.wichtig === 'hoch' ? 'WICHTIG' : it.wichtig} | ${it.text.length} Zeichen${it.kurz ? ` (Kurzfassung ${it.kurz.length})` : ''}`;
    if (it.typ === 'logo') return `- ${ref} | Logo`;
    if (it.typ === 'bild') return `- ${ref} | Foto${it.text ? ': ' + it.text : ''}`;
    if (it.typ === 'qr') return `- qr | QR-Code zum Link (klein, quadratisch)`;
    return `- ${ref} | „${it.text}“ | ${it.text.length} Zeichen`;
  }).join('\n');
  const frueher = (D.eigeneLayouts || []).filter(l => l.frei).slice(-6).map(l => `- ${l.name}: ${l.idee} (Formen: ${(l.frei.formen || []).map(s => s.form).join(', ') || 'keine'}; Headline bei y=${((l.frei.elemente || []).find(e => e.ref === 'headline') || {}).y ?? '?'})`).join('\n') || '(noch keine)';
  const prompt = `Du komponierst ein Flyer-Layout frei auf einem Raster von ${C} Spalten × ${R} Zeilen. x zählt von links, y von oben, in Rasterfeldern. Format: ${f.name} (${f.info}).
Projekt: ${S.titel || cleanLabel(D.texte.headline)}. Stimmung: ${(sem && sem.stimmung) || D.briefing.stimmung || 'offen'}. Zielgruppe: ${(findField('zielgruppe') || {}).wert || 'offen'}.
Farbrollen: hintergrund ${pal.hintergrund}, flaeche ${pal.flaeche}, text ${pal.text}, akzent ${pal.akzent}.
INSPIRATION für diese Komposition: ${insp}.

INHALTE (ref genau so übernehmen, jeden Inhalt genau einmal platzieren):
${lines}

BISHERIGE KOMPOSITIONEN. Mach etwas grundlegend anderes (andere Formen, andere Position der Headline, andere Aufteilung):
${frueher}

REGELN:
- Probiere Neues: 2–6 geometrische formen (Kreise, Ringe, Dreiecke, Bögen, diagonale Bänder, Linien), Überlagerungen, Asymmetrie, Diagonalen, angeschnittene Formen und Fotos über den Rand (x und y dürfen bis 3 Felder außerhalb liegen). Formen dürfen gedreht sein.
- Textboxen (headline, subline, block:…, cta) überlappen sich NICHT und liegen vollständig im Format, mindestens 1 Feld vom Rand.
- Boxgröße passend zur Textlänge: etwa 1 Rasterfeld Fläche pro 10 Zeichen Fließtext; die Headline bekommt viel Fläche.
- Text auf einer Form oder einem Foto nur mit stil "invertiert" oder "box_flaeche", damit er lesbar bleibt.
- WICHTIG markierte Inhalte bekommen stil "box_akzent", "invertiert" oder "gross" und einen auffälligen Platz.
- cta mit stil "box_akzent" dort, wo der Blick endet.
- Logos klein (etwa 3 × 1,5 Felder). qr etwa 2 × 2 Felder.
- drehung: Formen frei, Textboxen höchstens ±6 Grad, meist 0.
- bildform für Fotos frei wählen (rechteck, kreis, abgerundet, bogen).
- name: 2–3 Wörter auf Deutsch. idee: ein Satz, was die Komposition ausmacht.`;
  run('Neue Komposition wird erfunden …', async () => {
    const res = await llm(prompt, FREE_SCHEMA, 'frei');
    const id = Date.now().toString(36);
    D.eigeneLayouts = [...(D.eigeneLayouts || []), { id, name: (res.name || 'Freie Komposition').slice(0, 40), idee: res.idee || '', inspiration: insp, frei: { formen: res.formen || [], elemente: res.elemente || [], format: D.format } }];
    D.layout = 'c_' + id; D.freeFit = null;
    addLog(`Neue Komposition „${res.name}“`, res.idee);
  });
}

/* Regeln auf die freie Komposition anwenden: Rand, Überlappungen, Wichtiges, Vollständigkeit */
function normalizeFree(D, c) {
  const f = FORMATE[D.format], { C, R } = gridOf(f), inv = freeInventory(D), R0 = [];
  const src = c.frei, sx = src.format && FORMATE[src.format] ? gridOf(FORMATE[src.format]) : { C, R };
  const kx = C / sx.C, ky = R / sx.R;
  const num = (v, d) => Number.isFinite(+v) ? +v : d;
  const formen = (src.formen || []).filter(s => FORMEN.includes(s.form)).slice(0, 8).map(s => ({
    ...s, x: Math.max(-4, Math.min(C + 2, num(s.x, 0) * kx)), y: Math.max(-4, Math.min(R + 2, num(s.y, 0) * ky)),
    w: Math.max(.3, Math.min(C + 8, num(s.w, 2) * kx)), h: Math.max(.3, Math.min(R + 8, num(s.h, 2) * ky)),
    deckkraft: Math.max(.08, Math.min(1, num(s.deckkraft, .6))), drehung: Math.max(-90, Math.min(90, num(s.drehung, 0)))
  }));
  const seen = new Set();
  let els = (src.elemente || []).filter(e => inv[e.ref] && !seen.has(e.ref) && seen.add(e.ref)).map(e => ({
    ...e, x: num(e.x, 1) * kx, y: num(e.y, 1) * ky, w: Math.max(1, num(e.w, 4) * kx), h: Math.max(.8, num(e.h, 2) * ky),
    stil: FE_STILE.includes(e.stil) ? e.stil : 'normal', drehung: Math.max(-6, Math.min(6, num(e.drehung, 0)))
  }));
  /* Textboxen ganz ins Format, 0,6 Felder Rand */
  els.forEach(e => {
    if (!isText(inv[e.ref]) && inv[e.ref].typ !== 'qr' && inv[e.ref].typ !== 'logo') return;
    e.w = Math.min(e.w, C - 1.2); e.h = Math.min(e.h, R - 1.2);
    e.x = Math.max(.6, Math.min(C - .6 - e.w, e.x)); e.y = Math.max(.6, Math.min(R - .6 - e.h, e.y));
  });
  /* Logos: Wunschort der Person hat Vorrang */
  els.forEach(e => {
    const it = inv[e.ref]; if (it.typ !== 'logo' || !PLATZ[it.platz]) return;
    const [ber, al] = PLATZ[it.platz]; e.w = 3; e.h = 1.5;
    e.y = ber === 'fuss' ? R - 2.1 : .6; e.x = al === 'links' ? .6 : al === 'rechts' ? C - 3.6 : (C - 3) / 2;
  });
  /* Wichtiges muss auffallen */
  let fixWichtig = 0;
  els.forEach(e => { const it = inv[e.ref]; if (it.typ === 'block' && it.wichtig === 'hoch' && ['normal', 'umrandet'].includes(e.stil)) { e.stil = 'box_akzent'; fixWichtig++; } if (it.typ === 'cta' && e.stil === 'normal') e.stil = 'box_akzent'; });
  if (fixWichtig) R0.push('Wichtiges war nicht hervorgehoben: Es bekommt eine Akzentfläche.');
  /* Überlappungen nach Wichtigkeit auflösen: Wichtiges zuerst, jede Box bekommt den nächsten freien Platz */
  const inter = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  const prio = it => it.typ === 'headline' ? 0 : it.typ === 'block' && it.wichtig === 'hoch' ? 1 : it.typ === 'cta' ? 2 : it.typ === 'subline' ? 3 : it.typ === 'block' && it.wichtig !== 'niedrig' ? 4 : 5;
  const belegt = els.filter(e => ['logo', 'qr'].includes(inv[e.ref].typ));
  const frei = b => b.x >= .59 && b.y >= .59 && b.x + b.w <= C - .59 && b.y + b.h <= R - .59 && belegt.every(o => inter(o, b) <= .05);
  const suche = (e, hs, ws) => {
    let best = null, bd = Infinity;
    for (const hk of hs) {
      const h = Math.max(1, e.h * hk);
      for (const w of ws) for (let y = .6; y <= R - .6 - h + 1e-6; y += .25) for (const x0 of [e.x, .6, C - .6 - w]) {
        const b = { ...e, x: Math.max(.6, Math.min(C - .6 - w, x0)), y, w, h };
        if (!frei(b)) continue;
        const d = Math.abs(b.y - e.y) + Math.abs(b.x - e.x) * .5 + (1 - hk) * 6 + (w !== e.w ? 2 : 0);
        if (d < bd) { bd = d; best = b; }
      }
      if (best) return best;
    }
    return null;
  };
  const texte = els.filter(e => isText(inv[e.ref])).sort((a, b) => prio(inv[a.ref]) - prio(inv[b.ref]));
  const ohne = []; let moved = 0;
  for (const e of texte) {
    if (frei(e)) { belegt.push(e); continue; }
    const b = suche(e, [1, .8, .65, .5], [e.w, C - 1.2]);
    if (b) { Object.assign(e, b); belegt.push(e); moved++; } else ohne.push(e);
  }
  if (moved) R0.push(`${moved} überlappende Textbox${moved > 1 ? 'en haben' : ' hat'} den nächsten freien Platz bekommen, Wichtiges zuerst.`);
  els = els.filter(e => !ohne.includes(e));
  /* Text auf einem Foto bekommt eine Fläche, damit er lesbar bleibt */
  const fotos = els.filter(e => inv[e.ref] && inv[e.ref].typ === 'bild');
  let unterlegt = 0;
  els.forEach(e => { if (isText(inv[e.ref]) && ['normal', 'gross', 'umrandet'].includes(e.stil) && fotos.some(b => inter(b, e) > .3)) { e.stil = 'box_flaeche'; unterlegt++; } });
  if (unterlegt) R0.push('Text, der auf einem Foto liegt, bekommt eine ruhige Fläche dahinter, damit er lesbar bleibt.');
  /* Text auf einer Form mit zu wenig Kontrast ebenfalls unterlegen */
  const palN = normPalette((((D.spec || {}).sem || {}).stil || {}).palette);
  const fcol = k => ({ akzent: palN.akzent, flaeche: palN.flaeche, text: palN.text, hintergrund: palN.hintergrund })[k] || palN.akzent;
  const dunkleFormen = formen.filter(f => f.deckkraft >= .3 && f.farbe !== 'hintergrund' && f.form !== 'linie' && contrast(palN.text, mixHex(palN.hintergrund, fcol(f.farbe), f.deckkraft)) < 3.2);
  let kontrast = 0;
  els.forEach(e => { if (isText(inv[e.ref]) && ['normal', 'gross', 'umrandet'].includes(e.stil) && dunkleFormen.some(f => inter(f, e) > Math.min(e.w * e.h * .15, 1))) { e.stil = 'box_flaeche'; kontrast++; } });
  if (kontrast) R0.push('Text auf einer Form mit zu wenig Kontrast bekommt eine Fläche dahinter.');
  /* Vergessenes und Verdrängtes in einem gemeinsamen Bereich ergänzen, sonst das Unwichtigste weglassen */
  const placed = new Set(els.map(e => e.ref));
  let fehlt = Object.entries(inv).filter(([ref, it]) => !placed.has(ref) && it.typ !== 'bild').sort((a, b) => prio(a[1]) - prio(b[1]));
  if (fehlt.length) {
    let rest = null;
    while (fehlt.length && !rest) {
      const need = Math.min(R - 1.2, 1.2 + fehlt.reduce((n, [, it]) => n + (isText(it) ? Math.min(3, .8 + (it.text || '').length / 70) : 1.4), 0));
      rest = suche({ x: .6, y: R, w: C - 1.2, h: need }, [1, .8, .6, .45], [C - 1.2]);
      if (!rest && fehlt.length > 1) { const [ref, it] = fehlt[fehlt.length - 1]; if (prio(it) >= 4 || it.typ === 'qr' || it.typ === 'logo') fehlt.pop(); else break; }
      else if (!rest) break;
    }
    const weg = Object.entries(inv).filter(([ref, it]) => !placed.has(ref) && it.typ !== 'bild' && !fehlt.some(([r]) => r === ref));
    if (rest) { els.push({ ref: 'rest', refs: fehlt.map(([r]) => r), ...rest, ausrichtung: 'links', vertikal: 'oben', stil: 'normal', drehung: 0 }); belegt.push(rest); R0.push(`${fehlt.length} Inhalt${fehlt.length > 1 ? 'e wurden' : ' wurde'} im freien Bereich ergänzt, damit nichts fehlt.`); }
    else weg.push(...fehlt);
    if (weg.length) R0.push(`Weggelassen, weil kein Platz: ${weg.map(([r, it]) => `„${String(it.label || it.text || r).slice(0, 24)}“`).join(', ')}.`);
  }
  return { C, R, formen, els, inv, regeln: R0 };
}

function renderFree(D, ed, st) {
  const c = customOf(D), N = normalizeFree(D, c), f = FORMATE[D.format], sem = (D.spec && D.spec.sem) || {}, stil = sem.stil || {};
  st = st || {};
  const pal = normPalette(stil.palette);
  const hf = loadFont(stil.schrift_headline), tf = loadFont(stil.schrift_text);
  const bgA = D.assets.find(a => (a.rolle === 'hintergrund' || a.platzierung === 'hintergrund') && ui.assetURL[a.id]);
  const col = k => ({ akzent: pal.akzent, flaeche: pal.flaeche, text: pal.text, hintergrund: pal.hintergrund })[k] || pal.akzent;
  const pos = b => `left:${b.x / N.C * 100}%;top:${b.y / N.R * 100}%;width:${b.w / N.C * 100}%;height:${b.h / N.R * 100}%`;
  const ce = p => ed && p ? ` contenteditable="true" data-path="${p}" spellcheck="false"` : '';
  const shapes = N.formen.map(s => `<div class="fs fs-${s.form}" style="${pos(s)};--c:${col(s.farbe)};opacity:${s.deckkraft};transform:rotate(${s.drehung}deg)"></div>`).join('');
  const inner = (ref, it) => {
    const k = st[ref] || {}, text = k.kurz && it.kurz ? it.kurz : it.text;
    switch (it.typ) {
      case 'headline': return `<div class="t-h"${ce(it.path)}>${ph(text)}</div>`;
      case 'subline': return `<div class="t-s"${ce(it.path)}>${ph(text)}</div>`;
      case 'block': return `${it.label ? `<b${ce(it.lpath)}>${ph(it.label)}</b>` : ''}<span${ce(it.path)}>${ph(text)}</span>`;
      case 'cta': return `<span class="pill"${ce(it.path)}>${ph(text)}</span>`;
      case 'qr': return `<div class="qrbox"></div>`;
      case 'logo': return ui.assetURL[it.asset] ? `<img src="${ui.assetURL[it.asset]}" alt="Logo">` : '<div class="phbox">Logo</div>';
      case 'bild': return ui.assetURL[it.asset] ? `<img src="${ui.assetURL[it.asset]}" alt="${esc(it.text || '')}">` : `<div class="phbox"><span>${esc(it.text || 'Foto')}</span></div>`;
    }
    return '';
  };
  const els = N.els.map(e => {
    if (e.ref === 'rest') return `<div class="fe fe-rest al-links va-oben" style="${pos(e)};--es:${(st.rest || {}).es || 1}" data-ref="rest" data-txt="1"><div class="fe-in">${e.refs.map(r => `<div class="rest-i rest-${N.inv[r].typ}">${inner(r, N.inv[r])}</div>`).join('')}</div></div>`;
    const it = N.inv[e.ref], k = st[e.ref] || {};
    return `<div class="fe fe-${it.typ} st-${e.stil} al-${e.ausrichtung || 'links'} va-${e.vertikal || 'oben'} bf-${e.bildform || 'rechteck'}${it.wichtig === 'hoch' ? ' wichtig' : ''}${k.clip ? ' clip' : ''}" style="${pos(e)};--es:${k.es || 1};${e.drehung ? `transform:rotate(${e.drehung}deg)` : ''}" data-ref="${e.ref}"${isText(it) ? ' data-txt="1"' : ''}><div class="fe-in">${inner(e.ref, it)}</div></div>`;
  }).join('');
  const bg = bgA ? `background:linear-gradient(${alpha(pal.hintergrund, .55)},${alpha(pal.hintergrund, .55)}),url('${ui.assetURL[bgA.id]}') center/cover no-repeat,${pal.hintergrund}` : flyerBg({ pal, stil, bgA: null });
  const vars = `--ratio:${f.w}/${f.h};--s:${f.s || 1};--fbg:${pal.hintergrund};--ffl:${pal.flaeche};--ftx:${pal.text};--fac:${pal.akzent};--fon:${onColor(pal.akzent)};--fhf:${hf ? `'${hf}',` : ''}var(--display);--ftf:${tf ? `'${tf}',` : ''}var(--body)`;
  return { html: `<div class="flc"><div class="fl fr" style="${vars};${bg}">${shapes}${els}</div></div>`, N };
}

/* Jedes Textelement passt sich einzeln an seine Box an */
function fitFree() {
  const D = S.design, stage = document.getElementById('ds-stage');
  if (!D || !stage || S.screen !== 'design' || !isFree(D)) return;
  if (stage.contains(document.activeElement)) return;
  const c = customOf(D), st = {};
  const draw = () => { const r = renderFree(D, true, st); stage.innerHTML = `<div class="ds-paper fmt-${D.format}">${r.html}</div>`; return r.N; };
  const over = el => { const i = el.querySelector('.fe-in'); return i.scrollHeight > i.clientHeight + 1 || i.scrollWidth > i.clientWidth + 1; };
  const shrink = el => { let es = 1; el.style.setProperty('--es', es); while (over(el) && es > .4) { es = +(es - .05).toFixed(2); el.style.setProperty('--es', es); } return es; };
  let N = draw();
  stage.querySelectorAll('.fe[data-txt]').forEach(el => { st[el.dataset.ref] = { es: shrink(el) }; });
  /* Was trotz Verkleinern nicht passt: Kurzfassung */
  const need = [...stage.querySelectorAll('.fe[data-txt]')].filter(el => over(el)).map(el => el.dataset.ref).filter(r => N.inv[r] && N.inv[r].kurz);
  if (need.length) {
    need.forEach(r => { st[r] = { es: 1, kurz: true }; });
    N = draw();
    need.forEach(r => { const el = stage.querySelector(`.fe[data-ref="${r}"]`); if (el) st[r].es = shrink(el); });
  }
  stage.querySelectorAll('.fe[data-txt]').forEach(el => { const r = el.dataset.ref; st[r] = st[r] || {}; st[r].es = +getComputedStyle(el).getPropertyValue('--es') || st[r].es || 1; if (over(el)) { st[r].clip = true; el.classList.add('clip'); } });
  D.freeFit = { id: c.id, format: D.format, st }; save();
  const small = Object.values(st).filter(x => x.es < .95).length, kurz = Object.values(st).filter(x => x.kurz).length, clip = Object.values(st).filter(x => x.clip).length;
  const notes = [];
  if (small) notes.push(`${small} ${small > 1 ? 'Textboxen haben' : 'Textbox hat'} die Schrift an ihre Box angepasst`);
  if (kurz) notes.push(`${kurz} durch die Kurzfassung ersetzt`);
  if (clip) notes.push(`${clip} passt auch so nicht ganz und ist abgeschnitten`);
  const fn = document.getElementById('ds-fitnote');
  if (fn) { fn.hidden = !notes.length; fn.innerHTML = notes.length ? `<b>Automatisch angepasst:</b> ${esc(notes.join(' · '))}.` : ''; }
  const ovf = document.getElementById('ds-ovf'); if (ovf) ovf.hidden = !clip;
  const rl = document.getElementById('ds-rules');
  if (rl) rl.innerHTML = [`Freie Komposition „${c.name}“: ${c.idee}`, ...N.regeln, 'Jede Textbox passt ihre Schrift selbst an ihre Größe an, zu lange Texte werden zur Kurzfassung.'].map(r => `<li>${esc(r)}</li>`).join('');
}
const freeFitFor = D => { const c = customOf(D); return D.freeFit && c && D.freeFit.id === c.id && D.freeFit.format === D.format ? D.freeFit.st : {}; };

/* Vorschaubild der Komposition für die Auswahl */
function freeThumb(l) {
  const f = FORMATE[(l.frei && l.frei.format) || 'a5_hoch'] || FORMATE.a5_hoch, { C, R } = gridOf(f);
  const A = 'var(--accent)';
  const sh = (l.frei.formen || []).map(s => {
    const o = Math.max(.15, Math.min(1, +s.deckkraft || .5)) * .8, tr = s.drehung ? ` transform="rotate(${+s.drehung} ${+s.x + +s.w / 2} ${+s.y + +s.h / 2})"` : '';
    if (['kreis', 'oval', 'ring', 'halbkreis'].includes(s.form)) return `<ellipse cx="${+s.x + +s.w / 2}" cy="${+s.y + +s.h / 2}" rx="${+s.w / 2}" ry="${+s.h / 2}" fill="${s.form === 'ring' ? 'none' : A}" stroke="${s.form === 'ring' ? A : 'none'}" stroke-width=".4" opacity="${o}"${tr}/>`;
    if (s.form === 'dreieck') return `<polygon points="${+s.x + +s.w / 2},${+s.y} ${+s.x + +s.w},${+s.y + +s.h} ${+s.x},${+s.y + +s.h}" fill="${A}" opacity="${o}"${tr}/>`;
    return `<rect x="${+s.x}" y="${+s.y}" width="${+s.w}" height="${s.form === 'linie' ? .2 : +s.h}" rx="${s.form === 'bogen' ? +s.w / 2 : 0}" fill="${A}" opacity="${o}"${tr}/>`;
  }).join('');
  const el = (l.frei.elemente || []).map(e => {
    const head = e.ref === 'headline', img = /^bild:/.test(e.ref);
    const fill = img ? 'color-mix(in srgb, var(--muted) 45%, transparent)' : head ? 'var(--ink)' : ['box_akzent', 'invertiert'].includes(e.stil) ? A : 'var(--muted)';
    return `<rect x="${+e.x}" y="${+e.y}" width="${+e.w}" height="${head ? Math.min(+e.h, 2.4) : img ? +e.h : Math.min(+e.h, 1)}" rx="${img && e.bildform === 'kreis' ? +e.w / 2 : .2}" fill="${fill}" opacity="${head ? .9 : .55}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${C} ${R}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect width="${C}" height="${R}" fill="var(--surface)" stroke="var(--line)" stroke-width=".15"/><g>${sh}${el}</g></svg>`;
}

function inventGuided(base) {
  const D = designState(), lvl = MUT[D.mut] ? D.mut : 'ausgewogen', M = MUT[lvl], insp = pick(INSPIRATION);
  const sem = D.spec && D.spec.sem;
  const vorhanden = [...Object.values(LAYOUTS).map(v => `- ${v.name}: ${v.info}`), ...(D.eigeneLayouts || []).slice(-8).map(l => `- ${variantSummary(l)}`)].join('\n');
  const prompt = `Gestalte eine Layoutvariante für einen ${FORMATE[D.format].name} (${FORMATE[D.format].info}).
Die App baut daraus ein sauberes Layout mit fester Lesereihenfolge (Logo, Headline, Wichtiges, Fakten, Text, Aufforderung) und passt alles ans Format an. Du bestimmst den Charakter.
Projekt: ${S.titel || cleanLabel(D.texte.headline)}. Stimmung: ${(sem && sem.stimmung) || D.briefing.stimmung || 'offen'}. Zielgruppe: ${(findField('zielgruppe') || {}).wert || 'offen'}.
Inhalt: Headline „${cleanLabel(D.texte.headline)}“, ${D.texte.bloecke.length} Textblöcke${D.assets.some(a => a.rolle === 'bild') ? ', ein Foto' : ', kein Foto'}${D.assets.some(a => a.rolle === 'logo') ? ', ein Logo' : ''}.

EXPERIMENTIERFREUDE: ${M.name}. Grenzen: Headline-Position nur ${M.hpos.join(' oder ')}, Ausrichtung nur ${M.align.join(' oder ')}, höchstens ${M.formen} Formen, Deckkraft höchstens ${M.deck}, Headline-Drehung höchstens ${M.rot} Grad${M.overlap ? '' : ', keine Überlappung von Headline und Bild'}${M.xxl ? '' : ', keine übergroße Headline'}, Bildschnitt nur ${M.schnitt.join(' oder ')}.
INSPIRATION: ${insp}.
${base ? `AUSGANGSVARIANTE (mach eine Variation davon: Grundstruktur ähnlich, aber 2–3 Dinge spürbar anders):\n${variantSummary(base)}${base.eingriffe ? `; Eingriffe ${JSON.stringify(base.eingriffe)}` : ''}\n` : `VORHANDENE VARIANTEN (mach etwas deutlich anderes):\n${vorhanden}\n`}
AUFGABE:
1. Struktur: wähle für jeden Parameter einen Wert (bild, farbblock, headline_pos, ausrichtung, headline_stil, fakten_stil, deko, dichte).
2. formen: Dekoration im Hintergrund, am Rand oder in freien Flächen, gern angeschnitten. x und y in Prozent der Fläche (0–100, angeschnitten bis -30 oder 130), w und h in Prozent der BREITE (ein Kreis hat w = h). Nicht großflächig hinter Fließtext legen.
3. eingriffe: bild_schnitt, headline_ueberlappt_bild (Headline ragt ins Foto), headline_xxl (sehr große Headline), headline_drehung (Grad, meist 0), akzent_wort (erstes Wort oder Zahl der Headline in Akzentfarbe).
name: 2–3 Wörter, kreativ, auf Deutsch. idee: ein Satz, was die Variante ausmacht.`;
  run(base ? 'Variation wird gestaltet …' : 'Neue Variante wird gestaltet …', async () => {
    const res = await llm(prompt, GUIDED_SCHEMA, 'gelenkt');
    const p = {};
    Object.entries(CL_PARAMS).forEach(([k, v]) => { p[k] = v.includes(res[k]) ? res[k] : pick(v); });
    /* Grenzen der Experimentierfreude durchsetzen */
    if (!M.hpos.includes(p.headline_pos)) p.headline_pos = 'oben';
    if (!M.align.includes(p.ausrichtung)) p.ausrichtung = 'links';
    const n = v => Number.isFinite(+v) ? +v : 0;
    const formen = (res.formen || []).filter(s => DEKO_FORMEN.includes(s.form)).slice(0, M.formen).map(s => ({
      form: s.form, farbe: ['akzent', 'flaeche', 'text'].includes(s.farbe) ? s.farbe : 'akzent',
      x: Math.max(-30, Math.min(130, n(s.x))), y: Math.max(-30, Math.min(130, n(s.y))),
      w: Math.max(2, Math.min(160, n(s.w) || 30)), h: Math.max(.6, Math.min(160, n(s.h) || 30)),
      deckkraft: Math.max(.06, Math.min(M.deck, n(s.deckkraft) || .3)), drehung: Math.max(-60, Math.min(60, n(s.drehung)))
    }));
    const e = res.eingriffe || {};
    const eingriffe = {
      bild_schnitt: M.schnitt.includes(e.bild_schnitt) ? e.bild_schnitt : 'gerade',
      headline_ueberlappt_bild: !!e.headline_ueberlappt_bild && M.overlap,
      headline_xxl: !!e.headline_xxl && M.xxl,
      headline_drehung: Math.max(-M.rot, Math.min(M.rot, n(e.headline_drehung))),
      akzent_wort: !!e.akzent_wort

    const id = Date.now().toString(36);
    D.eigeneLayouts = [...(D.eigeneLayouts || []), { id, name: (res.name || 'Eigene Variante').slice(0, 40), idee: res.idee || '', inspiration: insp, mut: lvl, basis: base ? base.name : '', p, formen, eingriffe }];
    D.layout = 'c_' + id; D.fit = FIT0();
    addLog(`${base ? 'Variation' : 'Neue Variante'} „${res.name}“`, res.idee);
  });
}

/* Deko-Formen als Hintergrundebene: x/y in % der Fläche, w/h in % der Breite */
function renderDeko(plan) {
  const c = plan.custom; if (!c || !c.formen || !c.formen.length) return '';
  const col = k => ({ akzent: plan.pal.akzent, flaeche: plan.pal.flaeche, text: plan.pal.text })[k] || plan.pal.akzent;
  const dim = (plan.fit && plan.fit.dim) || [];
  return c.formen.map((s, i) => `<div class="fs fs-${s.form} gk" data-fs="${i}" style="left:${s.x}%;top:${s.y}%;width:${s.w}cqw;height:${s.form === 'linie' ? .7 : s.h}cqw;--c:${col(s.farbe)};opacity:${dim.includes(i) ? Math.min(.12, s.deckkraft) : s.deckkraft};transform:rotate(${s.drehung}deg)"></div>`).join('');
}

/* Formen, die hinter Text liegen und ihn schwer lesbar machen, abschwächen */
function dimShapes(stage, plan) {
  const fl = stage.querySelector('.fl'); if (!fl || !plan.custom || !plan.custom.formen) return [];
  const texts = [...fl.querySelectorAll('.el-headline,.el-subline,.el-text,.el-info2,.el-liste2,.el-klein,.el-fakten')].map(e => e.getBoundingClientRect());
  const out = [];
  fl.querySelectorAll('.fs.gk').forEach(el => {
    const i = +el.dataset.fs, s = plan.custom.formen[i]; if (!s) return;
    const r = el.getBoundingClientRect();
    const hit = texts.some(t => { const ix = Math.max(0, Math.min(r.right, t.right) - Math.max(r.left, t.left)), iy = Math.max(0, Math.min(r.bottom, t.bottom) - Math.max(r.top, t.top)); return ix * iy > t.width * t.height * .12; });
    const c = ({ akzent: plan.pal.akzent, flaeche: plan.pal.flaeche, text: plan.pal.text })[s.farbe] || plan.pal.akzent;
    if (hit && contrast(plan.pal.text, mixHex(plan.pal.hintergrund, c, s.deckkraft)) < 4) out.push(i);
  });
  return out;
}

function guidedThumb(l) {
  let svg = customThumb(l.p);
  const sh = (l.formen || []).map(s => {
    const x = s.x * .3, y = s.y * .42, w = s.w * .3, h = (s.form === 'linie' ? .7 : s.h) * .3, o = Math.min(.8, s.deckkraft + .15), tr = s.drehung ? ` transform="rotate(${s.drehung} ${x + w / 2} ${y + h / 2})"` : '';
    if (['kreis', 'ring', 'halbkreis'].includes(s.form)) return `<ellipse cx="${x + w / 2}" cy="${y + h / 2}" rx="${w / 2}" ry="${h / 2}" fill="${s.form === 'ring' ? 'none' : 'var(--accent)'}" stroke="${s.form === 'ring' ? 'var(--accent)' : 'none'}" stroke-width=".8" opacity="${o}"${tr}/>`;
    if (s.form === 'dreieck') return `<polygon points="${x + w / 2},${y} ${x + w},${y + h} ${x},${y + h}" fill="var(--accent)" opacity="${o}"${tr}/>`;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--accent)" opacity="${o}"${tr}/>`;
  }).join('');
  return svg.replace('<g clip-path="inset(0 round 2px)">', `<g clip-path="inset(0 round 2px)">${sh}`);
}

function toast(text) {

/* ---------- KI ---------- */
function siteKontext() {
  const D = designState(), b = D.briefing;
  const assets = D.assets.map(a => `- id "${a.id}": ${a.rolle === 'logo' ? 'Logo' : a.rolle === 'hintergrund' ? 'Hintergrundbild' : 'Bild'}${a.beschreibung ? `, zeigt: ${a.beschreibung}` : ''}`).join('\n') || '(keine)';
  return `PROJEKTAKTE (JSON):\n${akte()}\n\nBILDER UND LOGOS:\n${assets}\nSTIL UND STIMMUNG: ${b.stimmung || '(frei, passend zur Zielgruppe)'}\nWÜNSCHE: ${b.wuensche || '(keine)'}\nNO-GOS: ${b.nogos || '(keine)'}\n\nBLOCKBIBLIOTHEK (typ: wofür, varianten):\n${BIBLIOTHEK}\n\nREGELN FÜR BLÖCKE:\n- Inhalte konkret aus der Akte, keine Fülltexte wie Lorem ipsum; fehlende Fakten als [Platzhalter].\n- items: bei Blöcken mit Einträgen 3–6 Einträge (titel, text, meta je nach Typ: Zahl, Datum, Rolle, Name, Preis, sonst "").\n- asset_id: passende ids aus der Bildliste, sonst ""; bild_wunsch: was auf dem Bild zu sehen sein soll.\n- hintergrund abwechselnd ruhig (hell, flaeche), CTA-Blöcke "akzent", höchstens ein "dunkel" pro Seite.\n- cta: Knopftext oder "".\n- Alles auf Deutsch.`;
}
function generateSite(refine) {
  const D = designState();
  if (refine) { const fb = document.getElementById('ds-feedback'); D.feedback = fb ? fb.value.trim() : D.feedback; if (!D.feedback) { ui.error = 'Beschreibe kurz, was anders werden soll.'; return render(); } }
  let prompt = siteKontext() + `\n\nGEWÜNSCHTE SEITEN UND INHALTE (von der Person):\n${D.briefing.seiten || '(frei: 3–5 sinnvolle Seiten für dieses Projekt)'}\n
AUFGABE: Erstelle eine Website als klickbaren Wireframe.
- seiten: genau die gewünschten Seiten in dieser Reihenfolge (sonst 3–5 sinnvolle); die erste ist die Startseite. titel kurz (Menüpunkt).
- je Seite 3–7 bloecke aus der Bibliothek, passend zum Zweck der Seite; die Startseite beginnt mit hero, Seiten enden meist mit cta oder kontakt.
- navbar: variante und cta (Knopftext für die wichtigste Aktion oder ""). footer: variante und text.
- palette (Hex, gut lesbar), schrift_headline und schrift_text (Google-Fonts-Namen), logo_asset_id (id des Logos oder "").
- begruendung: 2 Sätze. hinweise: 2–4 Hinweise für die Umsetzung.`;
  if (refine && D.spec) prompt += `\n\nAKTUELLE WEBSITE (JSON):\n${JSON.stringify({ ...D.spec, seiten: D.spec.seiten.map(p => ({ titel: p.titel, bloecke: p.bloecke.map(({ id, ...x }) => x) })) })}\n\nÄNDERUNGSWUNSCH:\n${D.feedback}\nSetze den Wunsch um und behalte alles andere bei.`;
  run(refine ? 'Website wird überarbeitet …' : 'Website wird gestaltet …', async () => {
    const res = await llm(prompt, SITE_SCHEMA, 'site');
    D.spec = normSite(res, D.spec); D.webPage = D.spec.seiten[0].id; D.webSel = null;
    D.versionen.push(JSON.parse(JSON.stringify({ spec: D.spec, texte: D.texte }))); D.versionen = D.versionen.slice(-8); D.aktiv = D.versionen.length - 1;
    if (refine) D.feedback = '';
    addLog(refine ? 'Website überarbeitet' : 'Website gestaltet', `${D.spec.seiten.length} Seiten`);
  });
}
function generatePage(pi, desc, label) {
  const D = designState(), sp = D.spec, page = sp.seiten[pi];
  const prompt = siteKontext() + `\n\nWEBSITE: Seiten ${sp.seiten.map(p => `„${p.titel}“`).join(', ')}. Farben und Schriften stehen fest.\nSEITE: „${page.titel}“${pi === 0 ? ' (Startseite)' : ''}\nBESCHREIBUNG DER PERSON: ${desc || '(frei: was für diese Seite sinnvoll ist)'}\n\nAUFGABE: Erstelle die Blöcke genau dieser Seite (3–7), in der beschriebenen Reihenfolge und mit den beschriebenen Inhalten.`;
  run(label || `Seite „${page.titel}“ wird aufgebaut …`, async () => {
    const res = await llm(prompt, PAGE_SCHEMA, 'seite');
    const ids = new Set(D.assets.map(a => a.id));
    page.bloecke = (res.bloecke || []).map(b => normBlock(b, ids)).filter(Boolean);
    if (!page.bloecke.length) page.bloecke = [newBlock('hero')];
    D.webPage = page.id; D.webSel = null;
    D.versionen.push(JSON.parse(JSON.stringify({ spec: D.spec, texte: D.texte }))); D.versionen = D.versionen.slice(-8); D.aktiv = D.versionen.length - 1;
    addLog(`Seite „${page.titel}“ aufgebaut`, desc);
  });
}
function editBlockAI(pi, bi, wish) {
  const D = designState(), page = D.spec.seiten[pi], b = page.bloecke[bi];

  const prompt = siteKontext() + `\n\nSEITE: „${page.titel}“\nBLOCK (JSON):\n${JSON.stringify(ohneId)}\n\nWUNSCH DER PERSON: ${wish}\n\nAUFGABE: Gib den überarbeiteten Block zurück. typ und variante darfst du ändern, wenn der Wunsch es verlangt (z. B. "mach daraus Cards").`;
  run('Block wird überarbeitet …', async () => {
