<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projekt-Kompass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#16202A; --muted:#5B6874; --line:#D3DAE0;
  --accent:#2F4BD8; --accent-soft:#E3E8FC; --on-accent:#FFFFFF;
  --assume:#9A6608; --assume-bg:#FBF0D8; --ok:#25704A; --ok-bg:#DFF1E6; --review:#B03F2B; --review-bg:#F8E1DB;
  --radius-l:18px; --radius-m:10px; --radius-s:6px;
  --display:"Familjen Grotesk", ui-sans-serif, system-ui, sans-serif;
  --body:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171D; --surface:#1A2129; --surface-2:#212A34; --ink:#E6ECF1; --muted:#95A3B0; --line:#2E3946;
    --accent:#8197FF; --accent-soft:#252F57; --on-accent:#0E1430;
    --assume:#E6B451; --assume-bg:#382D15; --ok:#6CC490; --ok-bg:#16301F; --review:#F08C75; --review-bg:#3B211B;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.tiny{padding:3px 10px;font-size:.8rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:.8rem;font-weight:500}
.linkbtn:hover{text-decoration:underline}

/* Top bar */
.top{display:flex;align-items:center;gap:16px;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.1rem}
.needle{width:26px;height:26px}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:.8rem;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--review)}

/* Start */
.start{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;padding:40px 0 80px;align-items:start}
.start h1{font-size:clamp(2.4rem,5vw,4rem);font-weight:700;margin-bottom:14px}
.start .lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin:0 0 28px}
.bigtext{width:100%;min-height:170px;resize:vertical;border:1px solid var(--line);border-radius:var(--radius-l);background:var(--surface);padding:18px 20px;font-size:1.05rem;line-height:1.5}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 26px}
.example{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.example:hover{color:var(--ink);border-color:var(--muted)}
.fieldlabel{display:block;font-weight:600;margin:0 0 8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:28px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 8px;text-align:left}
.seg button strong{display:block;font-family:var(--display);font-size:1rem}
.seg button span{display:block;font-size:.78rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft)}
.seg button[aria-pressed="true"] strong{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:22px}
.panel h3{font-size:1.05rem;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-m);padding:8px 12px}
.howto{margin:18px 0 0;padding-left:20px;color:var(--muted);font-size:.9rem}
.howto li{margin-bottom:6px}

/* Route track */
.route{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:18px 22px 16px;margin-bottom:22px}
.route-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.route-head h2{font-size:1.35rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--accent);line-height:1}
.track{display:flex;gap:6px;align-items:stretch}
.leg{flex:1 1 0;min-width:0}
.leg-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.leg-bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;transition:width .5s ease}
.leg-ticks{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tick{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent;padding:0}
.tick.bestaetigt{background:var(--ok);border-color:var(--ok)}
.tick.annahme{background:var(--assume);border-color:var(--assume)}
.tick.pruefen{background:var(--review-bg);border-color:var(--review)}
.tick.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.leg-name{font-size:.8rem;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg.current .leg-name{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Interview layout */
.work{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;padding-bottom:60px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:30px 32px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:.78rem;border-radius:var(--radius-s);padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.tag.follow{background:var(--assume-bg);color:var(--assume)}
.tag.moved{background:var(--accent-soft);color:var(--accent)}
.question{font-family:var(--display);font-size:clamp(1.5rem,2.6vw,2.05rem);font-weight:600;line-height:1.2;margin:0 0 22px;max-width:30ch}
.chips{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.chip{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-m);padding:11px 14px;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.answer{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);padding:12px 14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.actions .spacer{flex:1}
.kbd{font-size:.75rem;color:var(--muted)}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted);padding:40px 0}
.thinking svg{width:34px;height:34px;animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}100%{transform:rotate(-30deg)}}
@media (prefers-reduced-motion: reduce){.thinking svg{animation:none}.leg-bar i{transition:none}}

.proposal{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius-l);padding:16px 18px;margin-bottom:14px}
.proposal p{margin:2px 0 12px}
.proposal strong{font-family:var(--display)}
.error{border:1px solid var(--review);background:var(--review-bg);color:var(--ink);border-radius:var(--radius-m);padding:12px 16px;margin-bottom:14px}
.done{text-align:left}
.done h2{font-size:1.8rem;margin-bottom:10px}

/* Sidebar */
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:18px 18px 8px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.side h3{font-size:1.05rem}
.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.phase-group{margin-top:16px}
.phase-title{font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.fact{border-top:1px solid var(--line);padding:9px 0}
.fact-top{display:flex;align-items:center;gap:8px}
.fact-label{font-weight:600;font-size:.9rem;flex:1}
.status{font-size:.7rem;border-radius:var(--radius-s);padding:1px 7px;white-space:nowrap}
.status.bestaetigt{background:var(--ok-bg);color:var(--ok)}
.status.annahme{background:var(--assume-bg);color:var(--assume)}
.status.pruefen{background:var(--review-bg);color:var(--review)}
.status.leer{background:var(--surface-2);color:var(--muted)}
.fact-val{font-size:.88rem;margin:4px 0 4px;white-space:pre-wrap}
.fact-val.empty{color:var(--muted);font-style:italic}
.fact-tools{display:flex;gap:12px}
.fact textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:var(--radius-s);padding:8px;background:var(--surface-2);font-size:.88rem;margin:6px 0}
.skipped{margin-top:14px;font-size:.82rem;color:var(--muted)}
.log{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.log-item{font-size:.82rem;margin-bottom:9px}
.log-item b{font-weight:600}
.log-item div{color:var(--muted)}

/* Result */
.result{max-width:1000px;margin:0 auto;padding:10px 0 80px;--hero:var(--accent)}
.result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:44px 48px}
.doc h1{font-size:clamp(2rem,4vw,2.8rem);margin-bottom:12px}
.doc .summary{font-size:1.1rem;color:var(--muted);max-width:62ch}
.doc h2{font-size:1.35rem;margin:38px 0 14px}
.keyfacts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.keyfact{background:var(--surface-2);border-radius:var(--radius-m);padding:14px 16px}
.keyfact b{display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.strategies{display:grid;gap:14px}
.strategy{border:1px solid var(--line);border-radius:var(--radius-m);padding:18px 20px}
.strategy.recommended{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.strategy h3{font-size:1.15rem;margin-bottom:6px}
.strategy ul{margin:10px 0;padding-left:20px}
.strategy .pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.88rem;margin-top:8px}
.rec-note{font-size:.8rem;color:var(--accent);font-weight:600;margin-bottom:4px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:8px;margin-bottom:12px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.2rem}
.plainlist{padding-left:20px;margin:0}
.plainlist li{margin-bottom:6px}
.assume-list li{margin-bottom:8px}
.facts-table{width:100%;border-collapse:collapse;font-size:.9rem}
.facts-table td{border-top:1px solid var(--line);padding:8px 8px 8px 0;vertical-align:top}
.facts-table td:first-child{font-weight:600;width:32%}

/* Live-Ansicht */
.live{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:22px 24px;margin-top:18px}
.qcard .live{border:0;padding:0;margin:0}
.live-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.live-head svg{width:30px;height:30px;animation:spin 2.4s ease-in-out infinite;flex:none}
.live-head b{font-family:var(--display);font-size:1.15rem;flex:1}
.live-time{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--accent);font-variant-numeric:tabular-nums}
.steps-live{list-style:none;margin:0 0 14px;padding:0}
.steps-live li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:5px 0;color:var(--muted);font-size:.92rem}
.steps-live li.active{color:var(--ink);font-weight:600}
.steps-live li.done{color:var(--ink)}
.steps-live .st{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.steps-live li.done .st{background:var(--ok);border-color:var(--ok)}
.steps-live li.active .st{border-color:var(--accent);background:var(--accent-soft);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--accent-soft)}}
.steps-live .t{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);font-weight:400}
.estbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:2px 0 6px}
.estbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.estbar.indet i{width:30%;animation:indet 1.4s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.live-meta{font-size:.8rem;color:var(--muted);margin-bottom:12px}
.snips{border-left:3px solid var(--accent-soft);padding-left:12px;margin:0 0 12px}
.snip{font-size:.9rem;margin-bottom:4px}
.snip b{color:var(--muted);font-weight:500;margin-right:4px}
.live details{margin-top:8px}
.live summary,.inspector summary{cursor:pointer;font-size:.85rem;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border-radius:var(--radius-s);padding:10px 12px;max-height:220px;overflow:auto;margin:6px 0 0;color:var(--muted)}
.live-foot{display:flex;align-items:center;gap:12px;margin-top:14px}
.statline{font-size:.8rem;color:var(--muted);margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inspector{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:20px 22px;margin:0 0 40px}
.inspector h3{font-size:1.05rem;margin-bottom:4px}
.call{border-top:1px solid var(--line);padding:10px 0}
.call summary{color:var(--ink);font-size:.9rem}
.call summary span{color:var(--muted)}
.call h4{font-size:.8rem;margin:12px 0 0;color:var(--muted);font-weight:600}
/* Gestaltungs-Steckbrief */
.notice{border:1px solid var(--assume);background:var(--assume-bg);border-radius:var(--radius-m);padding:10px 14px;margin-bottom:14px;font-size:.9rem}
mark.ph{background:var(--assume-bg);color:var(--assume);border-radius:4px;padding:0 3px;font-weight:600}
.draft{border:1px dashed var(--line);border-radius:var(--radius-m);padding:26px 28px;background:var(--surface-2)}
.draft .hl{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.15;margin:0 0 6px}
.draft .sl{font-size:1.05rem;color:var(--muted);margin:0 0 18px}
.draft .blk{margin-bottom:14px}
.draft .blk b{display:block;font-family:var(--display);font-size:1rem;margin-bottom:2px}
.draft .cta{display:inline-block;margin-top:6px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:6px 16px;font-weight:600}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
.sw{display:flex;align-items:center;gap:8px;font-size:.8rem}
.sw i{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);flex:none}
.sw span{line-height:1.25}
.sw small{color:var(--muted);display:block}
.layout-list{margin:8px 0 10px;padding-left:22px}
.layout-list li{margin-bottom:3px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:.9rem;margin:8px 0}
.dl b{color:var(--muted);font-weight:600}

/* Ergebnisseite */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:40px 44px;margin-bottom:18px;display:flex;gap:32px;align-items:center;
  background:color-mix(in srgb, var(--hero) 14%, var(--surface));border:1px solid color-mix(in srgb, var(--hero) 30%, var(--line))}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--hero)}
.hero-text{flex:1;min-width:0}
.hero h1{font-size:clamp(2.1rem,4.6vw,3.4rem);font-weight:700;margin:12px 0 12px;text-wrap:balance}
.hero p{font-size:1.12rem;margin:0;max-width:60ch;color:var(--ink);opacity:.82}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap}
.hero-tags span{font-size:.8rem;border-radius:999px;padding:3px 11px;background:var(--surface);border:1px solid color-mix(in srgb, var(--hero) 40%, var(--line))}
.hero-tags span:first-child{background:var(--hero);border-color:var(--hero);color:var(--hero-on,#fff);font-weight:600}
.hero-pal{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.hero-pal i{width:56px;height:56px;border-radius:14px;border:1px solid rgba(0,0,0,.08)}
.hero-needle{width:110px;height:110px;flex:none;color:var(--ink);transform:rotate(18deg)}
.glance{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.gcard b{display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.gcard p{margin:0}
.gcard.big{grid-column:span 2;background:var(--hero);border-color:var(--hero);color:var(--hero-on,#fff)}
.gcard.big b{color:inherit;opacity:.75}
.gcard.big p{font-family:var(--display);font-size:1.45rem;font-weight:600;line-height:1.25}
.gcard.health{grid-column:span 3}
.hbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 8px}
.hbar i{display:block;min-width:6px}
.hbar .bestaetigt{background:var(--ok)} .hbar .annahme{background:var(--assume)} .hbar .pruefen{background:var(--review)} .hbar .leer{background:var(--line)}
.gcard.health p{color:var(--muted)}
.rs{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 28px;margin-bottom:18px}
.rs-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.rs-head h2{font-size:1.4rem}
.rs-head p{margin:0}
.draft-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-weight:500}
.tabs button i{width:12px;height:12px;border-radius:50%;background:var(--tc)}
.tabs button em{font-style:normal;font-size:.72rem;color:var(--accent);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}
.studio-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:30px;align-items:start}
.pv-stage{background:repeating-linear-gradient(45deg,var(--surface-2) 0 10px,var(--bg) 10px 20px);border-radius:16px;padding:28px;display:flex;justify-content:center}
.studio-idea{font-size:1.1rem;margin:0 0 12px}
.swatches.big .sw i{width:44px;height:44px;border-radius:10px}
.pc .pro,.pc .con{border-radius:10px;padding:10px 12px}
.pc .pro{background:var(--ok-bg)} .pc .con{background:var(--review-bg)}
.pc b{display:block;font-size:.78rem;margin-bottom:2px}
.why{margin-top:16px;border-left:4px solid var(--hero);padding:6px 0 6px 14px}
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.scard{position:relative;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:6px}
.scard.rec{border-color:var(--hero);box-shadow:0 0 0 1px var(--hero)}
.scard h3{font-size:1.2rem}
.scard p{margin:0}
.scard ul{margin:4px 0 8px;padding-left:20px;flex:1}
.scard .pc{grid-template-columns:1fr;gap:6px;font-size:.86rem}
.ribbon{align-self:flex-start;background:var(--hero);color:var(--hero-on,#fff);font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 10px}
.stepcount{margin-left:auto;font-size:.85rem;color:var(--muted)}
.sbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:-6px 0 16px}
.sbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.checklist{list-style:none;margin:0;padding:0}
.ci{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0;position:relative}
.ci b{display:block}
.ci span{color:var(--muted);font-size:.92rem}
.ci.on b{text-decoration:line-through;color:var(--muted)}
.cbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--surface);padding:0;margin-top:1px;position:relative;z-index:1}
.cbox:hover{border-color:var(--ok)}
.ci.on .cbox{background:var(--ok);border-color:var(--ok)}
.ci.on .cbox::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.timeline .ci:not(:last-child)::before{content:"";position:absolute;left:10px;top:34px;bottom:-6px;width:2px;background:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two .rs{margin-bottom:18px}
.risks{margin:0;padding:0;list-style:none}
.risks li{padding:9px 0 9px 26px;border-top:1px solid var(--line);position:relative}
.risks li:first-child{border-top:0}
.risks li::before{content:"";position:absolute;left:4px;top:15px;width:10px;height:10px;transform:rotate(45deg);background:var(--assume)}
.akte summary{display:flex;align-items:baseline;gap:12px;cursor:pointer;list-style:none}
.akte summary::-webkit-details-marker{display:none}
.akte summary h2{font-size:1.2rem}
.akte[open] summary{margin-bottom:14px}

/* Vertiefungen */
.module{max-width:1000px;margin:0 auto;padding:10px 0 80px}
.result-actions .spacer{flex:1}
.m-hero{display:flex;gap:20px;align-items:center;margin:6px 0 20px}
.m-hero h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:700}
.m-hero p{margin:6px 0 0;color:var(--muted);font-size:1.05rem;max-width:60ch}
.m-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent)}
.m-icon svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.m-summary{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:22px 26px;margin-bottom:18px}
.m-summary b{font-size:.82rem;opacity:.8;font-weight:600}
.m-summary p{margin:4px 0 0;font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.3}
.m-next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 16px;margin:0 0 18px}
.m-next span{flex:1;min-width:200px}
.m-box{background:var(--surface-2);border-radius:14px;padding:16px 18px;margin-top:14px}
.m-box h4,.m-sub{font-family:var(--display);font-size:1rem;margin:0 0 8px}
.m-sub{margin-top:22px}
.m-box p{margin:0}
.m-box.warn{background:var(--review-bg)}
.m-box.tip{background:var(--ok-bg)}
.m-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.m-two .m-box{margin-top:14px}
.mlist{margin:0;padding-left:18px}
.mlist li{margin-bottom:4px}
.mlist.assume li::marker{color:var(--assume)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chiprow span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
.chiprow.pick{margin:8px 0}
.chiprow .chip{padding:6px 12px;font-size:.88rem}
.deeper-title{font-size:1.15rem;margin:30px 0 4px}
.side-mods{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
/* Kacheln */
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.mtiles.compact{margin-top:12px}
.mtile{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;transition:border-color .15s,background .15s}
.mtile:hover{border-color:var(--accent);background:var(--accent-soft)}
.mtile .m-icon{width:40px;height:40px;border-radius:12px}
.mtile .m-icon svg{width:21px;height:21px}
.mt-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.mt-text b{font-family:var(--display);font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt-text em{font-style:normal;font-size:.7rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.mt-text em.ok{color:var(--ok);background:var(--ok-bg)}
.mt-text>span{font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mtile.done .m-icon{background:var(--ok-bg);color:var(--ok)}
/* Schärfen */
.sq-item{margin-bottom:18px}
.sq-item label{display:block;margin-bottom:6px}
.sq-item label b{display:block}
.sq-item label small{color:var(--muted)}
/* Problem */
.pr-statement{border-left:6px solid var(--accent);padding:4px 0 4px 18px;margin-bottom:16px}
.pr-statement b,.hmw b{font-size:.82rem;color:var(--muted);font-weight:600}
.pr-statement p{font-family:var(--display);font-size:1.45rem;font-weight:600;line-height:1.25;margin:4px 0 0}
.hmw{background:var(--accent-soft);border-radius:14px;padding:14px 18px;margin-bottom:20px}
.hmw p{margin:4px 0 0;font-size:1.1rem;font-weight:500}
.pr-grid{display:grid;grid-template-columns:1fr 36px 1.4fr;gap:10px;align-items:start}
.pr-col h4{font-family:var(--display);margin:0;font-size:1.05rem}
.pr-col>p{margin:0 0 10px}
.pr-arrow{align-self:center;height:2px;background:var(--line);position:relative}
.pr-arrow::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left-color:var(--line);border-right:0}
.mlist.sym li{margin-bottom:8px}
.cause{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.cause-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.why-chain{list-style:none;margin:8px 0 0;padding:0}
.why-chain li{position:relative;padding:3px 0 3px 22px;font-size:.88rem;color:var(--muted)}
.why-chain li::before{content:"weil";position:absolute;left:0;top:5px;font-size:.62rem;font-weight:600;color:var(--accent)}
.why-chain li:first-child::before{content:"↳";font-size:.9rem;top:2px}
.mlist.no li::marker{content:"✕  ";color:var(--review)}
/* Personas */
.personas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.persona{position:relative;border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--av)}
.persona.prim{box-shadow:0 0 0 1px var(--av)}
.persona .ribbon{position:absolute;top:14px;right:14px;background:var(--av);color:#fff}
.p-head{display:flex;gap:12px;align-items:center;padding-right:96px}
.p-head h3{font-size:1.1rem}
.avatar{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.3rem;background:color-mix(in srgb, var(--av) 18%, var(--surface));color:var(--av)}
.persona blockquote{margin:0;font-family:var(--display);font-size:1.05rem;font-weight:500;padding-left:12px;border-left:3px solid color-mix(in srgb, var(--av) 50%, transparent)}
.persona>p{margin:0;color:var(--muted)}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.p-grid h5,.sh-row h5{margin:0 0 4px;font-size:.78rem;color:var(--muted);font-weight:600}
.p-grid .mlist{font-size:.88rem}
.p-conv{background:color-mix(in srgb, var(--av) 12%, var(--surface));border-radius:10px;padding:10px 12px;font-size:.9rem}
.p-conv b{display:block;font-size:.76rem;margin-bottom:2px}
/* Inhaltsplan */
.ip-head .hbar{height:12px}
.ip-head p{margin:0 0 6px}
.hbar .ip-vorhanden{background:var(--ok)} .hbar .ip-entwurf{background:var(--assume)} .hbar .ip-fehlt{background:var(--review)}
.ip-list{margin-top:16px;display:flex;flex-direction:column}
.ip-row{display:grid;grid-template-columns:56px 1fr 170px;gap:14px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.prio{font-size:.72rem;font-weight:600;text-align:center;border-radius:6px;padding:3px 0;text-transform:capitalize}
.prio-muss{background:var(--ink);color:var(--surface)} .prio-soll{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)} .prio-kann{color:var(--muted);border:1px dashed var(--line)}
.ip-main b{display:block}
.ip-main span{color:var(--muted);font-size:.92rem}
.ip-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.ip-meta small{color:var(--muted);font-size:.78rem}
.ipst{font-size:.74rem;border-radius:6px;padding:2px 8px}
.ipst.ip-vorhanden{background:var(--ok-bg);color:var(--ok)} .ipst.ip-entwurf{background:var(--assume-bg);color:var(--assume)} .ipst.ip-fehlt{background:var(--review-bg);color:var(--review)}
/* Stakeholder */
.smatrix{display:grid;grid-template-columns:28px 1fr;grid-template-rows:1fr auto;gap:6px}
.ax{font-size:.78rem;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center}
.ax-y{writing-mode:vertical-rl;transform:rotate(180deg)}
.ax-y::after{content:"\00a0→\00a0hoch"}
.ax-x{grid-column:2}
.ax-x::after{content:"\00a0→\00a0hoch"}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sq{border-radius:14px;padding:14px;min-height:130px;background:var(--surface-2)}
.sq-hh{background:var(--accent-soft)}
.sq b{font-family:var(--display);display:block}
.sq small{color:var(--muted);font-size:.78rem}
.sq-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sq-chips span{border-radius:999px;padding:3px 10px;font-size:.84rem;font-weight:500;background:var(--surface);border:2px solid var(--line)}
.sq-chips em{color:var(--muted);font-size:.85rem}
.hal-unterstuetzend{border-color:var(--ok)!important} .hal-neutral{border-color:var(--muted)!important} .hal-kritisch{border-color:var(--review)!important}
.lg{width:12px;height:12px;border-radius:50%;border:2px solid;display:inline-block}
.sh-list{margin-top:18px}
.sh-row{display:grid;grid-template-columns:1fr 1.2fr 1.4fr;gap:16px;padding:12px 0;border-top:1px solid var(--line);font-size:.92rem}
.sh-row small{display:block;color:var(--muted);font-size:.8rem}
/* SWOT */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swq{border-radius:14px;padding:16px 18px}
.swq h4{font-family:var(--display);font-size:1.15rem;margin:0}
.swq small{display:block;color:var(--muted);font-size:.76rem;margin-bottom:8px}
.swq.s{background:var(--ok-bg)} .swq.w{background:var(--assume-bg)} .swq.o{background:var(--accent-soft)} .swq.t{background:var(--review-bg)}
.sw-strat{display:flex;flex-direction:column;gap:10px}
.sw-strat>div{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.sw-strat small{display:block;color:var(--muted);font-size:.8rem}
.swtag{font-family:var(--display);font-weight:700;font-size:.85rem;text-align:center;border-radius:8px;padding:4px 0;background:var(--surface-2)}
.swtag-SO{background:var(--ok-bg);color:var(--ok)} .swtag-WO{background:var(--accent-soft);color:var(--accent)} .swtag-ST{background:var(--assume-bg);color:var(--assume)} .swtag-WT{background:var(--review-bg);color:var(--review)}
@media (max-width: 760px){
  .m-two,.p-grid,.swot,.sh-row{grid-template-columns:1fr}
  .pr-grid{grid-template-columns:1fr}
  .pr-arrow{display:none}
  .ip-row{grid-template-columns:48px 1fr}
  .ip-meta{grid-column:2;align-items:flex-start;text-align:left;flex-direction:row;gap:8px}
  .m-hero .m-icon{display:none}
  .result-actions .btn.tiny{display:none}
}

/* ---------- Design-Studio ---------- */
.studio-page{max-width:1240px;margin:0 auto;padding:10px 0 80px}
.ds-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start}
.ds-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 18px 18px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.ds-panel details{border-bottom:1px solid var(--line);padding:12px 0}
.ds-panel summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.02rem;list-style:none;display:flex;gap:8px;align-items:baseline}
.ds-panel summary::-webkit-details-marker{display:none}
.ds-panel summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin-right:4px;transition:transform .15s;align-self:center}
.ds-panel details[open] summary::before{transform:rotate(45deg)}
.ds-panel details[open] summary{margin-bottom:10px}
.ds-l{display:block;font-size:.82rem;color:var(--muted);margin-bottom:10px}
.ds-l .input,.ds-l textarea{margin-top:4px;color:var(--ink);font-size:.92rem}
.ds-panel textarea.input{resize:vertical}
.ds-formats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ds-fmt{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px;text-align:left}
.ds-fmt b{display:block;font-size:.85rem}
.ds-fmt span{font-size:.7rem;color:var(--muted)}
.ds-fmt.on,.ds-lay.on{border-color:var(--accent);background:var(--accent-soft)}
.ds-layouts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ds-lay{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem}
.ds-lay svg{width:34px;height:47px}
.ds-block{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ds-block .input{font-size:.9rem}
.ds-drop{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:16px;cursor:pointer;margin-bottom:10px}
.ds-drop:hover,.ds-drop.over{border-color:var(--accent);background:var(--accent-soft)}
.ds-drop span{font-size:.78rem;color:var(--muted)}
.ds-asset{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ds-thumb{width:64px;height:64px;border-radius:10px;background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0/12px 12px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
.ds-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.ds-asset-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.ds-asset-f .row{display:grid;grid-template-columns:1fr 1.4fr;gap:6px}
.ds-asset-f .row .linkbtn{grid-column:1/-1;justify-self:start}
.ds-asset-f select{width:100%;min-width:0;padding:5px 8px;font-size:.85rem}
.ds-asset-f textarea{font-size:.85rem}
.ds-colors{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.ds-colors label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted)}
.ds-colors input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.ds-fonts{gap:8px;align-items:flex-start}
.ds-go{width:100%;margin-top:14px;padding:12px}
.ds-cta{margin-top:14px}
.ds-empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:46px 30px;text-align:center}
.ds-empty svg{width:120px;height:120px}
.ds-empty h2{font-size:1.5rem;margin:8px 0}
.ds-empty p{max-width:52ch;margin:0 auto 18px}
.ds-refine{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.ds-refine textarea{min-height:56px}
.ds-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ds-toolbar .spacer{flex:1}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:5px 14px;font-size:.85rem}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.vbtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.8rem}
.vbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.ds-stage{background:repeating-linear-gradient(45deg,var(--surface-2) 0 10px,var(--bg) 10px 20px);border-radius:20px;padding:34px;display:flex;justify-content:center;min-height:420px}
.ds-stage.web{padding:22px}
.ds-paper{width:100%;max-width:440px}
.ds-paper.fmt-a5_quer{max-width:640px}
.ds-paper.fmt-din_lang{max-width:300px}
.ds-paper.fmt-story{max-width:340px}
.ds-paper.fmt-quadrat{max-width:520px}
.ds-paper .fl{box-shadow:0 22px 50px -20px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.12)}
.ds-ovf{background:var(--assume-bg);color:var(--ink);border:1px solid var(--assume);border-radius:10px;padding:9px 14px;margin:12px 0 0;font-size:.9rem}
.ds-tip{margin:10px 0 0}
.ds-info{display:grid;grid-template-columns:1fr 1fr;gap:12px}
[contenteditable="true"]{outline:none;border-radius:3px;cursor:text}
[contenteditable="true"]:hover{box-shadow:0 0 0 1px rgba(127,127,127,.5)}
[contenteditable="true"]:focus{box-shadow:0 0 0 2px var(--accent)}

/* Flyer */
.flc{container-type:inline-size;width:100%}
.fl{--s:1;aspect-ratio:var(--ratio);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:3.4cqw;padding:7cqw;color:var(--ftx);font-family:var(--ftf);line-height:1.3}
.fl mark.ph{background:color-mix(in srgb,var(--fac) 25%,transparent);color:inherit;padding:0 .2em;border-radius:2px}
.fz{display:flex;flex-direction:column;gap:2.4cqw;position:relative;z-index:2;flex-shrink:0}
.fz-kopf{z-index:4}
.fz:empty{display:none}
.fz-kopf{flex-direction:row;flex-wrap:wrap;align-items:center;gap:3cqw}
.fz-kopf>.el{flex:0 1 auto}
.fz-mitte{flex:1 1 0;min-height:0;overflow:hidden}
.fz-fuss{flex-direction:row;flex-wrap:wrap;align-items:center;gap:3cqw;margin-top:auto}
.fz-fuss>.el-cta{flex:1 1 auto}
.el{--k:1;min-width:0;overflow-wrap:break-word;hyphens:auto}
.sz-s{--k:.8}.sz-l{--k:1.22}.sz-xl{--k:1.5}
.fz>.al-mitte{align-self:center;text-align:center}
.fz>.al-rechts{align-self:flex-end;text-align:right}
.fz-kopf>.al-mitte,.fz-fuss>.al-mitte{margin-inline:auto}
.fz-kopf>.al-rechts,.fz-fuss>.al-rechts{margin-left:auto}
.el-headline{font-family:var(--fhf);font-weight:700;font-size:calc(9cqw*var(--k)*var(--s));line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
.el-subline{font-size:calc(4.4cqw*var(--k)*var(--s));opacity:.88;line-height:1.3}
.el-text{font-size:calc(3.5cqw*var(--k)*var(--s));line-height:1.4}
.el-liste{font-size:calc(3.5cqw*var(--k)*var(--s));display:flex;flex-direction:column;gap:1cqw}
.el-liste>div{padding-left:3.4cqw;position:relative}
.el-liste>div::before{content:"";position:absolute;left:0;top:.55em;width:1.4cqw;height:1.4cqw;border-radius:50%;background:var(--fac)}
.el-info{font-size:calc(3.7cqw*var(--k)*var(--s))}
.el-info b{font-family:var(--fhf);color:var(--fac)}
.el.bt{font-weight:700}
.el-text.bt,.el-info.bt{background:var(--ffl);color:var(--fflt);padding:2.6cqw 3cqw;border-radius:2cqw}
.el-cta span{display:inline-block;background:var(--fac);color:var(--fon);border-radius:999px;padding:2.4cqw 5cqw;font-weight:700;font-size:calc(4cqw*var(--k)*var(--s))}
.el-logo{height:calc(9cqw*var(--k));width:auto;max-width:42%;object-fit:contain;display:block}
.el-logo.phbox{width:22cqw;font-size:2.8cqw}
.el-bild{height:calc(30cqw*var(--k));border-radius:2cqw;overflow:hidden;flex:none;width:100%}
.el-bild img{width:100%;height:100%;object-fit:cover;display:block}
.phbox{display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px dashed color-mix(in srgb,var(--ftx) 35%,transparent);background:color-mix(in srgb,var(--fac) 12%,transparent);font-size:3cqw;opacity:.85;padding:2cqw;border-radius:2cqw}
.el-qr{display:flex;flex-direction:column;align-items:center;gap:1cqw;font-size:2.4cqw}
.qrbox{width:calc(15cqw*var(--k));aspect-ratio:1;background:conic-gradient(var(--ftx) 25%,transparent 0 50%,var(--ftx) 0 75%,transparent 0) 0 0/25% 25%;border:1.2cqw solid var(--ftx);opacity:.85}
.el-deko{height:.8cqw;width:16cqw;background:var(--fac);border-radius:1cqw}
/* Layouts */
.fl-bild_oben{padding-top:0}
.fl-bild_oben .fz-hero>.el-bild:first-child{order:-1;margin:0 -7cqw;width:calc(100% + 14cqw);border-radius:0;height:calc(42cqw*var(--k))}
.fl-bild_oben .fz-kopf{position:absolute;top:4.5cqw;left:7cqw;right:7cqw}
.fl-bild_oben:not(:has(.fz-hero>.el-bild:first-child)){padding-top:7cqw}
.fl-bild_oben:not(:has(.fz-hero>.el-bild:first-child)) .fz-kopf{position:relative;inset:auto}
.fl-vollbild{justify-content:flex-end}
.fl-vollbild .fz-hero>.el-bild{position:absolute;inset:0;height:auto;width:auto;border-radius:0;z-index:0}
.fl-vollbild .fz-hero{position:static}
.fl-vollbild .fz-hero>:not(.el-bild){position:relative;z-index:2}
.fl-vollbild:has(.fz-hero>.el-bild)::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 15%,color-mix(in srgb,var(--fbg) 92%,transparent) 62%)}
.fl-vollbild .fz-kopf{position:absolute;top:6cqw;left:7cqw;right:7cqw}
.fl-vollbild .fz-mitte{flex:0 1 auto}
.fl-geteilt{padding-top:0}
.fl-geteilt .fz-hero{background:var(--fac);color:var(--fon);margin:0 -7cqw;padding:9cqw 7cqw 7cqw}
.fl-geteilt .fz-kopf{background:var(--fac);color:var(--fon);margin:0 -7cqw -3.4cqw;padding:5cqw 7cqw 0}
.fl-geteilt .fz-hero .el-bild{border-radius:1.5cqw}
.fl-spalte{border-left:3.4cqw solid var(--fac);padding-left:7cqw}
.fl-zentriert{text-align:center}
.fl-zentriert .fz{align-items:center}
.fl-zentriert .fz>.el{align-self:center;text-align:center;margin-inline:auto}
.fl-zentriert .el-bild{width:42cqw;height:42cqw;border-radius:50%}
.fl-zentriert .el-liste>div{padding-left:0}
.fl-zentriert .el-liste>div::before{display:none}
.fl-raster .fz-mitte{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw;align-content:start}
.fl-raster .fz-mitte>.el{background:var(--ffl);color:var(--fflt);padding:3cqw;border-radius:2cqw;align-self:stretch;text-align:left}
.fl-raster .fz-mitte>.el-bild{padding:0;grid-column:span 2}
.fl-quer{--s:.5;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;column-gap:5cqw;padding:5cqw}
.fl-quer .fz-kopf,.fl-quer .fz-fuss{grid-column:1/-1}
.fl-quer .fz-hero{grid-column:1;grid-row:2;justify-content:center}
.fl-quer .fz-mitte{grid-column:2;grid-row:2}
.fl-quer .fz-hero,.fl-quer .fz-mitte{min-height:0;overflow:hidden}
.fl-quer .el-bild{height:calc(15cqw*var(--k))}
.fl-quer.fl-zentriert .el-bild{width:17cqw;height:17cqw}
.fl-quer .fz{gap:1.6cqw}
.fl-quer.fl-bild_oben .fz-hero>.el-bild:first-child{margin:0;width:100%;border-radius:1.5cqw}
.fl-quer.fl-bild_oben .fz-kopf{position:relative;inset:auto}
.fl-quer.fl-bild_oben{padding-top:5cqw}
.fl-quer.fl-geteilt .fz-hero{margin:0;padding:4cqw;border-radius:1.5cqw}
.fl-quer.fl-geteilt .fz-kopf{margin:0;padding:0;background:none;color:inherit}
.fl-quer.fl-geteilt{padding-top:5cqw}
.fl-schmal{--s:1.15}

/* Regelbasierter Flyer: alle Größen hängen am Anpassungsfaktor --fit */
.fl2{--pad:max(4.5cqw,calc(7cqw*var(--fit)));padding:var(--pad);gap:calc(3.2cqw*var(--fit))}
.fl2.fl-bild_oben .fz-hero>.el-bild:first-child{margin:0 calc(-1*var(--pad));width:calc(100% + 2*var(--pad))}
.fl2.fl-bild_oben .fz-kopf{left:var(--pad);right:var(--pad)}
.fl2.fl-geteilt .fz-hero{margin:0 calc(-1*var(--pad));padding:calc(var(--pad)*1.2) var(--pad) var(--pad)}
.fl2.fl-geteilt .fz-kopf{margin:0 calc(-1*var(--pad)) calc(-3.2cqw*var(--fit));padding:var(--pad) var(--pad) 0}
.fl2.fl-geteilt.fl-karte .fz-hero{border-radius:0}
.fl2.fl-vollbild .fz-kopf{position:relative;top:auto;left:auto;right:auto}
.fl2.fl-vollbild .fz-hero{margin-top:auto}
.fl2.fl-spalte{padding-left:calc(var(--pad) + 3.4cqw)}
.fl2.fl-quer{--pad:max(3.4cqw,calc(4.6cqw*var(--fit)))}
.fl2.fl-quer.fl-bild_oben{padding-top:var(--pad)}
.fl2.fl-quer.fl-bild_oben .fz-kopf{position:relative;left:auto;right:auto;top:auto}
.fl2.fl-quer .fz-hero>.el-bild:first-child{margin:0;width:100%;height:calc(20cqw*var(--fit));border-radius:1.5cqw}
.fl2.fl-quer.fl-geteilt .fz-hero{margin:0;padding:calc(3cqw*var(--fit));border-radius:1.5cqw}
.fl2.fl-quer.fl-geteilt .fz-kopf{margin:0;padding:0;background:none;color:inherit}
.fl2.fl-quer .el-fakten.n3{grid-template-columns:repeat(2,minmax(0,1fr))}
.fl2 .fz-seite:empty{display:none}
.fl2.fl-quer.has-seite{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;padding-right:calc(40% + var(--pad))}
.fl2.fl-quer.has-seite .fz-kopf{grid-column:1;grid-row:1}
.fl2.fl-quer.has-seite .fz-hero{grid-column:1;grid-row:2}
.fl2.fl-quer.has-seite .fz-mitte{grid-column:1;grid-row:3}
.fl2.fl-quer.has-seite .fz-fuss{grid-column:1;grid-row:4}
.fl2.fl-quer.has-seite .fz-seite{position:absolute;top:0;right:0;bottom:0;width:40%;margin:0;background:none;padding:0;z-index:1}
.fl2 .fz-seite .el-bild{height:100%;width:100%;border-radius:0}
.fl2 .el-logo{height:calc(8cqw*var(--fit)*var(--s))}
.fl2 .qrbox{width:calc(13cqw*var(--fit)*var(--s))}
.fl2 .el-qr span{font-size:calc(2.4cqw*var(--s))}
.fl2 .fz{gap:calc(2.3cqw*var(--fit))}
.fl2 .el-headline{font-size:calc(9cqw*var(--k)*var(--s)*var(--fit))}
.fl2 .el-subline{font-size:calc(4.3cqw*var(--k)*var(--s)*var(--fit))}
.fl2 .el-logo{height:calc(8cqw*var(--fit))}
.fl2 .el-bild{height:calc(30cqw*var(--k)*var(--fit))}
.fl2 .el-bild.sz-s{--k:.72}
.fl2.fl-bild_oben .fz-hero>.el-bild:first-child{height:calc(44cqw*var(--fit))}
.fl2.fl-bild_oben{padding-top:0}
.fl2.fl-zentriert .el-bild{width:calc(36cqw*var(--fit));height:calc(36cqw*var(--fit))}
.fl2 .el-cta span{font-size:calc(4cqw*var(--s)*var(--fit));padding:calc(2.3cqw*var(--fit)) calc(5cqw*var(--fit))}
.fl2 .qrbox{width:calc(13cqw*var(--fit))}
.el-badge{background:var(--fac);color:var(--fon);border-radius:2cqw;padding:calc(2.4cqw*var(--fit)) calc(3.4cqw*var(--fit));font-size:calc(4.3cqw*var(--s)*var(--fit));font-weight:700;line-height:1.25;display:flex;flex-direction:column;gap:.4cqw;align-self:stretch}
.el-badge b{font-size:.62em;font-weight:600;opacity:.85}
.fl-zentriert .el-badge{text-align:center}
.el-fakten{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(2cqw*var(--fit));align-self:stretch}
.el-fakten.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.el-fakten>div{background:var(--ffl);color:var(--fflt);border-radius:2cqw;padding:calc(2.3cqw*var(--fit)) calc(2.6cqw*var(--fit));display:flex;flex-direction:column;gap:.5cqw;font-size:calc(3.4cqw*var(--s)*var(--fit));line-height:1.3;border-top:.8cqw solid var(--fac);text-align:left}
.el-fakten b{font-family:var(--fhf);font-size:.82em;opacity:.8}
.el-info2{border-left:calc(1cqw*var(--fit)) solid var(--fac);padding-left:calc(2.6cqw*var(--fit));font-size:calc(3.6cqw*var(--s)*var(--fit));display:flex;flex-direction:column;line-height:1.3}
.el-info2 b{font-family:var(--fhf);font-size:.82em;opacity:.8}
.fl2 .el-text{font-size:calc(3.5cqw*var(--s)*var(--fit));line-height:1.4;display:flex;flex-direction:column}
.fl2 .el-text b,.el-liste2>b{font-family:var(--fhf);font-size:1.1em;margin-bottom:.5cqw}
.el-liste2{font-size:calc(3.5cqw*var(--s)*var(--fit));display:flex;flex-direction:column}
.el-liste2 .li{display:flex;flex-direction:column;gap:.8cqw}
.el-liste2 .li>div{padding-left:3.4cqw;position:relative}
.el-liste2 .li>div::before{content:"";position:absolute;left:0;top:.5em;width:1.4cqw;height:1.4cqw;border-radius:50%;background:var(--fac)}
.fl-zentriert .el-liste2 .li>div{padding-left:0}
.fl-zentriert .el-liste2 .li>div::before{display:none}
.fl-zentriert .el-info2{border-left:0;padding-left:0}
.el-klein{font-size:calc(2.9cqw*var(--s)*var(--fit));opacity:.82;line-height:1.35}
.fl-karte .fz-hero,.fl-karte .fz-mitte,.fl-karte .fz-fuss{background:color-mix(in srgb,var(--fbg) 88%,transparent);padding:calc(3.2cqw*var(--fit));border-radius:2.4cqw}
.fl-karte.fl-geteilt .fz-hero{background:var(--fac);border-radius:0}
.fl-raster .fz-mitte>.el-fakten,.fl-raster .fz-mitte>.el-badge{grid-column:span 2;background:none;padding:0}
.fl-raster .fz-mitte>.el-info2{border-left:0;border-top:.8cqw solid var(--fac);padding:2.6cqw}
.ds-fit{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:9px 14px;margin:12px 0 0;font-size:.9rem}
.m-box.rules{background:var(--accent-soft)}

/* Projekte */
.top .btn.tiny{white-space:nowrap}
.startside{display:flex;flex-direction:column;gap:18px}
.srv-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:12px}
.srv-seg button{border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:.84rem;font-weight:500;color:var(--muted)}
.srv-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.conn-help{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2);font-size:.88rem}
.conn-help>b{display:block;margin-bottom:4px}
.conn-help p{margin:0}
.conn-help .howto{margin:8px 0 0;padding-left:18px;color:var(--ink)}

.os{display:block;font-size:.74rem;font-weight:600;color:var(--muted);margin-top:6px}
code.cmd{display:block;font-size:.76rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin-top:3px;overflow-x:auto;white-space:nowrap;user-select:all}
.conn-note{margin:14px 0 0;font-size:.86rem;border-radius:10px;padding:9px 12px}
.conn-note.ok{background:var(--ok-bg)}
.conn-note.warn{background:var(--assume-bg)}
.startlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:18px 20px}
.startlist h3{font-size:1.05rem}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.pcard.cur{border-color:var(--accent);background:var(--accent-soft)}
.pcard-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pcard-main b{font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-main span{font-size:.78rem;color:var(--muted)}
.pbar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:4px;max-width:200px}
.pbar i{display:block;height:100%;background:var(--accent)}
.pcard-act{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.dialog{background:var(--surface);border-radius:20px;padding:22px 24px;width:100%;max-width:640px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.dialog h2{font-size:1.4rem}
.dlg-actions{flex-wrap:wrap;margin:10px 0 6px}
.dlg-actions label.btn{cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* Eigene Layout-Varianten im Auswahlfeld */
.ds-lay-c{position:relative}
.ds-lay-c .ds-lay{width:100%;height:100%}
.ds-lay.own{border-style:solid;border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.ds-lay.own span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ds-lay-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:.8rem;line-height:1;padding:0;color:var(--muted);opacity:0;transition:opacity .15s}
.ds-lay-c:hover .ds-lay-x,.ds-lay-x:focus-visible{opacity:1}
.ds-lay.invent{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:600}
.ds-lay.invent:hover{background:var(--accent-soft)}
.ds-cidea{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:10px 0 0}
@media (hover:none){.ds-lay-x{opacity:1}}
/* Baukasten-Varianten im Flyer */

.lc-farbblock-fuss .fz-fuss{background:var(--fac);color:var(--fon);margin:0 calc(-1*var(--pad)) calc(-1*var(--pad));padding:calc(var(--pad)*.8) var(--pad)}

.lc-deko-kreis .fl-deko{left:-26cqw;bottom:-26cqw;width:76cqw;height:76cqw;border-radius:50%;background:color-mix(in srgb,var(--fac) 14%,transparent)}
.lc-ausrichtung-rechts{text-align:right}
.lc-ausrichtung-rechts .fz{align-items:flex-end}
.lc-ausrichtung-rechts .fz>.el{align-self:flex-end}

.lc-headline_stil-gestapelt .el-headline{word-spacing:100cqw;line-height:.94;--k:1.12}

.lc-headline_stil-unterstrichen .el-headline::after{content:"";display:block;width:18cqw;height:1.1cqw;background:var(--fac);margin-top:2.4cqw}

.lc-headline_stil-kasten .el-headline{border:calc(.9cqw*var(--fit)) solid var(--fac);padding:calc(3cqw*var(--fit)) calc(3.6cqw*var(--fit))}

.lc-bild-kreis_oben .fz-hero>.el-bild{width:calc(34cqw*var(--fit));height:calc(34cqw*var(--fit));border-radius:50%}
.lc-bild-rahmen_mitte .el-bild.rahmen,.el-bild.rahmen{border:calc(1cqw*var(--fit)) solid var(--fac);border-radius:0;height:calc(26cqw*var(--fit))}
.lc-bild-unten_vollbreit .fz-seite{order:9;margin:0 calc(-1*var(--pad)) calc(-1*var(--pad))}
.lc-bild-unten_vollbreit .fz-seite .el-bild{height:calc(34cqw*var(--fit))}
.lc-bild-unten_vollbreit .fz-fuss{margin-top:auto}
.fl2.lc-bild-links_spalte.has-seite,.fl2.lc-bild-rechts_spalte.has-seite{grid-template-columns:minmax(0,1fr)}
.fl2.lc-bild-links_spalte.has-seite .fz-seite,.fl2.lc-bild-rechts_spalte.has-seite .fz-seite{position:absolute;top:0;bottom:0;width:36%;margin:0;z-index:1}

.fe-cta .fe-in{justify-content:center}
.fe .pill{display:inline-block;background:var(--fac);color:var(--fon);border-radius:999px;padding:calc(2.2cqw*var(--es)) calc(4.6cqw*var(--es));font-weight:700;font-size:calc(4.2cqw*var(--es)*var(--s));align-self:flex-start}

.bf-kreis .fe-in{border-radius:50%}

.ds-inv{flex-wrap:wrap;margin-bottom:8px}

.fs.gk{z-index:0;pointer-events:none}

.wscroll{height:640px;overflow:auto;overscroll-behavior:contain}
.wf{container-type:inline-size;background:var(--fbg);color:var(--ftx);font-family:var(--ftf);font-size:15px;line-height:1.5}

.wlogo{height:34px;width:auto;max-width:150px;object-fit:contain}
.wlogo-t{font-family:var(--fhf)}
.wlinks{display:flex;gap:18px;margin-left:auto;font-size:14px}
.wburger{display:none;margin-left:auto;flex-direction:column;gap:4px}
.wburger i{width:20px;height:2px;background:var(--ftx)}
.wsec{padding:clamp(28px,7cqw,72px) 5cqw}

.wbg-dunkel{background:var(--ftx);color:var(--fbg)}

.w2col{display:grid;grid-template-columns:1fr 1fr;gap:5cqw;align-items:center}

.wcenter{text-align:center;display:flex;flex-direction:column;align-items:center}

.wnarrow{max-width:680px}
.wimg{aspect-ratio:4/3;border-radius:12px;overflow:hidden}
.wimg img{width:100%;height:100%;object-fit:cover;display:block}
.wf .phbox{font-size:13px;--ftx:currentColor}

.wf blockquote{margin:0;font-size:1.05em}

.wform{display:flex;flex-direction:column;gap:10px}

.wfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 5cqw;font-size:13px;opacity:.7;border-top:1px solid color-mix(in srgb,var(--ftx) 12%,transparent)}

<div class="wrap">

      <svg class="needle" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><path d="M16 4 L20 16 L16 28 L12 16 Z" fill="var(--accent)"/><path d="M16 16 L20 16 L16 28 L12 16 Z" fill="currentColor" opacity=".55"/></svg>

    <button class="btn tiny" id="saveBtn" hidden>Speichern</button>

  <main id="app"></main>
