server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # Verzeichnisliste als JSON: so findet die App neue Ordner unter design-systems/ von selbst
  location = /design-systems/ {
    autoindex on;
    autoindex_format json;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ =404;
    # Dateien immer beim Server gegenprüfen, damit Änderungen an Designsystemen und Prompts sofort ankommen
    add_header Cache-Control "no-cache";
  }

  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    application/json json;
    text/markdown md;
    text/plain txt;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/webp webp;
    image/gif gif;
    application/zip zip;
    application/vnd.openxmlformats-officedocument.presentationml.presentation pptx;
  }
}
