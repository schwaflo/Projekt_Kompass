name: Prüfen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run.mjs

  index:
    name: Liste der Designsysteme aktualisieren
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-index.mjs
      - name: Änderung einchecken
        run: |
          if ! git diff --quiet design-systems/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "design-systems/index.json aktualisiert" design-systems/index.json
            git push
          fi
